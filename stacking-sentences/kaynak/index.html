<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Stacking Sentences</title>
<style>
  :root{--bh:60px;--pbh:44px}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;background:#1d0f19;color:#fef2e0;
    font-family:Fredoka,Poppins,'Trebuchet MS',sans-serif;user-select:none;-webkit-user-select:none;touch-action:none}
  canvas#c{position:fixed;inset:0;display:block;touch-action:none}

  #sys{position:fixed;z-index:6;display:flex;gap:8px}
  body.land #sys{top:10px;right:10px}
  body.port #sys{right:8px;bottom:calc((var(--bh) - 36px) / 2 + 2px);flex-direction:row;gap:6px}
  #sys button.off{opacity:.45;filter:grayscale(1)}
  #sys button{width:36px;height:36px;border-radius:50%;border:2px solid #f2ac3a;background:rgba(49,26,42,.85);color:#fcdeb1;
    font:700 16px/1 Fredoka,Poppins,sans-serif;box-shadow:0 0 10px rgba(242,172,58,.45);cursor:pointer;padding:0;touch-action:none}

  /* ---------- overlay ---------- */
  #ov{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;padding:14px;
    background:radial-gradient(ellipse at center,rgba(46,25,39,.45),rgba(26,14,23,.82))}
  #ov.show{display:flex}
  .card{width:100%;max-width:500px;max-height:100%;overflow:auto;padding:20px 18px 18px;text-align:center;
    background:linear-gradient(rgba(57,31,49,.94),rgba(39,21,34,.94));border:2px solid #f2ac3a;
    box-shadow:0 0 26px rgba(242,172,58,.45),inset 0 0 30px rgba(242,172,58,.1);border-radius:6px}
  .logo{font-weight:700;line-height:.9;letter-spacing:2px;font-size:clamp(40px,12vw,68px)}
  .logo .a{color:#fcdae6;text-shadow:0 0 6px #f04c88,0 0 18px #f04c88,0 0 34px #f04c88}
  .logo .b{color:#fdefdb;text-shadow:0 0 6px #f1a427,0 0 18px #f1a427,0 0 34px #f1a427}
  .sub{margin:8px 0 12px;color:#ffd23d;letter-spacing:2px;font-size:clamp(12px,3.6vw,15px);white-space:nowrap;text-shadow:0 0 10px rgba(255,190,40,.7)}
  .how{list-style:none;padding:0;margin:0 0 14px;text-align:left;font-size:15px;line-height:1.3;color:#fde7c7}
  .how li{padding:6px 8px 6px 30px;position:relative;border-bottom:1px solid rgba(242,172,58,.13)}
  .how li:before{content:attr(data-i);position:absolute;left:4px;top:6px;width:19px;height:19px;border-radius:4px;
    background:#4f2b44;border:1px solid #f2ac3a;color:#fcdeb1;font-size:12px;text-align:center;line-height:17px}
  .how b{color:#fff}
  .gold{color:#ffc53d!important}.red{color:#ff4d5e!important}
  .big{font:700 26px/1 Fredoka,Poppins,sans-serif;letter-spacing:2px;color:#4a2a00;padding:12px 40px;border-radius:10px;border:3px solid #fff2b0;
    background:linear-gradient(#fff07a,#ffc21a 55%,#d88a00);box-shadow:0 7px 0 #6d4300,0 0 24px rgba(255,190,40,.7);cursor:pointer;margin:4px 0 10px}
  .big:active{transform:translateY(4px);box-shadow:0 3px 0 #6d4300}
  .keys{font-size:12.5px;color:#c3a594;letter-spacing:.3px}
  .best{margin-top:6px;font-size:14px;color:#ffd23d;letter-spacing:1px}
  .go{font-size:clamp(40px,11vw,60px);font-weight:700;color:#ffd0d4;text-shadow:0 0 8px #ff2f5b,0 0 24px #ff2f5b;letter-spacing:2px}
  .stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0}
  .stats div{border:1px solid rgba(242,172,58,.45);padding:8px 6px;background:rgba(54,29,46,.7)}
  .stats span{display:block;font-size:12px;color:#fcdeb1;letter-spacing:1px}
  .stats b{font-size:24px;color:#fff;text-shadow:0 0 8px #f1a427}
  .last{font-size:14px;color:#fde7c7;margin:0 0 14px;line-height:1.35}
  .last i{color:#ffd23d}

  /* ---------- tutorial ---------- */
  .tut .logo{font-size:clamp(30px,9vw,46px)}
  .tut .sub{margin:4px 0 6px}
  .slide{display:none}
  .slide.on{display:block;animation:fin .35s ease}
  @keyframes fin{from{opacity:0;transform:translateX(14px)}to{opacity:1;transform:none}}
  .st{font-size:21px;letter-spacing:1.5px;color:#fce5c2;text-shadow:0 0 10px #f1a427;margin:4px 0 8px}
  .st i{font-style:normal;display:inline-block;background:#4f2b44;border:1px solid #f2ac3a;border-radius:4px;padding:0 7px;margin-right:8px;color:#fcdeb1;font-size:15px;vertical-align:2px}
  .stxt{text-align:left;font-size:15.5px;line-height:1.35;color:#fdebd1;min-height:96px}
  .stxt b{color:#fff}
  .stxt ul{margin:4px 0 0;padding-left:18px}
  .demo{position:relative;height:150px;margin:0 auto 10px;max-width:400px;border-radius:6px;overflow:hidden;
    background-color:#1d0f19;border:2px solid #f25c93;border-bottom-color:#ffbf2a;
    background-image:linear-gradient(rgba(241,164,39,.16) 1px,transparent 1px),linear-gradient(90deg,rgba(241,164,39,.16) 1px,transparent 1px);background-size:26px 26px}
  .dtr{position:absolute;left:6px;right:6px;top:44px;text-align:center;color:#ffe48a;font-weight:700;font-size:14px;text-shadow:0 0 8px rgba(255,190,40,.7)}
  .dlab{position:absolute;left:0;right:0;top:66px;text-align:center;color:#fce5c2;font-weight:700;font-size:12px;text-shadow:0 0 8px #f1a427}
  .mt{position:absolute;left:50%;bottom:calc(100% + 3px);transform:translateX(-50%);font-size:11.5px;font-weight:700;color:#fff;background:rgba(0,0,0,.75);
    border:1px solid var(--c);border-radius:9px;padding:0 7px;white-space:nowrap;text-shadow:none}
  .p3{position:absolute;left:50%;top:44px;transform:translateX(-50%);color:#fcdeb1;font-weight:700;font-size:15px;text-shadow:0 0 8px #f1a427;animation:p3 2.6s infinite;white-space:nowrap}
  @keyframes p3{0%,48%{opacity:0;margin-top:0}56%{opacity:1}90%{opacity:1;margin-top:-22px}100%{opacity:0;margin-top:-26px}}
  .ctxt{position:absolute;left:0;right:0;text-align:center;font-weight:700}
  .chips{position:absolute;left:0;right:0;bottom:12px;display:flex;justify-content:center;gap:4px;align-items:center}
  .chips span{border:1px solid #f2ac3a;color:#fce5c2;border-radius:4px;padding:1px 6px;font-weight:700;font-size:13px;background:rgba(54,29,46,.8)}
  .chips em{color:#fcdeb1;font-style:normal}
  .dots{display:flex;justify-content:center;gap:7px;margin:8px 0}
  .dots b{width:9px;height:9px;border-radius:50%;background:#6b395c;border:1px solid #f2ac3a}
  .dots b.on{background:#fcdeb1;box-shadow:0 0 8px #f1a427}
  .nav{display:flex;gap:10px;justify-content:center;margin-bottom:6px}
  .nb{font:700 18px/1 Fredoka,Poppins,sans-serif;letter-spacing:1px;color:#fce5c2;background:rgba(54,29,46,.9);border:2px solid #f2ac3a;border-radius:8px;
    padding:10px 18px;box-shadow:0 0 10px rgba(242,172,58,.4);cursor:pointer;min-width:120px}
  .nb:disabled{opacity:.3}
  .skip{margin:6px 0 4px;color:#fcdeb1;font-size:14px;text-decoration:underline;cursor:pointer}
  .sec{font:700 17px/1 Fredoka,Poppins,sans-serif;color:#fce5c2;background:transparent;border:2px solid #f2ac3a;border-radius:8px;padding:9px 18px;cursor:pointer;margin-top:4px}

  /* ---------- level select ---------- */
  .lvgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0 6px}
  .lv{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 4px;border-radius:8px;border:2px solid var(--c);cursor:pointer;
    background:linear-gradient(rgba(65,35,56,.95),rgba(41,22,35,.95));box-shadow:0 0 10px var(--c);color:#fef2e0;font-family:Fredoka,Poppins,sans-serif}
  .lv b{font-size:30px;line-height:1;color:#fff;text-shadow:0 0 10px var(--c)}
  .lv span{font-size:15px;font-weight:700;letter-spacing:1px}
  .lv em{font-style:normal;color:#ffd23d;font-size:18px;letter-spacing:2px;text-shadow:0 0 8px rgba(255,190,40,.7)}
  .lv small{font-size:12px;color:#fcdeb1}
  .lv:active{transform:translateY(2px)}
  .row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:4px}
  /* ---------- mistakes list ---------- */
  .mtitle{color:#ff9a3c;font-weight:700;letter-spacing:1px;margin:2px 0 4px;font-size:16px}
  .mlist{text-align:left;max-height:32vh;overflow:auto;border:1px solid rgba(242,172,58,.3);padding:2px 8px;margin:0 0 12px;background:rgba(35,19,30,.6)}
  .mr{display:flex;gap:8px;align-items:flex-start;padding:7px 0;border-bottom:1px solid rgba(242,172,58,.12);font-size:15px}
  .mr:last-child{border-bottom:0}
  .mr b{color:#fff}
  .mr em{color:#ff9a3c;font-style:normal;font-size:13px}
  .mr small{display:block;color:#ceb6a9;font-size:12.5px;margin-top:2px;line-height:1.3}
  .mr small i{color:#ffd23d}
  .mr u{color:#51d663;text-decoration:none;border-bottom:2px solid #51d663}
  .spk{flex:none;width:32px;height:32px;border-radius:50%;border:1px solid #f2ac3a;background:#4f2b44;color:#fff;font-size:14px;cursor:pointer;padding:0}
  .prog{color:#fce5c2;font-size:15px;margin:0 0 10px}
  .prog em{font-style:normal;color:#ffd23d;letter-spacing:2px}
  /* ---------- tutorial extras ---------- */
  .flip3{position:absolute;left:50%;top:34px;width:120px;height:36px;margin-left:-60px;perspective:500px}
  .fin{position:relative;width:100%;height:100%;transform-style:preserve-3d;animation:fl 3.4s infinite}
  .fc{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;align-items:center;justify-content:center;border:2px solid #ff2f5b;
    border-radius:6px;color:#fff;font-weight:700;font-size:19px;background:rgba(255,47,91,.15);box-shadow:0 0 12px #ff2f5b,inset 0 0 8px #ff2f5b;text-shadow:0 0 8px #ff2f5b}
  .fc.bk{transform:rotateY(180deg);background:rgba(255,47,91,.4);font-size:17px}
  @keyframes fl{0%,28%{transform:rotateY(0)}40%,78%{transform:rotateY(180deg)}90%,100%{transform:rotateY(360deg)}}
  .pill{position:absolute;display:flex;align-items:center;gap:5px;border:2px solid var(--c);border-radius:9px;padding:4px 9px;color:#fff;font-weight:700;font-size:14px;
    background:rgba(47,26,41,.95);box-shadow:0 0 9px var(--c)}
  .pill b{background:var(--c);color:#111;border-radius:9px;padding:0 6px;font-size:12px}
  .pj{animation:pj 3.4s infinite}
  @keyframes pj{0%,22%{transform:scale(1)}27%{transform:scale(.88);filter:brightness(1.6)}33%,100%{transform:scale(1)}}

  /* ---------- Tetris English: yeni ekranlar ---------- */
  .card.genis{max-width:560px}
  .card{scrollbar-width:thin;scrollbar-color:#f2ac3a transparent}
  .logo.sm{font-size:clamp(30px,8.5vw,44px)}
  .aciklama{font-size:15px;line-height:1.4;color:#fde7c7;margin:6px 0 12px;text-align:left}
  .aciklama.kucuk{font-size:13px;color:#c3a594}
  /* rehberli ilk cümle (ilk.js): koç baloncuğu ve ekranlar */
  #koc{position:fixed;left:50%;top:50%;transform:translate(-50%,6px);z-index:7;width:max-content;padding:8px 14px;border-radius:12px;pointer-events:none;
    background:rgba(44,24,38,.93);border:1.5px solid #51d663;box-shadow:0 0 16px rgba(81,214,99,.35);color:#51d663;font:600 15.5px/1.3 Fredoka,Poppins,sans-serif;
    text-align:center;letter-spacing:.2px;opacity:0;transition:opacity .2s,transform .2s}
  #koc.show{opacity:1;transform:translate(-50%,0)}
  .ilk-karsila{text-align:center}
  .ilk-karsila .logo{font-size:clamp(34px,10.5vw,60px);margin:6px 0 4px}
  .aciklama.ortali{text-align:center}
  .ilk-baslik{font-size:clamp(28px,8vw,44px)!important}
  .ilk-cumle{position:relative;display:flex;align-items:center;gap:10px;margin:8px 0 10px;padding:10px 12px 10px 50px;min-height:52px;border-radius:10px;background:rgba(81,214,99,.08);border:1px solid rgba(81,214,99,.4);text-align:left}
  .ilk-cumle .dinle{left:10px;top:50%;transform:translateY(-50%)}
  .ilk-cumle b{display:block;font-size:20px;color:#fff}
  .ilk-cumle small{display:block;font-size:14px;color:#72b67b}
  @media (prefers-reduced-motion: reduce){#koc{transition:none}}
  #not{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);z-index:40;max-width:min(92vw,460px);padding:10px 16px;border-radius:10px;
    background:rgba(57,31,49,.96);border:2px solid #ffd23d;color:#fff4c8;font:700 15px/1.3 Fredoka,Poppins,sans-serif;text-align:center;opacity:0;pointer-events:none;transition:.25s;box-shadow:0 0 20px rgba(255,190,40,.5)}
  #not.show{opacity:1;transform:translate(-50%,0)}
  /* ilk giriş */
  .secim{display:flex;align-items:center;gap:12px;width:100%;text-align:left;margin:0 0 8px;padding:10px 12px;border-radius:10px;border:2px solid rgba(242,172,58,.55);
    background:linear-gradient(rgba(65,35,56,.95),rgba(41,22,35,.95));color:#fef2e0;font-family:Fredoka,Poppins,sans-serif;cursor:pointer}

    --o:#5a2a0c;text-shadow:1.5px 0 var(--o),-1.5px 0 var(--o),0 1.5px var(--o),0 -1.5px var(--o),1px 1px var(--o),-1px 1px var(--o),1px -1px var(--o),-1px -1px var(--o),0 3px 0 rgba(40,10,0,.6)}
  .rozet-b{position:relative;width:var(--rz,58px);height:var(--rz,58px);flex:none;border-radius:50%;padding:4px;
    background:conic-gradient(#ffc83d calc(var(--dol,0) * 1turn),rgba(255,255,255,.2) 0);box-shadow:0 4px 0 #2c1f33,0 6px 14px rgba(0,0,0,.35)}
  .rozet-b i{display:flex;align-items:center;justify-content:center;width:100%;height:100%;border-radius:50%;font-size:0;font-style:normal;
    background:radial-gradient(circle at 40% 32%,#4d70b8,#1f2d5c 72%);border:3px solid #a9e4ff;box-shadow:inset 0 -4px 0 rgba(0,0,0,.25),0 0 10px rgba(120,210,255,.5)}
  .rozet-b i:before{content:'';width:64%;height:38%;border-radius:7px;transform:rotate(-24deg);
    background:linear-gradient(90deg,#ffd23d 0 25%,#3cbb4a 25% 50%,#2b91ea 50% 75%,#ff5fa2 75%);box-shadow:0 3px 0 rgba(0,0,0,.35),inset 0 2px 0 rgba(255,255,255,.55)}
  .rozet-b b{position:absolute;left:-5px;bottom:-4px;min-width:22px;height:22px;border-radius:11px;background:#ffc83d;color:#5a2b00;font:700 13px/18px Fredoka,Poppins,sans-serif;text-align:center;padding:0 5px;border:2px solid #fff3d0}
  #pow .bomba.empty .rozet-b i{filter:grayscale(.5) brightness(.85)}
  #pow .bomba:not(.empty) .rozet-b{animation:bombaHazir 1.4s ease-in-out infinite}
  @keyframes bombaHazir{0%,100%{box-shadow:0 4px 0 #2c1f33,0 0 0 rgba(255,200,61,0)}50%{box-shadow:0 4px 0 #2c1f33,0 0 24px rgba(255,200,61,.95)}}
  #pow .on .rozet-b,#pow .slot.on{transform:translateY(2px)}
  .raf{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:6px}
  .kutular{display:flex;gap:8px;padding:6px 8px;border-radius:12px;background:linear-gradient(#3b2c44,#2e2236);box-shadow:inset 0 3px 6px rgba(0,0,0,.45),0 2px 0 rgba(255,255,255,.12)}
  #pow .slot{flex:1 1 0;min-width:0;height:var(--sh,44px);border-radius:11px;border:2px dashed rgba(255,236,212,.5);background:rgba(255,255,255,.04);
    display:flex;align-items:center;justify-content:center;position:relative;color:#fff}
  #pow .slot i{font-style:normal;font-size:calc(var(--sh,44px) * .55);line-height:1;filter:drop-shadow(0 2px 0 rgba(0,0,0,.25))}
  #pow .slot.dolu{border:2px solid #fff3d0;background:linear-gradient(#ffe27a,#ffb41f);box-shadow:0 3px 0 #a4600a,inset 0 2px 0 rgba(255,255,255,.55)}
  #pow .slot.dolu[data-k=slow]{border-color:#e3f5ff;background:linear-gradient(#93daff,#3c9df0);box-shadow:0 3px 0 #1d5b9e,inset 0 2px 0 rgba(255,255,255,.55)}
  #pow .slot b{position:absolute;right:-6px;top:-7px;min-width:19px;height:19px;border-radius:10px;background:#ff4d6d;color:#fff;font:700 12px/15px Fredoka,Poppins,sans-serif;padding:0 4px;border:2px solid #fff}
  #pow .slot.hazir{animation:kutuHazir .8s ease-in-out infinite}
  @keyframes kutuHazir{0%,100%{box-shadow:0 3px 0 #a4600a,0 0 0 rgba(255,220,80,0)}50%{box-shadow:0 3px 0 #a4600a,0 0 18px rgba(255,220,80,.95)}}
  #pow .got{animation:got .9s}
  @keyframes got{0%{transform:scale(1)}30%{transform:scale(1.16);filter:brightness(1.3)}100%{transform:scale(1)}}
  #pow .no{animation:no .35s}
  @keyframes no{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
  .ilerle{display:flex;flex-direction:column;gap:3px}
  .cubuk{height:14px;border-radius:8px;background:#2e2236;box-shadow:inset 0 2px 4px rgba(0,0,0,.5);overflow:hidden;border:1.5px solid rgba(255,236,212,.35)}
  .cubuk u{display:block;height:100%;width:0;border-radius:8px;background:linear-gradient(#ffe680,#ffc21a 60%,#f29b0c);box-shadow:0 0 10px rgba(255,200,60,.8),inset 0 2px 0 rgba(255,255,255,.5);transition:width .4s}
  #bIlY{display:block;text-align:center;font:700 11.5px/1.1 Fredoka,Poppins,sans-serif;color:#fff3dc;letter-spacing:.5px;text-shadow:0 1px 0 rgba(0,0,0,.55);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  /* yatay ekran: sağ sütunda dikey panel */
  body.land #pow{flex-direction:column;align-items:stretch;gap:8px;padding:9px;border-radius:20px;
    background:linear-gradient(180deg,var(--mur1),var(--mur2));border:2px solid rgba(255,236,212,.55);box-shadow:0 8px 20px rgba(20,8,14,.42),inset 0 2px 0 rgba(255,255,255,.18)}
  body.land #pow .bomba{flex-direction:row-reverse;justify-content:flex-end;width:auto;gap:8px}
  body.land #pow .pw-ad{text-align:left;font-size:14px}
  body.land .rozet-b{--rz:52px}
  body.land .raf{flex:1;justify-content:flex-start;gap:8px}
  body.land .kutular{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}
  body.land .ilerle{margin-top:auto}
  @media (prefers-reduced-motion:reduce){#pow .bomba:not(.empty) .rozet-b,#pow .slot.hazir{animation:none}}
  body.land #bIlY{white-space:normal;font-size:10.5px;line-height:1.15}
  @media (max-height:700px){body.port #pow .pw-ad{font-size:11.5px}body.port #pow .bomba{width:76px}}
  body.menude #pow,body.menude #sys{visibility:hidden}
  body.port:not(.menude) #not{bottom:calc(var(--bh,100px) + 12px)}   /* oyunda açıklama kutusu alt panelin üstünde */
  /* İngilizceyi göster / gizle: haritada sekmelerin altındaki düğme ve seçim penceresi */
  .ing-sec{margin:8px 0 2px}
  .ing-sec button{width:100%;display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:14px;cursor:pointer;font:600 14px/1.2 Fredoka,Poppins,sans-serif;
    color:#f7eadb;background:rgba(56,38,62,.72);border:1.5px dashed rgba(255,236,212,.45);text-align:left}
  .ing-sec button.acik{border-style:solid;border-color:#ffc83d;background:rgba(90,60,30,.55)}
  .ing-sec i{font-style:normal;font-size:18px}
  .ing-sec span{flex:1}
  .ing-sec em{font-style:normal;font-size:12px;color:#5b3a24;background:linear-gradient(#fff7ea,#f0d9ba);border-radius:10px;padding:3px 9px;box-shadow:0 2px 0 #b38a62}
  #ing-pen{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;padding:18px;background:rgba(30,16,24,.62);animation:ingAc .2s ease-out}
  @keyframes ingAc{from{opacity:0}to{opacity:1}}
  .ing-kutu{width:min(420px,100%);display:flex;flex-direction:column;gap:10px;padding:18px 16px 14px;border-radius:22px;text-align:center;color:#f9ecdc;
    background:linear-gradient(180deg,rgba(118,90,124,.99),rgba(80,60,90,.99));border:2px solid rgba(255,236,212,.65);box-shadow:0 18px 40px rgba(20,8,14,.6),inset 0 2px 0 rgba(255,255,255,.2)}
  .ing-kutu h3{margin:0;font:700 22px/1.1 Fredoka,Poppins,sans-serif;color:#ffc83d;letter-spacing:1px;
    --o:#6b3412;text-shadow:2px 0 var(--o),-2px 0 var(--o),0 2px var(--o),0 -2px var(--o),0 4px 0 rgba(40,10,0,.5)}
  .ing-kutu p{margin:0 0 2px;font:600 15px/1.3 Fredoka,Poppins,sans-serif}
  .ing-kutu button{display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto;column-gap:12px;align-items:center;text-align:left;padding:12px 14px;border-radius:16px;cursor:pointer;
    font-family:Fredoka,Poppins,sans-serif;color:#5b3a24;background:linear-gradient(#fff7ea,#f0d9ba);border:2px solid #fff;box-shadow:0 5px 0 #b38a62,0 8px 14px rgba(30,10,10,.25)}
  .ing-kutu button:active{transform:translateY(3px);box-shadow:0 2px 0 #b38a62}
  .ing-kutu button.secili{border-color:#ffc83d;box-shadow:0 5px 0 #b38a62,0 0 0 3px #ffc83d}
  .ing-kutu button i{grid-row:1/3;font-style:normal;font-size:28px}
  .ing-kutu button b{font-size:17px}
  .ing-kutu button small{font-size:12.5px;color:#8a6a52}
  .ing-kutu .oner{display:inline-block;vertical-align:2px;margin-left:4px;padding:2px 7px;border-radius:8px;background:#3cbb4a;color:#fff;font-size:11px;font-weight:700;letter-spacing:.3px}
  .ing-not{font-size:12px;color:#e9d6c6}

  /* ---------- telefonun güvenli alanı (çentik, ana ekran çubuğu; uygulama sürümü viewport-fit=cover ile açılır) ---------- */
  body.land #sys{top:calc(10px + env(safe-area-inset-top,0px));right:calc(10px + env(safe-area-inset-right,0px))}
  #ov{padding:calc(14px + env(safe-area-inset-top,0px)) calc(14px + env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) calc(14px + env(safe-area-inset-left,0px))}
  #not{bottom:calc(24px + env(safe-area-inset-bottom,0px))}

  /* ---------- Günün Görevi (gorev.js) ---------- */
  .gorev-btn{display:flex;align-items:center;gap:12px;width:100%;padding:10px 14px;border-radius:16px;cursor:pointer;text-align:left;font-family:Fredoka,Poppins,sans-serif;
    color:#fff;border:3px solid #c9f0ff;background:linear-gradient(#5cc8ff,#2f86e0);box-shadow:0 5px 0 #1d5b9e,0 10px 18px rgba(30,10,10,.3),inset 0 3px 0 rgba(255,255,255,.4)}
  .gorev-btn:active{transform:translateY(2px)}
  .gorev-btn>i{flex:none;font-style:normal;font-size:32px;line-height:1;filter:drop-shadow(0 2px 0 rgba(0,0,0,.25))}
  .gorev-btn .gb-ic{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
  .gorev-btn b{font-size:clamp(18px,5.4vw,22px);letter-spacing:1px;line-height:1;text-shadow:0 2px 0 rgba(20,40,90,.45)}
  .gorev-btn small{font-size:13.5px;line-height:1.2;color:#eaf7ff}
  .gorev-btn em{flex:none;font-style:normal;font-weight:700;font-size:17px;padding:4px 9px;border-radius:12px;background:rgba(10,30,70,.35)}
  .gorev-btn em.sonuk{opacity:.55;filter:grayscale(1)}
  .gorev-btn.hazir{animation:gorevNabiz 2.2s ease-in-out infinite}
  .gorev-btn.tamam{border-color:#d6ffd9;background:linear-gradient(#6fdc7c,#2fa84a);box-shadow:0 5px 0 #1f6e31,0 10px 18px rgba(30,10,10,.3),inset 0 3px 0 rgba(255,255,255,.4)}
  @keyframes gorevNabiz{0%,100%{box-shadow:0 5px 0 #1d5b9e,0 10px 18px rgba(30,10,10,.3),inset 0 3px 0 rgba(255,255,255,.4)}50%{box-shadow:0 5px 0 #1d5b9e,0 0 22px rgba(120,210,255,.85),inset 0 3px 0 rgba(255,255,255,.4)}}
  .gorev-hafta{display:flex;gap:5px;margin-top:2px}
  .gorev-hafta i{width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,.25);border:1.5px solid rgba(255,255,255,.6)}
  .gorev-hafta i.dolu{background:#ffd23d;border-color:#fff3c0;box-shadow:0 0 6px rgba(255,210,61,.8)}
  .gorev-hafta i.bugun{outline:2px solid rgba(255,255,255,.85);outline-offset:1px}
  .gorev-sonuc{margin:10px auto 4px;max-width:420px;padding:10px 14px;border-radius:14px;display:flex;flex-direction:column;align-items:center;gap:4px;
    background:linear-gradient(#5cc8ff,#2f86e0);border:2px solid #c9f0ff;color:#fff;box-shadow:0 4px 0 #1d5b9e}
  .gorev-sonuc b{font-size:18px}.gorev-sonuc span{font-size:14.5px}.gorev-sonuc small{font-size:12.5px;opacity:.85}
  .gorev-sonuc .gorev-hafta i{width:13px;height:13px}
  .row.uclu{gap:6px}.row.uclu .sec{flex:1 1 0;min-width:0;padding-left:6px;padding-right:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  @media (prefers-reduced-motion:reduce){.gorev-btn.hazir{animation:none}}

  /* ---------- Rozetler (rozet.js) ---------- */
  .rz-izgara{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:10px;margin:8px 0 4px}
  .rz-kart{display:flex;flex-direction:column;align-items:center;gap:3px;padding:12px 8px 10px;border-radius:16px;text-align:center;
    background:linear-gradient(#fff7ea,#f0d9ba);color:#5b3a24;border:2px solid #fff;box-shadow:0 4px 0 #b38a62}
  .rz-kart i{font-style:normal;font-size:34px;line-height:1.1;filter:drop-shadow(0 2px 0 rgba(0,0,0,.2))}
  .rz-kart b{font-size:15px;line-height:1.1}
  .rz-kart small{font-size:12px;line-height:1.2;opacity:.85;min-height:2.4em}
  .rz-kart em{font-style:normal;font-size:12px;font-weight:700;color:#2f8a3e}
  .rz-kart.kilit{background:linear-gradient(rgba(255,247,234,.55),rgba(240,217,186,.5));box-shadow:0 4px 0 rgba(120,90,70,.5)}
  .rz-kart.kilit i{filter:grayscale(1) opacity(.45)}
  .rz-kart.kilit em{color:#7a5a44}
  .rz-kart.acik{border-color:#ffe48a;box-shadow:0 4px 0 #c08a1a,0 0 14px rgba(255,200,61,.45)}
  .rz-bar{display:block;width:84%;height:7px;border-radius:4px;background:rgba(91,58,36,.18);overflow:hidden;margin-top:2px}
  .rz-bar u{display:block;height:100%;background:linear-gradient(90deg,#ffd451,#ff9f1c);border-radius:4px}
  .rozet-yeni{margin:10px auto 4px;max-width:440px;padding:10px 12px;border-radius:14px;background:linear-gradient(#fff3c8,#ffd77a);border:2px solid #fff;
    box-shadow:0 4px 0 #c08a1a,0 0 22px rgba(255,200,61,.55);color:#5b3a24;animation:rozetGel .7s cubic-bezier(.2,1.6,.4,1) both}
  .rozet-yeni .ry-bas{font-weight:700;font-size:18px;letter-spacing:1px;margin-bottom:6px}
  .rozet-yeni .ry-liste{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
  .rozet-yeni .ry{display:flex;flex-direction:column;align-items:center;min-width:110px;max-width:150px}
  .rozet-yeni .ry i{font-style:normal;font-size:36px;line-height:1.1}
  .rozet-yeni .ry b{font-size:14.5px}.rozet-yeni .ry small{font-size:12px;opacity:.85}
  @keyframes rozetGel{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
  @media (prefers-reduced-motion:reduce){.rozet-yeni{animation:none}}

  /* ---------- online: mod seçimi, seviye, eşleşme ---------- */
  .mod-secim{display:flex;flex-direction:column;gap:14px;margin:12px 0}
  .mod-btn{display:flex;align-items:center;gap:14px;width:100%;padding:16px;border-radius:20px;cursor:pointer;text-align:left;font-family:Fredoka,Poppins,sans-serif;color:#fff;border:3px solid;
    box-shadow:0 6px 0 var(--d),0 12px 22px rgba(30,10,10,.35),inset 0 3px 0 rgba(255,255,255,.4)}
  .mod-btn:active{transform:translateY(2px)}
  .mod-btn i{font-style:normal;font-size:40px;line-height:1;filter:drop-shadow(0 2px 0 rgba(0,0,0,.25))}
  .mod-btn span{flex:1;min-width:0}
  .mod-btn b{display:block;font-size:clamp(24px,7vw,30px);letter-spacing:2px;line-height:1;text-shadow:0 2px 0 rgba(60,20,10,.45)}
  .mod-btn small{display:block;font-size:14.5px;margin-top:5px;line-height:1.25}
  .mod-btn.hiz{--d:#a3233c;border-color:#ffc4d0;background:linear-gradient(#ff7a96,#e83b5c)}
  .mod-btn.strateji{--d:#4a2a8a;border-color:#e2d4ff;background:linear-gradient(#a685ff,#6b45d8)}
  .lvl-sec{justify-content:center}.lvl-sec button{min-width:44px;font-weight:700}
  .genis-btn{display:block;width:100%;margin:10px 0 2px;font-size:17px;padding:12px}
  .arama{display:flex;flex-direction:column;align-items:center;gap:8px;margin:22px 0 10px}
  .arama b{font-size:22px;color:#fff6e8}.arama small{color:#f3dcc0;font-size:14px}
  .arama-halka{width:64px;height:64px;border-radius:50%;border:6px solid rgba(255,236,212,.25);border-top-color:#ffc83d;animation:don 1s linear infinite}
  @keyframes don{to{transform:rotate(360deg)}}
  body.strde #sys,body.strde #pow{visibility:hidden}

  /* ---------- STRATEJİ ekranı (strateji.js) ---------- */
  #str{position:fixed;inset:0;z-index:15;display:flex;flex-direction:column;align-items:center;gap:6px;
    padding:calc(8px + env(safe-area-inset-top,0px)) 12px calc(8px + env(safe-area-inset-bottom,0px));
    background:linear-gradient(rgba(42,22,34,.78),rgba(42,22,34,.9)),var(--kafe) center/cover;color:#fff6e8;font-family:Fredoka,Poppins,sans-serif;touch-action:none;overflow:hidden}

<script>
'use strict';
/* =====================================================================
   STACKING SENTENCES
   20 seviye, cümle bölümleri, kelime paketleri, dersler, hata kuralları, aralıklı tekrar, seviye testi.
   Müzik: sakin lo-fi döngü (ses/muzik.wav). Erkek spiker sesi kaldırıldı.
   ===================================================================== */
/* =====================================================================
   KALICI KAYIT (Depo)
   Profiller, ilerleme ve yarım bölüm kayıtlarının hepsi bu kapıdan geçer.
   · Tarayıcıda: localStorage (eskisi gibi, hiçbir şey değişmez).
   · Uygulamada (Capacitor): telefonun kalıcı hafızası (Preferences eklentisi).
     İşletim sistemi yer açmak için tarayıcı hafızasını silse de kayıt kaybolmaz.
     İlk açılışta eski tarayıcı kayıtları bir kez buraya kopyalanır; anahtarlar
     (te_profiller_v1, te_profil_<id>, te_yarim_<id>, te_kayit_v1) ve biçim aynı kalır.
   Okuma bellekteki kopyadan anında yapılır; yazma arkada kalıcı hafızaya gider.
   ===================================================================== */
const Depo = (() => {
  const ON = 'te_';                      // yalnız oyunun kendi anahtarları
  const bellek = new Map();
  let yerli = null, hazir = null, bekleyen = 0, hata = 0, tasinan = 0;
  let sira = Promise.resolve();         // yazmalar sırayla gider: aynı anahtara art arda yazılınca son yazılan kalır
  const ls = (() => { try { const s = window.localStorage; s.getItem(ON + 'deneme'); return s; } catch (e) { return null; } })();
  function eklenti() {
    const c = window.Capacitor;
    return (c && typeof c.isNativePlatform === 'function' && c.isNativePlatform() && c.Plugins && c.Plugins.Preferences) || null;
  }
  async function yukle(p) {
    const { keys } = await p.keys();
    const bizim = (keys || []).filter(k => k.indexOf(ON) === 0);
    if (!bizim.length && ls) {           // ilk açılış: tarayıcıdaki eski kayıtları bir kez taşı
      for (let i = 0; i < ls.length; i++) { const k = ls.key(i); if (k && k.indexOf(ON) === 0) bellek.set(k, ls.getItem(k)); }
      await Promise.all([...bellek].map(([key, value]) => p.set({ key, value })));
      tasinan = bellek.size;
    } else {
      for (const k of bizim) { const { value } = await p.get({ key: k }); if (value != null) bellek.set(k, value); }
    }
  }
  // boot() bunu bekler; tarayıcıda hemen biter
  function hazirla() {
    if (hazir) return hazir;
    const p = eklenti();
    hazir = !p ? Promise.resolve() : yukle(p).then(() => { yerli = p; }, e => { bellek.clear(); console.warn('Kalıcı hafıza açılamadı, tarayıcı hafızası kullanılıyor', e); });
    return hazir;
  }
  function al(k) {
    if (yerli) return bellek.has(k) ? bellek.get(k) : null;
    try { return ls ? ls.getItem(k) : null; } catch (e) { return null; }
  }
  // true: yazıldı; false: yer yok / hafıza kapalı (eskisi gibi)
  function yaz(k, v) {
    v = String(v);
    if (yerli) {
      bellek.set(k, v); bekleyen++;
      sira = sira.then(() => yerli.set({ key: k, value: v })).catch(() => { hata++; }).then(() => { bekleyen--; });
      try { if (ls) ls.setItem(k, v); } catch (e) { }   // yedek kopya; dolarsa önemli değil
      return true;
    }
    if (!ls) return false;
    try { ls.setItem(k, v); return true; } catch (e) { return false; }
  }
  function sil(k) {
    bellek.delete(k);
    if (yerli) { bekleyen++; sira = sira.then(() => yerli.remove({ key: k })).catch(() => { hata++; }).then(() => { bekleyen--; }); }
    try { if (ls) ls.removeItem(k); } catch (e) { }
  }
  // oyunun bütün anahtarları (kurtarma ve yedek temizliği için)
  function anahtarlar() {
    if (yerli) return [...bellek.keys()];
    const o = []; try { if (ls) for (let i = 0; i < ls.length; i++) { const k = ls.key(i); if (k && k.indexOf(ON) === 0) o.push(k); } } catch (e) { }
    return o;
  }
  // Capacitor eklentisi var mı (kalıcı hafıza açılamasa bile kayıtlar boot'ta okunur)
  const uygulamaMi = () => !!eklenti();
  return { hazirla, al, yaz, sil, anahtarlar, uygulamaMi, tur: () => (yerli ? 'uygulama' : 'tarayici'), durum: () => ({ bekleyen, hata, tasinan }) };
})();


/* =====================================================================
   ARAYÜZ DİLİ
   Menü, düğme, bildirim ve oyun içi uyarı yazıları buradan çevrilir.
   İngilizce öğretim içeriği (cümleler, kelimeler, anlamlar, hata kuralları,
   dersler, "Türkçe mantığıyla" açıklamaları) burada DEĞİL: ona dokunulmaz,
   her arayüz dilinde aynen gösterilir.
   · Anahtar Türkçe metnin kendisidir: tt('OYUNU KAYDET') → Türkçede aynen çıkar.
   · Yer tutucu: tt('BOMBA! {n} KELİME PATLADI', { n: 3 }).
   · Yeni dil: DIL_SOZLUK'e bir sözlük (ör. de: {...}) ekle, DILLER'e yaz.
     Karşılığı olmayan metin Türkçe kalır; oyun bozulmaz.
   · Çeviriler dil-en.js dosyasında.
   ===================================================================== */
const MARKA = { ad: 'Stacking Sentences', a: 'STACKING', b: 'SENTENCES' };
const DILLER = [{ kod: 'tr', ad: 'Türkçe' }, { kod: 'en', ad: 'English' }];
const DIL_SOZLUK = {};
const DIL_ANAHTAR = 'te_dil';
let arayuzDili = 'tr';
function tt(s, p) {
  const sz = DIL_SOZLUK[arayuzDili];
  let r = (sz && sz[s]) || s;
  if (p) r = r.replace(/\{(\w+)\}/g, (m, k) => (p[k] !== undefined && p[k] !== null ? p[k] : m));
  return r;
}
function dilOku() { const k = Depo.al(DIL_ANAHTAR); arayuzDili = DILLER.some(d => d.kod === k) ? k : 'tr'; document.documentElement.lang = arayuzDili; }
function dilSec(kod) {
  Depo.yaz(DIL_ANAHTAR, kod); dilOku(); sabitYazilar();
  if (typeof L !== 'undefined' && L.in) { SPR.clear(); renderBG(); yerlesimYenile(); }   // tuvale çizili yazılar
}
// index.html'deki sabit yazılar: data-t (yazı) ve data-ta (aria-label) taşıyan öğeler
function sabitYazilar() {
  document.querySelectorAll('[data-t]').forEach(e => { if (!e.dataset.t) e.dataset.t = e.textContent; e.textContent = tt(e.dataset.t); });
  document.querySelectorAll('[data-ta]').forEach(e => { if (!e.dataset.ta) e.dataset.ta = e.getAttribute('aria-label') || ''; e.setAttribute('aria-label', tt(e.dataset.ta)); });
  document.title = MARKA.ad;
}
// sayı ve tarih biçimi arayüz diline göre (isimler ve içerik Türkçe kurallarla kalır)
function yerel() { return arayuzDili === 'en' ? 'en-US' : 'tr-TR'; }
function logoHtml(cls) { return `<div class="logo${cls ? ' ' + cls : ''}"><span class="a">${MARKA.a}</span> <span class="b">${MARKA.b}</span></div>`; }
function dilSecimHtml() {
  return `<div class="bolum">${tt('Arayüz dili')}</div><div class="sekmeler kucuk" id="dil-sec">${DILLER.map(d => `<button data-dil="${d.kod}" class="${d.kod === arayuzDili ? 'secili' : ''}">${d.ad}</button>`).join('')}</div>
    <p class="aciklama kucuk">${tt('Menü ve düğme yazıları değişir. İngilizce öğretim içeriği ve Türkçe anlamlar aynı kalır.')}</p>`;
}
// nasıl oynanır örnek kutularındaki kısa yazılar (etiketler arası metin) çevrilir
function demoCevir(html) {
  if (arayuzDili === 'tr') return html;
  return html.replace(/>([^<>]+)</g, (m, s) => { const k = s.trim(); if (!k) return m; const c = tt(k); return c === k ? m : '>' + s.replace(k, c) + '<'; });
}
dilOku();


/* İngilizce arayüz sözlüğü · anahtar: Türkçe metin (dil.js) · içerik çevrilmez */
DIL_SOZLUK.en = {

"Özne": "Subject",

"<b>KARİYER</b>’de <b>20 seviye</b> var: A1–C2, Sınav Yolu ve Hayat İngilizcesi. <b class=\"gold\">CÜMLELER</b> (bölümler) ve <b class=\"gold\">KELİMELER</b> (paketler) ayrı sekmelerde; <b>▶ DEVAM ET</b> sıradakini açar. <b>ONLINE KAPIŞMA</b>’da arkadaşınla oda koduyla aynı cümleleri kurarak yarışırsın. İlerlemen profiline kaydedilir.": "<b>CAREER</b> has <b>20 levels</b>: A1–C2, the Exam Track and Everyday English. <b class=\"gold\">SENTENCES</b> (chapters) and <b class=\"gold\">WORDS</b> (packs) are separate tabs; <b>▶ CONTINUE</b> opens the next one. In <b>ONLINE DUEL</b> you race a friend with a room code, building the same sentences. Your progress is saved to your profile.",
"Türkçe cümle <b>sesli okunur</b> ve şeridin üstünde yazar; kelimeler <b>okuma bitince</b> düşmeye başlar (düşerken Türkçesi görünmez). <b>◀ ▶</b> ile doğru <b>boş kutunun</b> üstüne getir, <b>ENTER</b> ile bırak, <b>▼</b> hızlandırır; kutuya dokunarak da seçebilirsin. Uzun cümleler <b>2–3 satıra</b> bölünür. Yerleşen kelimenin Türkçesi o an gösterilir. Türkçe kutusuna dokunursan tekrar dinlersin.": "The Turkish sentence is <b>read aloud</b> and shown above the strip; the words start falling <b>when the reading ends</b> (no Turkish is shown while they fall). Move with <b>◀ ▶</b> over the right <b>empty box</b>, drop with <b>ENTER</b>, <b>▼</b> speeds up; you can also tap a box to choose it. Long sentences split into <b>2–3 rows</b>. A placed word shows its Turkish meaning right away. Tap the Turkish box to hear it again.",
"Doğru kelimelerin arasında <b>tuzak kelimeler</b> de düşer (am yerine <i>is</i>, reading yerine <i>read</i> gibi). Cümleye girmeyenleri <b class=\"red\">🗑 ÇÖPE AT</b> ile yok et (▲, yukarı kaydır ya da Boşluk). Yanlış kutuya bırakırsan <b>kural açıklaması</b> çıkar: neden yanlış olduğu Türkçe anlatılır.": "<b>Trap words</b> fall between the right ones (like <i>is</i> instead of am, <i>read</i> instead of reading). Destroy the ones that do not belong with <b class=\"red\">🗑 TRASH</b> (▲, swipe up or Space). If you drop a block in the wrong box, a <b>rule explanation</b> appears and tells you in Turkish why it is wrong.",
"Cümlelerin arasında <b class=\"red\">HATAYI BUL</b> turu gelir: içinde <b>bir yanlış kelime</b> olan cümle (Türklerin sık yaptığı hatalar dahil). Kırmızı <b>✖ HATA</b> bloğunu <b>yanlış kelimenin</b> üstüne bırak. Bulamazsan doğrusu ve kuralı gösterilir, Hata Defteri’ne eklenir.": "Between sentences comes a <b class=\"red\">FIND THE MISTAKE</b> round: a sentence with <b>one wrong word</b> (including mistakes Turkish speakers often make). Drop the red <b>✖ ERROR</b> block on <b>the wrong word</b>. If you miss it, the correct form and the rule are shown and added to the Mistake Notebook.",
"Kelime paketlerinde yeni kelime önce <b>kartla</b> tanıtılır (anlamı, okunuşu, örnek cümlesi); bloğu kutuya bırakırsın. Sonra dört soru tipi: <b>Türkçesi verilen kelimeyi bul</b>, <b>kelimenin Türkçesini bul</b>, <b>dinle ve bul</b>, <b>cümlede boşluğu doldur</b>. Doğru bloğu <b class=\"gold\">CEVAP</b> kutusuna bırak, yanlışları çöpe at.": "In word packs a new word is first introduced <b>on a card</b> (meaning, pronunciation, example sentence); you drop the block in the box. Then come four question types: <b>find the word for the Turkish shown</b>, <b>find the Turkish meaning</b>, <b>listen and find</b>, <b>fill the gap in the sentence</b>. Drop the right block in the <b class=\"gold\">ANSWER</b> box and trash the wrong ones.",
"Yanlış kutuya bırakılan ya da yanlışlıkla çöpe atılan blok <b class=\"gold\">Kelime Mezarlığı</b>’na düşer ve üstünde Türkçe anlamı yazar. Yığın kırmızı <b class=\"red\">KAYBETME SINIRI</b>’na değerse oyun biter. Hatasız cümle mezarlığın en alt sırasını patlatır.": "A block dropped in the wrong box or trashed by mistake falls into the <b class=\"gold\">Word Graveyard</b> with its Turkish meaning on it. If the pile touches the red <b class=\"red\">DANGER LINE</b>, the game ends. A perfect sentence blows up the bottom row of the graveyard.",
"Art arda doğru hamleyle <b>KOMBO</b> artar: 3’te x1.5, 5’te x2, 8’de x3, 10’da <b>ATEŞ MODU x4</b>. Her <b>6’lı seride</b> bir ödül: ⏳ YAVAŞ → 🃏 JOKER → 💣 BOMBA. <b>🃏 Joker</b> düşen kelimenin Türkçesini 1 kez gösterir. Hata yaparsan seri sıfırlanır.": "Correct moves in a row raise the <b>COMBO</b>: x1.5 at 3, x2 at 5, x3 at 8, <b>FIRE MODE x4</b> at 10. Every <b>streak of 6</b> gives a reward: ⏳ SLOW → 🃏 JOKER → 💣 BOMB. <b>🃏 Joker</b> shows the Turkish of a falling word once. A mistake resets the streak.",
"Hatalı cümleler ve kelimeler <b>aralıklı tekrar</b> ile (10 dakika, 1, 3, 7, 21 gün) geri gelir; <b>🔁 Antrenman</b> zamanı gelenleri sorar. Her bölümün <b>📖 dersi</b> var; sonuç ekranında hatalarının kuralını ve cümlenin <b>Türkçe mantığıyla</b> dizilişini görürsün. <b>Seviye testi</b> ile seviyeni bulabilirsin.": "Wrong sentences and words come back with <b>spaced review</b> (10 minutes, 1, 3, 7, 21 days); <b>🔁 Practice</b> asks the ones that are due. Every chapter has a <b>📖 lesson</b>; on the result screen you see the rule behind your mistakes and the sentence in <b>Turkish word order</b>. Use the <b>Level test</b> to find your level.",

"Türkçe cümle <b>sesli okunur</b>, karolar <b>okuma bitince</b> tahtaya yağar (karolarda Türkçe yazmaz). Bir karoyu <b>tut ve sürükle</b>: bıraktığın yerdeki karoyla <b>yer değiştirir</b> (iki karoya sırayla dokunarak da olur). Cümlenin kelimelerini bir <b>satırda soldan sağa</b> sırayla yan yana diz; dizilenler <b class=\"gold\">altın</b> parlar, sıradaki yer kesik çizgiyle görünür. Cümle tamamlanınca <b>patlar</b>. Türkçe kutusuna dokunursan tekrar dinlersin.": "The Turkish sentence is <b>read aloud</b>; tiles drop onto the board <b>when the reading ends</b> (tiles show no Turkish). <b>Hold and drag</b> a tile: it <b>swaps places</b> with the tile where you drop it (tapping two tiles in turn works too). Line up the sentence's words <b>left to right in one row</b>; placed words glow <b class=\"gold\">gold</b> and the next spot has a dashed frame. A finished sentence <b>pops</b>. Tap the Turkish box to listen again.",
"Tahtada <b>tuzak karolar</b> da var (drink yerine <i>drinks</i>, am yerine <i>is</i> gibi). Bazı kelimeler başta tahtada olmayabilir: birkaç saniye sonra <b>yukarıdan iner</b>. Dizinin sonuna <b>yanlış karo</b> koyarsan karo <b>geri seker</b>, Türkçe <b>kural açıklaması</b> çıkar ve <b class=\"red\">hata göstergesi</b> dolar.": "The board also has <b>trap tiles</b> (<i>drinks</i> instead of drink, <i>is</i> instead of am). Some words may be missing at first: they <b>drop in from above</b> a few seconds later. Put a <b>wrong tile</b> at the end of the row and it <b>bounces back</b>, a <b>rule explanation</b> appears in Turkish and the <b class=\"red\">mistake meter</b> rises.",
"Cümlelerin arasında <b class=\"red\">HATAYI BUL</b> turu gelir: tahtanın altında içinde <b>bir yanlış</b> olan cümle sabit durur. <b>Doğru karoyu</b> tahtada bul ve <b>yanlış kelimenin üstüne sürükle</b>. Fazla kelime varsa ona <b>dokun</b>. Yanlış yere bırakırsan doğrusu ve kuralı gösterilir, Hata Defteri’ne eklenir.": "Between sentences comes a <b class=\"red\">FIND THE MISTAKE</b> round: a sentence with <b>one mistake</b> sits fixed at the bottom of the board. Find the <b>right tile</b> on the board and <b>drag it onto the wrong word</b>. If there is an extra word, <b>tap</b> it. Drop it in the wrong place and the right answer and rule are shown and added to your Mistake Notebook.",
"Kelime paketlerinde yeni kelime önce <b>kartla</b> tanıtılır (anlamı, okunuşu, örnek cümlesi), sonra <b>harflerini</b> dizersin. Sorular: <b>Türkçesi verilen kelimeyi</b>, <b>kelimenin Türkçesini</b>, <b>duyduğun kelimeyi</b> ve <b>cümledeki boşluğu</b> harf harf diz. Tahta, kelimenin bütün harfleri bir satıra sığacak kadar geniştir; öbeklerde kelimeler sırayla gelir.": "In word packs a new word is first shown on a <b>card</b> (meaning, pronunciation, example sentence), then you spell its <b>letters</b>. Questions: spell <b>the word for the Turkish shown</b>, <b>the Turkish of the word</b>, <b>the word you hear</b> and <b>the gap in the sentence</b> letter by letter. The board is wide enough for every letter of the word in one row; in phrases the words come one after another.",
"Her turun bir <b>süresi</b> var (Türkçe şeridin altındaki çubuk). Süre biterse ya da dizinin sonuna yanlış karo koyarsan soldaki <b class=\"red\">hata göstergesi</b> bir dilim dolar; süre bitince sıradaki karo <b>el işaretiyle</b> gösterilir. Gösterge dolarsa <b>oyun biter</b>. Tamamlanan her cümle göstergeyi 1 dilim, <b>hatasız</b> cümle 2 dilim, hatasız kelime sorusu 1 dilim <b>boşaltır</b>.": "Every round has a <b>time limit</b> (the bar under the Turkish banner). If time runs out or you put a wrong tile at the end of the row, the <b class=\"red\">mistake meter</b> on the left rises one step; when time runs out a <b>pointing hand</b> shows the next tile. If the meter fills, <b>the game ends</b>. Every finished sentence <b>lowers</b> it 1 step, a <b>perfect</b> sentence 2 steps, a perfect word question 1 step.",
"Aynı renkten <b>3 ya da daha fazla</b> karo yan yana veya alt alta gelirse <b>toplu patlar</b>; üstteki karolar düşer, yukarıdan yenileri gelir, yeni eşleşmeler <b>ZİNCİRLEME KOMBO</b> yapar. <b>5’li</b> ya da <b>L / T</b> biçimi <b class=\"gold\">SÜPER PATLAMA</b>: o renkteki bütün karolar patlar. Patlamalar sol alttaki <b>💣 CÜMLE BOMBASI</b> rozetinin halkasını doldurur; bomba gereksiz karoları patlatır ve hata göstergesini 2 dilim boşaltır.": "When <b>3 or more</b> tiles of the same color line up side by side or on top of each other they <b>blast together</b>; tiles above fall, new ones drop in, and new matches make a <b>CHAIN COMBO</b>. A line of <b>5</b> or an <b>L / T</b> shape is a <b class=\"gold\">SUPER BLAST</b>: every tile of that color pops. Blasts fill the ring of the <b>💣 SENTENCE BOMB</b> badge at the bottom left; the bomb blasts the tiles you don't need and lowers the mistake meter 2 steps.",
"Art arda doğru hamleyle <b>KOMBO</b> artar: 3’te x1.5, 5’te x2, 8’de x3, 10’da <b>ATEŞ MODU x4</b>. Her <b>6’lı seride</b> bir ödül: ⏳ YAVAŞ → 🃏 JOKER → 💣 CÜMLE BOMBASI. Kazandığın joker ve yavaş alttaki <b>güç kutularında</b> durur; kutuya dokununca kullanılır. <b>🃏 Joker</b>: sonra dokunduğun karonun Türkçesi 1 kez görünür. <b>⏳ Yavaş</b>: süre 15 saniye yavaş akar. Hata yaparsan seri sıfırlanır.": "Correct moves in a row raise the <b>COMBO</b>: x1.5 at 3, x2 at 5, x3 at 8, <b>FIRE MODE x4</b> at 10. Every <b>streak of 6</b> gives a reward: ⏳ SLOW → 🃏 JOKER → 💣 SENTENCE BOMB. Jokers and slows you win wait in the <b>power slots</b> at the bottom; tap a slot to use it. <b>🃏 Joker</b>: shows the Turkish of the next tile you tap, once. <b>⏳ Slow</b>: the timer runs slowly for 15 seconds. A mistake resets the streak.",

"Kelimeyi dinle. Duyduğun İngilizce kelimenin harflerini tahtada bul, sürükleyip soldan sağa sırayla yan yana diz.": "Listen to the word. Find the letters of the English word you hear on the board and drag them into a row, in order, from left to right.",

"Eksik kelimenin harflerini sırayla diz": "Put the letters of the missing word in order",
"Cümlede bir kelime eksik. Boşluğa gelen İngilizce kelimeyi düşün. Harflerini tahtada bul, sürükleyip soldan sağa sırayla yan yana diz.": "A word is missing in the sentence. Think of the English word that goes in the gap. Find its letters on the board and drag them into a row, in order, from left to right.",
"Doğru kelimeyi yanlışın üstüne sürükle": "Drag the right word onto the wrong one",
"Tahtanın altındaki İngilizce cümlede bir kelime yanlış. Doğru kelimeyi tahtada bul, yanlış kelimenin üstüne sürükle.": "One word in the English sentence at the bottom of the board is wrong. Find the right word on the board and drag it onto the wrong word.",
"Tahtanın altındaki İngilizce cümlede fazladan bir kelime var. O kelimeye dokun.": "The English sentence at the bottom of the board has an extra word. Tap that word.",
"Yeri karışan iki kelimeyi üst üste sürükle": "Drag the two mixed-up words onto each other",
"Tahtanın altındaki İngilizce cümlede iki kelimenin yeri karışmış. Bu iki kelimeyi birbirinin üstüne sürükle.": "Two words in the English sentence at the bottom of the board are in the wrong places. Drag one of them onto the other.",
"Doğru yazılışı yanlışın üstüne sürükle": "Drag the right spelling onto the wrong one",
"Tahtanın altındaki bir kelime yanlış yazılmış. Doğru yazılışı tahtada bul, yanlış yazılan kelimenin üstüne sürükle.": "A word at the bottom of the board is spelled wrong. Find the right spelling on the board and drag it onto the wrong word.",
"Doğru Türkçeyi yanlışın üstüne sürükle": "Drag the right Turkish onto the wrong one",
"Tahtanın altındaki kelimelerden birinin Türkçesi yanlış. Doğru Türkçeyi tahtada bul, yanlış olanın üstüne sürükle.": "One of the words at the bottom of the board has the wrong Turkish meaning. Find the right Turkish on the board and drag it onto the wrong one.",
"Nasıl oynamak istersin? İngilizce kelimeyi görerek oynamak için göster düğmesine dokun. Görmeden oynamak için gizle düğmesine dokun.": "How do you want to play? To play while seeing the English word, tap show. To play without seeing it, tap hide.",
"Nasıl oynamak istersin? İngilizce cümleyi görerek oynamak için göster düğmesine dokun. Görmeden oynamak için gizle düğmesine dokun.": "How do you want to play? To play while seeing the English sentence, tap show. To play without seeing it, tap hide.",
"Yönergeleri sesli oku": "Read instructions aloud",
"Her turun başında ne yapacağını kısaca sesli söyler": "Briefly says what to do at the start of every round",
"Hata göstergesi doldu, oyun bitti. Bir dahakine yanlış karo koyma; süre bitmeden doğru karoyu bul.": "The mistake meter filled up and the game ended. Next time, do not place wrong tiles; find the right tile before time runs out.",
"Bu oyunda oynayarak İngilizce öğrenirsin. <b>KARİYER</b>’de seviyeler var: A1’den C2’ye. <b class=\"gold\">CÜMLELER</b>’de cümle kurarsın, <b class=\"gold\">KELİMELER</b>’de kelime öğrenirsin. <b>▶ DEVAM ET</b>’e dokununca sıradaki bölüm açılır. <b>ONLINE KAPIŞMA</b>’da arkadaşınla yarışırsın.": "You learn English by playing. <b>CAREER</b> has levels from A1 to C2. In <b class=\"gold\">SENTENCES</b> you build sentences, in <b class=\"gold\">WORDS</b> you learn words. Tap <b>▶ CONTINUE</b> to open the next chapter. In <b>ONLINE DUEL</b> you race a friend.",
"Önce ne yapacağın kısaca sesli söylenir ve Türkçe cümle yazılır. Sonra tahtaya İngilizce kelime karoları düşer. Doğru kelimeyi <b>parmağınla tut ve sürükle</b>. Kelimeleri bir sırada <b>soldan sağa</b>, yan yana diz. Doğru dizdiklerin <b class=\"gold\">altın</b> gibi parlar. Cümle bitince karolar <b>patlar</b>. Türkçe yazıya dokunursan sesli dinlersin.": "First you hear briefly what to do and see the Turkish sentence. Then English word tiles fall onto the board. <b>Hold the right word with your finger and drag it</b>. Put the words in one row <b>from left to right</b>, side by side. The ones you place right shine like <b class=\"gold\">gold</b>. When the sentence is done, the tiles <b>pop</b>. Tap the Turkish text to hear it.",
"Tahtada <b>tuzak</b> kelimeler de var. Örneğin <i>drink</i> yerine <i>drinks</i>. Yanlış kelimeyi koyarsan karo <b>geri seker</b> ve doğrusu anlatılır. Bazı kelimeler biraz sonra <b>yukarıdan düşer</b>; bulamazsan biraz bekle.": "The board also has <b>trap</b> words, for example <i>drinks</i> instead of <i>drink</i>. If you place a wrong word, the tile <b>bounces back</b> and the right answer is explained. Some words <b>fall from the top</b> a little later; if you cannot find one, wait a bit.",
"Bazen tahtanın altında <b>yanlışı olan</b> bir İngilizce cümle durur. Doğru kelimeyi tahtada bul ve <b>yanlış kelimenin üstüne sürükle</b>. Cümlede fazladan bir kelime varsa o kelimeye <b>dokun</b>.": "Sometimes an English sentence <b>with a mistake</b> sits at the bottom of the board. Find the right word on the board and <b>drag it onto the wrong word</b>. If the sentence has an extra word, <b>tap</b> that word.",
"Yeni kelime önce bir <b>kartta</b> gösterilir; dinlemek için yazıya dokun. Sonra o kelimenin <b>harflerini</b> tahtada bulup soldan sağa yan yana dizersin. Bazen Türkçesini, bazen İngilizcesini, bazen de cümledeki <b>boşluğa</b> gelen kelimeyi dizersin. Ne yapacağın her seferinde <b>sesli söylenir</b>.": "A new word is first shown on a <b>card</b>; tap the text to hear it. Then you find its <b>letters</b> on the board and put them side by side from left to right. Sometimes you build the Turkish, sometimes the English, sometimes the word that goes in the <b>gap</b> of a sentence. What to do is always <b>said out loud</b>.",
"Her turun bir <b>süresi</b> var; süre Türkçe yazının altındaki çubukta azalır. Yanlış karo koyarsan ya da süre biterse soldaki <b class=\"red\">hata göstergesi</b> biraz dolar. Gösterge tamamen dolarsa <b>oyun biter</b>. Cümleyi doğru bitirince gösterge biraz <b>boşalır</b>.": "Every round has a <b>time limit</b>; the time goes down in the bar under the Turkish text. If you place a wrong tile or time runs out, the <b class=\"red\">mistake meter</b> on the left fills a little. If it fills up completely, <b>the game ends</b>. Finishing a sentence correctly <b>empties</b> it a little.",
"Aynı renkten <b>3 karo</b> yan yana ya da alt alta gelirse <b>patlar</b> ve puan kazandırır. Üstteki karolar aşağı düşer, yenileri gelir. Patlamalar sol alttaki <b>💣 CÜMLE BOMBASI</b> düğmesinin halkasını doldurur. Halka dolunca düğmeye dokun: işe yaramayan karolar patlar.": "When <b>3 tiles</b> of the same color line up side by side or on top of each other, they <b>pop</b> and give points. Tiles above fall down and new ones come. Pops fill the ring of the <b>💣 SENTENCE BOMB</b> button at the bottom left. When the ring is full, tap the button: tiles you do not need pop.",
"Art arda doğru karo koydukça <b>KOMBO</b> artar ve daha çok puan alırsın. Seri uzayınca ödül kazanırsın: ⏳ <b>YAVAŞ</b> süreyi yavaşlatır, 🃏 <b>JOKER</b> bir karonun Türkçesini gösterir. Ödüller alttaki <b>kutularda</b> durur; kullanmak için kutuya dokun.": "Placing right tiles one after another raises your <b>COMBO</b> and gives more points. Long streaks win rewards: ⏳ <b>SLOW</b> slows the time, 🃏 <b>JOKER</b> shows the Turkish of a tile. Rewards wait in the <b>slots</b> at the bottom; tap a slot to use it.",
"Yanlış yaptığın cümle ve kelimeler sonra yeniden <b>karşına çıkar</b>; böylece unutmazsın. <b>🔁 Tekrar</b> düğmesi zamanı gelenleri sorar. Her bölümün bir <b>📖 dersi</b> var. <b>Seviyeni ölç</b> ile seviyeni bulabilirsin.": "Sentences and words you got wrong <b>come back</b> later, so you do not forget them. The <b>🔁 Review</b> button asks the ones that are due. Every chapter has a <b>📖 lesson</b>. Use <b>Test your level</b> to find your level.",

/* =====================================================================
   OLAY YOLU
   Oyun motoru önemli anları duyurur; seri, XP, rozet, istatistik gibi
   modüller motorun içine girmeden bunları dinler.
     Olay.dinle('cumleTamam', v => { ... })   → bırakmak için dönen işlevi çağır
     Olay.yay('cumleTamam', { kusursuz: true })
   Bir dinleyici hata verirse oyun durmaz: hata yakalanır, sayılır, konsola yazılır.
   Olaylar ve taşıdıkları bilgi (yeni olay eklerken bu listeyi güncelle):
     kayitYuklendi  { profil }                       profil açıldı / değişti / silindi
     bolumBasladi   { mod, r, lvl, devam, goster }  mod: bolum | kelime | antrenman | test | online | ilk (rehberli ilk cümle);
                                                     goster: İngilizce gösterilerek oynanıyor (puan ve XP yarı)
     turBasladi     { tip, no }                      tip: kur | sav | test | tanis
     dogruHamle     { tip, kelime }                  her doğru yerleştirme / bulunan hata / doğru cevap
     hata           { tip, kelime, mesaj, kural }    her hatalı hamle (D.istat.yanlis ile aynı sayıda)
     copeAtildi     { kelime, puan }                 tuzak kelime doğru şekilde çöpe atıldı
     cumleTamam     { kusursuz, en }                 cümle kuruldu
     hataBulundu    { kelime }                       HATAYI BUL turu doğru çözüldü
     soruBitti      { temiz, kelime }                kelime sorusu bitti
     kelimeTanisildi { kelime }                      yeni kelime kartı kutuya bırakıldı
     uniteTamam     { lvl, unite, bolge, seviyeBitti }  bir ünitenin bütün bölümleri ilk kez yıldız aldı (harita.js)
     hedefTamam     { seri, yeniDondurma }           günlük XP hedefi tamamlandı (ilerleme.js duyurur)
     kombo          { n }                            seri bir arttı
     komboBitti     { n }                            seri bozuldu (n: biten serinin uzunluğu)
     bolumBitti     { mod, r, lvl, kazandi, yildiz, skor, istat, enKombo, rekor }
     onlineBitti    { kazandi, neden }
   ===================================================================== */
const Olay = (() => {
  const dinleyen = {};
  let hata = 0;
  function dinle(ad, fn) { (dinleyen[ad] = dinleyen[ad] || []).push(fn); return () => birak(ad, fn); }
  function birak(ad, fn) { const l = dinleyen[ad]; if (l) { const i = l.indexOf(fn); if (i >= 0) l.splice(i, 1); } }
  function yay(ad, veri) {
    const l = dinleyen[ad]; if (!l || !l.length) return;
    const v = veri || {};
    for (const fn of l.slice()) { try { fn(v, ad); } catch (e) { hata++; console.error('Olay dinleyicisi hatası (' + ad + ')', e); } }
  }
  return { dinle, birak, yay, hataSayisi: () => hata };
})();


/* =====================================================================
   KAYIT ŞEMASI (doğrulama ve onarım)
   Kayıttan okunan her veri burada kontrol edilir; oyun kodu bozuk veri görmez.
   · Saf işlevler: yalnız veri alır, düzeltilmiş veri döndürür (Depo'ya yazmaz).
   · Eksik alan → varsayılan değer (eski kayıtlarda normaldir, uyarı yok).
   · Yanlış türde / anlamsız alan → onarılır ve "bozuk" listesine yazılır
     (data.js ham kaydı yedekler ve oyuncuya bir kez haber verir).
   · Tanımadığımız alanlar korunur (ileride eklenecek alanlar silinmesin).
   Yeni alan eklerken: bosKayit() (data.js) + aşağıdaki ALANLAR + test.
   Kayıt biçimi değişirse: KAYIT_SURUM'u artır, GOCLER'e bir adım ekle.
   ===================================================================== */
const KAYIT_SURUM = 2;
const SEVIYE_KODLARI = ['A1', 'A2', 'B1', 'B2', 'C1', 'C2'];
const sayiMi = x => typeof x === 'number' && isFinite(x);
const nesneMi = x => !!x && typeof x === 'object' && !Array.isArray(x);
const GUN_ANAHTAR = /^\d{4}-\d{2}-\d{2}$/;
const tamSayi = (x, en, ek) => (sayiMi(x) ? Math.min(ek, Math.max(en, Math.round(x))) : null);

// sürüm göçleri: v → v+1 (her biri ham nesneyi yerinde günceller)
const GOCLER = {
  1: k => { k.v = 2; },   // v2: alanlar doğrulanır; biçim aynı
};

// her alan: (değer, varsayılan, bağlam) → düzeltilmiş değer; bozuksa bağlam.bozuk() çağrılır
const ALANLAR = {
  baslangic: (x, v, c) => (x === null || SEVIYE_KODLARI.indexOf(x) >= 0 ? x : c.bozuk(null)),
  acik: (x, v, c) => {
    if (!nesneMi(x)) return c.bozuk(Object.assign({}, v));
    const o = {}; for (const k in x) if (x[k]) o[k] = true;
    o['A1-1'] = true; return o;
  },
  yildiz: (x, v, c) => {
    if (!nesneMi(x)) return c.bozuk({});
    const o = {}; let b = false;
    for (const k in x) { const y = tamSayi(x[k], 1, 3); if (y === null) b = true; else o[k] = y; }
    return b ? c.bozuk(o) : o;
  },
  kel: (x, v, c) => {    // kelime → [kutu 1..6, vade (dakika), hata sayısı]
    if (!nesneMi(x)) return c.bozuk({});
    const o = {}; let b = false;
    for (const k in x) {
      const s = x[k];
      if (!Array.isArray(s) || !sayiMi(s[0]) || !sayiMi(s[1])) { b = true; continue; }
      o[k] = [tamSayi(s[0], 1, 6), s[1], tamSayi(s[2], 0, 1e6) || 0];
    }
    return b ? c.bozuk(o) : o;
  },
  tekrar: (x, v, c) => {   // hata ve cümle tekrar kutuları (en çok 400)
    if (!Array.isArray(x)) return c.bozuk([]);
    const o = []; let b = false;
    for (const e of x) {
      const tamam = nesneMi(e) && typeof e.k === 'string' && sayiMi(e.kutu) && sayiMi(e.vade) &&
        (e.tur === 'cumle' ? typeof e.r === 'string' && sayiMi(e.i)
          : nesneMi(e.m) && Array.isArray(e.m.tokens) && e.m.tokens.every(t => typeof t === 'string') && sayiMi(e.m.idx));
      if (!tamam) { b = true; continue; }
      e.kutu = tamSayi(e.kutu, 1, 6); e.hata = tamSayi(e.hata, 0, 1e6) || 0; o.push(e);
    }
    if (o.length > 400) o.splice(0, o.length - 400);
    return b ? c.bozuk(o) : o;
  },
  ders: (x, v, c) => (nesneMi(x) ? x : c.bozuk({})),
  gorulen: (x, v, c) => {
    if (!nesneMi(x)) return c.bozuk({});
    const o = {}; let b = false;
    for (const k in x) { if (Array.isArray(x[k])) o[k] = x[k]; else b = true; }
    return b ? c.bozuk(o) : o;
  },
  rehber: (x, v, c) => (typeof x === 'boolean' ? x : c.bozuk(v)),
  kelRehber: (x, v, c) => (typeof x === 'boolean' ? x : c.bozuk(v)),
  tutGor: (x, v, c) => (typeof x === 'boolean' ? x : c.bozuk(v)),
  ayar: (x, v, c) => {
    if (!nesneMi(x)) return c.bozuk(Object.assign({}, v));
    const o = Object.assign({}, x); let b = false;
    for (const k in v) { if (!(k in x)) o[k] = v[k]; else if (typeof x[k] !== 'boolean') { o[k] = v[k]; b = true; } }
    return b ? c.bozuk(o) : o;
  },
  best: (x, v, c) => (sayiMi(x) && x >= 0 ? x : c.bozuk(0)),
  sonLvl: (x, v, c) => (typeof x === 'string' && c.seviyeVar(x) ? x : c.bozuk(v)),
  sonSekme: (x, v, c) => (x === 'cumle' || x === 'kelime' ? x : c.bozuk(v)),
  seviyeTesti: (x, v, c) => (x === null || (nesneMi(x) && SEVIYE_KODLARI.indexOf(x.sonuc) >= 0) ? x : c.bozuk(null)),
  istat: (x, v, c) => {
    if (!nesneMi(x)) return c.bozuk(Object.assign({}, v));
    const o = Object.assign({}, v); let b = false;
    for (const k in x) { if (sayiMi(x[k]) && x[k] >= 0) o[k] = x[k]; else b = true; }
    return b ? c.bozuk(o) : o;
  },
  sonKayit: (x, v, c) => (sayiMi(x) && x >= 0 ? x : c.bozuk(0)),
  xp: (x, v, c) => (sayiMi(x) && x >= 0 ? Math.round(x) : c.bozuk(0)),
  gunluk: (x, v, c) => {   // { hedef: 20|50|100, gunler: { 'YYYY-AA-GG': xp } }
    if (!nesneMi(x)) return c.bozuk({ hedef: v.hedef, gunler: {} });
    let b = false; const o = { hedef: [20, 50, 100].indexOf(x.hedef) >= 0 ? x.hedef : (b = true, v.hedef), gunler: {} };
    if (nesneMi(x.gunler)) { for (const k in x.gunler) { if (GUN_ANAHTAR.test(k) && sayiMi(x.gunler[k]) && x.gunler[k] >= 0) o.gunler[k] = Math.round(x.gunler[k]); else b = true; } }
    else if (x.gunler !== undefined) b = true;
    return b ? c.bozuk(o) : o;
  },
  seri: (x, v, c) => {     // { gun, enUzun, sonGun, dondurma 0..2, donan: [gün] }
    if (!nesneMi(x)) return c.bozuk(Object.assign({}, v, { donan: [] }));
    let b = false; const say = (y, en, ek) => { const z = tamSayi(y, en, ek); if (z === null || z !== y) b = true; return z === null ? en : z; };
    const o = { gun: say(x.gun, 0, 1e5), enUzun: 0, sonGun: null, dondurma: say(x.dondurma, 0, 2), donan: [] };
    o.enUzun = Math.max(say(x.enUzun, 0, 1e5), o.gun);
    if (x.sonGun === null || x.sonGun === undefined) o.sonGun = null; else if (typeof x.sonGun === 'string' && GUN_ANAHTAR.test(x.sonGun)) o.sonGun = x.sonGun; else b = true;
    if (o.gun && !o.sonGun) { o.gun = 0; b = true; }
    if (Array.isArray(x.donan)) o.donan = x.donan.filter(g => typeof g === 'string' && GUN_ANAHTAR.test(g)).slice(-30); else if (x.donan !== undefined) b = true;
    return b ? c.bozuk(o) : o;
  },
  gorev: (x, v, c) => {    // Günün Görevi: { son, seri, enUzun, toplam, gunler: { gün: en iyi skor } }
    if (!nesneMi(x)) return c.bozuk({ son: null, seri: 0, enUzun: 0, toplam: 0, gunler: {} });
    let b = false; const say = y => { const z = tamSayi(y, 0, 1e6); if (z === null || z !== y) b = true; return z === null ? 0 : z; };
    const o = { son: null, seri: say(x.seri), enUzun: 0, toplam: say(x.toplam), gunler: {} };
    o.enUzun = Math.max(say(x.enUzun), o.seri);
    if (x.son === null || x.son === undefined) o.son = null; else if (typeof x.son === 'string' && GUN_ANAHTAR.test(x.son)) o.son = x.son; else b = true;
    if (nesneMi(x.gunler)) { for (const k in x.gunler) { if (GUN_ANAHTAR.test(k) && sayiMi(x.gunler[k]) && x.gunler[k] >= 0) o.gunler[k] = Math.round(x.gunler[k]); else b = true; } }
    else if (x.gunler !== undefined) b = true;
    if (o.seri && !o.son) { o.seri = 0; b = true; }
    return b ? c.bozuk(o) : o;
  },
  rozet: (x, v, c) => {    // açılan rozetler: { id: zaman }
    if (!nesneMi(x)) return c.bozuk({});
    const o = {}; let b = false;
    for (const k in x) { if (sayiMi(x[k]) && x[k] > 0) o[k] = x[k]; else b = true; }
    return b ? c.bozuk(o) : o;
  },
};

/* Ham kayıt nesnesini doğrular.
   ham: JSON.parse çıktısı · bos: bosKayit() · seviyeVar: seviye kodu geçerli mi
   → { k: düzeltilmiş kayıt, bozuk: ['yildiz', ...], gocTi: eski sürüm } */
function kayitDuzelt(ham, bos, seviyeVar) {
  const bozuk = [];
  if (!nesneMi(ham)) return { k: bos, bozuk: ['tumu'], gocTi: null };
  const k = Object.assign({}, ham);
  let v = sayiMi(k.v) ? k.v : 1; const gocTi = v < KAYIT_SURUM ? v : null;
  if (v > KAYIT_SURUM) v = KAYIT_SURUM;               // daha yeni sürümden: tanıdığımız alanları doğrula, gerisine dokunma
  while (v < KAYIT_SURUM && GOCLER[v]) { GOCLER[v](k); v++; }
  k.v = KAYIT_SURUM;
  for (const ad in ALANLAR) {
    if (!(ad in k) || k[ad] === undefined) { k[ad] = bos[ad]; continue; }
    let b = false;
    const c = { seviyeVar: seviyeVar || (() => true), bozuk: d => { b = true; return d; } };
    k[ad] = ALANLAR[ad](k[ad], bos[ad], c);
    if (b) bozuk.push(ad);
  }
  // ilerleme var ama başlangıç seviyesi kayıpsa: ilk giriş ekranına geri gönderme
  if (!k.baslangic && Object.keys(k.yildiz).length) k.baslangic = 'A1';
  return { k, bozuk, gocTi };
}

/* Profil listesi: { aktif, liste: [{ id, ad, t }], eskiAktarildi } */
const PROFIL_ID = /^[A-Za-z0-9_-]{1,40}$/;
function profillerDuzelt(ham) {
  const bozuk = [];
  if (!nesneMi(ham) || !Array.isArray(ham.liste)) return { p: { aktif: null, liste: [], eskiAktarildi: !!(ham && ham.eskiAktarildi) }, bozuk: ['tumu'] };
  const liste = [], idler = {};
  for (const e of ham.liste) {
    if (!nesneMi(e) || typeof e.id !== 'string' || !PROFIL_ID.test(e.id) || idler[e.id]) { bozuk.push('profil'); continue; }
    let ad = typeof e.ad === 'string' ? e.ad.replace(/\s+/g, ' ').trim().slice(0, 16) : '';
    if (!ad) { ad = 'Profil ' + (liste.length + 1); bozuk.push('ad'); }
    idler[e.id] = 1; liste.push({ id: e.id, ad, t: sayiMi(e.t) ? e.t : 0 });
  }
  let aktif = ham.aktif;
  if (!liste.some(e => e.id === aktif)) { if (aktif !== null && aktif !== undefined) bozuk.push('aktif'); aktif = liste.length ? liste[0].id : null; }
  return { p: Object.assign({}, ham, { aktif, liste, eskiAktarildi: !!ham.eskiAktarildi }), bozuk };
}

/* Yarım bölüm kaydı oyunu açabilecek biçimde mi (içerik kontrolü yarimSurdur'da) */
function yarimGecerli(y) {
  return nesneMi(y) && y.v === 1 && typeof y.r === 'string' && (y.mod === 'kelime' || y.mod === 'bolum') &&
    nesneMi(y.tur) && typeof y.tur.tip === 'string' && nesneMi(y.G) && Array.isArray(y.G.pile) && sayiMi(y.G.score) &&
    nesneMi(y.D) && nesneMi(y.D.istat) && Array.isArray(y.D.hatalar) && (y.mod !== 'kelime' || (nesneMi(y.kelime) && Array.isArray(y.kelime.kuyruk)));
}


const $ = s => document.querySelector(s);
const cv = $('#c'), ctx = cv.getContext('2d');
const bgC = document.createElement('canvas'), bgx = bgC.getContext('2d');
const FONT = "Fredoka, Poppins, 'Trebuchet MS', sans-serif";   // videodaki gibi yuvarlak, tombul yazı
let W = 0, H = 0, DPR = 1, L = {};
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, k) => a + (b - a) * k;
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = a => a[(Math.random() * a.length) | 0];
function hexA(hex, a) { const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16 & 255},${n >> 8 & 255},${n & 255},${a})`; }
function renkKat(hex, k) { const n = parseInt(hex.slice(1), 16), f = v => clamp(Math.round(k < 1 ? v * k : v + (255 - v) * (k - 1)), 0, 255); return `rgb(${f(n >> 16 & 255)},${f(n >> 8 & 255)},${f(n & 255)})`; }
