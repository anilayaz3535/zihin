/* =====================================================================
   ÜNİTE HARİTASI (Kariyer ekranındaki yol)
   İçerikteki bölgeler (r.bolge) birer ünitedir; çoğu bir ara sınavla biter.
   Bu dosya yalnız gösterimdir: kilit kuralları (rakipAcikMi, paketAcikMi), bölüm
   sırası, içerik ve öğretim değişmez; durağa dokununca eskisi gibi cumleDojo /
   paketBaslat açılır. Kelime paketlerinin bölgesi olmadığından ardışık paketler
   türüne göre (konu paketleri / "Kelime N") en çok 6'lık gruplara ayrılır.
   Ünite tamam: bir bölgenin son yıldızsız bölümü ilk kez kazanılınca D.uniteTamam
   dolar (sonuç ekranında kutlanır) ve 'uniteTamam' olayı duyurulur.
   ===================================================================== */
const uniteOnbellek = {}, paketGrupOnbellek = {};
const SAYILI_PAKET = /^Kelime (\d+)$/;
const YOL_X = [22, 62, 78, 38];      // zikzak: durağın yatay yeri (%); yazı durağın geniş tarafına yazılır
const YOL_SATIR = 108, YOL_UST = 40; // px: iki durak arası, ilk durağın üstündeki boşluk

function uniteler(l) {
  if (uniteOnbellek[l]) return uniteOnbellek[l];
  const u = [];
  seviyeRakipleri(l).forEach(r => {
    const son = u[u.length - 1], b = r.bolge || '';
    if (son && son.bolge === b) son.bolumler.push(r); else u.push({ bolge: b, no: u.length + 1, bolumler: [r] });
  });
  return (uniteOnbellek[l] = u);
}
function uniteBul(r) { return r ? uniteler(r.lvl).find(u => u.bolumler.includes(r)) || null : null; }
function uniteDurum(u) {
  let yildiz = 0, biten = 0, acik = 0;
  u.bolumler.forEach(r => { const y = kayit.yildiz[r.id] || 0; yildiz += y; if (y) biten++; if (rakipAcikMi(r)) acik++; });
  return { yildiz, enCok: u.bolumler.length * 3, biten, toplam: u.bolumler.length, acik, tamam: biten === u.bolumler.length };
}
function paketGruplari(l) {
  if (paketGrupOnbellek[l]) return paketGrupOnbellek[l];
  const g = [];
  seviyePaketleri(l).forEach(p => {
    const tur = SAYILI_PAKET.test(p.ad) ? 'sayi' : 'konu', son = g[g.length - 1];
    if (son && son.tur === tur && son.paketler.length < 6) son.paketler.push(p); else g.push({ tur, no: g.length + 1, paketler: [p] });
  });
  return (paketGrupOnbellek[l] = g);
}
function paketGrupAd(g) {
  if (g.tur !== 'sayi') return tt('Konu paketleri');
  const a = g.paketler[0].ad.match(SAYILI_PAKET)[1], b = g.paketler[g.paketler.length - 1].ad.match(SAYILI_PAKET)[1];
  return a === b ? tt('Kelime {a}', { a }) : tt('Kelime {a}–{b}', { a, b });
}

/* ---------------- yol çizimi ---------------- */
// d: { id, ic (dairenin içi), etiket (html), sinif, aria, renk, acik, sira, oran (paket halkası %) }
function yolHtml(dl) {
  const y = i => YOL_UST + i * YOL_SATIR, x = i => YOL_X[i % YOL_X.length];
  const h = YOL_UST + (dl.length - 1) * YOL_SATIR + 76;
  let cizgi = '';
  for (let i = 1; i < dl.length; i++) cizgi += `<line x1="${x(i - 1)}" y1="${y(i - 1)}" x2="${x(i)}" y2="${y(i)}"${dl[i].acik ? ' class="acik"' : ''} vector-effect="non-scaling-stroke"/>`;
  const dg = dl.map((d, i) => {
    const xi = x(i), et = xi > 50 ? `right:calc(${100 - xi}% + 37px);max-width:calc(${xi}% - 45px)` : `left:calc(${xi}% + 37px);max-width:calc(${100 - xi}% - 45px)`;
    return `<div class="dugum ${d.sinif}${d.sira ? ' sira' : ''}" data-id="${d.id}" style="top:${y(i)}px;--x:${xi}%;--c:${d.renk}${d.oran != null ? ';--o:' + d.oran : ''}">
      <button class="top" aria-label="${esc(d.aria)}">${d.ic}</button>
      <div class="etiket${xi > 50 ? ' sol' : ''}" style="${et}">${d.sira ? `<span class="basla">${tt('BAŞLA')}</span>` : ''}${d.etiket}</div></div>`;
  }).join('');
  return `<div class="yol" style="height:${h}px"><svg viewBox="0 0 100 ${h}" preserveAspectRatio="none" aria-hidden="true">${cizgi}</svg>${dg}</div>`;
}
function uniteBaslikHtml(o) {   // o: { no, ad, sinif, renk, sol, sag, oran, ders }
  return `<div class="unite ${o.sinif}" style="--c:${o.renk}">
    <div class="u-ust"><span>${o.no}</span><span>${o.sag}</span></div>
    <b class="u-ad">${esc(o.ad)}</b>
    <div class="pbar"><i style="width:${o.oran}%"></i></div>
    <div class="u-alt"><span>${o.sol}</span>${o.ders ? `<button class="u-ders" data-id="${o.ders}">${tt('📖 Ders')}</button>` : ''}</div></div>`;
}

// Cümle yolu: üniteler, her birinde bölümler (ara sınav 🏆, seviye sınavı 👑)
function cumleYolCiz(l) {
  const sira = seviyeRakipleri(l).find(r => rakipAcikMi(r) && !kayit.yildiz[r.id]);
  let h = '', sayac = 0;
  uniteler(l).forEach(u => {
    const ud = uniteDurum(u), aktif = u.bolumler.includes(sira);
    const ders = (aktif && dersVarMi(sira) ? sira : null) || u.bolumler.filter(rakipAcikMi).reverse().find(dersVarMi) || null;
    h += uniteBaslikHtml({
      no: tt('ÜNİTE {n}', { n: u.no }), ad: bolgeAd(u.bolge), renk: u.bolumler[0].color,
      sinif: ud.tamam ? 'tamam' : aktif ? 'aktif' : ud.acik ? '' : 'kilit',
      sag: (ud.tamam ? tt('✓ TAMAMLANDI') + ' · ' : '') + '★ ' + ud.yildiz + ' / ' + ud.enCok,
      sol: tt('{a} / {b} bölüm', { a: ud.biten, b: ud.toplam }), oran: Math.round(ud.biten / ud.toplam * 100), ders: ders && ders.id
    });
    h += yolHtml(u.bolumler.map(r => {
      sayac++;
      const ac = rakipAcikMi(r), yy = kayit.yildiz[r.id] || 0;
      const ic = !ac ? '🔒' : r.usta === 2 ? '👑' : r.usta ? '🏆' : r === sira ? '▶' : sayac;
      const tur = r.usta === 2 ? tt('SEVİYE SINAVI') : r.usta ? tt('ARA SINAV') : '';
      const durum = !ac ? tt('kilitli') : r === sira ? tt('sıradaki') : tt('{y} / 3 yıldız', { y: yy });
      return {
        id: r.id, ic, renk: r.color, acik: ac, sira: r === sira, sinif: (ac ? (yy ? 'bitti' : '') : 'kilit') + (r.usta ? ' sinav' : ''),
        aria: r.world + (tur ? ' · ' + tur : '') + ' · ' + durum,
        etiket: `<b>${esc(r.world)}</b>${tur ? `<em class="chip usta">${tur}</em>` : ''}<span class="kural">${esc(r.rule || (r.karma ? tt('Bütün seviyeden karışık') : ''))}</span>${ac ? `<span class="yz">${yildizHtml(yy)}</span>` : ''}`
      };
    }));
  });
  $('#liste').innerHTML = h;
  $('#liste').querySelectorAll('.dugum').forEach(b => b.onclick = () => {
    const r = rakipBul(b.dataset.id);
    if (!rakipAcikMi(r)) { not(tt('Önce bir önceki bölümü bitir.')); return; }
    Ses.cal('tik', { ses: 0.5 }); cumleDojo(r);
  });
  $('#liste').querySelectorAll('.u-ders').forEach(b => b.onclick = e => {
    e.stopPropagation(); const r = rakipBul(b.dataset.id); if (!r) return;
    Ses.cal('tik', { ses: 0.4 }); dersAc(r, () => cumleDojo(r), () => haritaAc(r.lvl));
  });
}

// Kelime yolu: paket grupları; her durakta öğrenilen / toplam halkası
function paketYolCiz(l) {
  const pl = seviyePaketleri(l);
  const sira = pl.find(p => { if (!paketAcikMi(p)) return false; const q = paketIlerleme(p); return q.tanisilan < q.toplam || !kayit.yildiz[p.id]; });
  let h = '';
  paketGruplari(l).forEach(g => {
    let o = 0, t = 0, yz = 0, ac = 0;
    g.paketler.forEach(p => { const q = paketIlerleme(p); o += q.ogrenilen; t += q.toplam; yz += kayit.yildiz[p.id] || 0; if (paketAcikMi(p)) ac++; });
    const aktif = g.paketler.includes(sira), tamam = o === t && g.paketler.every(p => kayit.yildiz[p.id]);
    h += uniteBaslikHtml({
      no: tt('GRUP {n}', { n: g.no }), ad: paketGrupAd(g), renk: g.paketler[0].color, sinif: tamam ? 'tamam' : aktif ? 'aktif' : ac ? '' : 'kilit',
      sag: (tamam ? tt('✓ TAMAMLANDI') + ' · ' : '') + '★ ' + yz + ' / ' + g.paketler.length * 3,
      sol: tt('{a} / {b} öğrenildi', { a: o, b: t }), oran: Math.round(o / Math.max(1, t) * 100), ders: null
    });
    h += yolHtml(g.paketler.map(p => {
      const a = paketAcikMi(p), q = paketIlerleme(p), yy = kayit.yildiz[p.id] || 0, oran = Math.round(q.ogrenilen / Math.max(1, q.toplam) * 100);
      const ic = !a ? '🔒' : p === sira ? '▶' : q.ogrenilen === q.toplam ? '✓' : pl.indexOf(p) + 1;
      return {
        id: p.id, renk: p.color, acik: a, sira: p === sira, oran: a ? oran : 0, sinif: 'pk' + (a ? (yy ? ' bitti' : '') : ' kilit'),
        ic: `<i>${ic}</i>`, aria: p.ad + ' · ' + (a ? tt('{a} / {b} öğrenildi', { a: q.ogrenilen, b: q.toplam }) : tt('kilitli')),
        etiket: `<b>${esc(p.ad)}</b><span class="say">${esc(p.ilk + ' – ' + p.son)}</span><span class="say">${tt('{a} / {b} öğrenildi', { a: q.ogrenilen, b: q.toplam })}</span>${a ? `<span class="yz">${yildizHtml(yy)}</span>` : ''}`
      };
    }));
  });
  $('#liste').innerHTML = h;
  $('#liste').querySelectorAll('.dugum').forEach(b => b.onclick = () => {
    const p = paketBul(b.dataset.id);
    if (!paketAcikMi(p)) { paketKilitUyar(p); return; }
    Ses.cal('tik', { ses: 0.5 }); paketBaslat(p);
  });
}
function paketKilitUyar(p) {
  const lp = seviyePaketleri(p.lvl), o = lp[lp.indexOf(p) - 1];

/* =====================================================================
   STRATEJİ MAÇI (online kapışmanın ikinci modu; bilgisayara karşı da oynanır)
   Bilgi + strateji: önce tahtayı düzenle, sonra doğru kelimeleri seç, en büyük patlamayı yap.
   · Tahta bir kitap sayfası gibi soldan sağa, satır satır okunan bir sıradır; birkaç hücresi boştur.
     Bir karoyu başka bir karonun üstüne bırakınca o hücreye oturur; oradaki karo ve arkasındakiler
     sağa kayar (satır bitince alt satırın başına iner) ve ilk boşluğu doldurur. Karonun eski yeri boşalır.
     Boş hücreye bırakmak kaydırmaz. Her taşıma 1 hamle; hamle sayısı sınırlı (kelime sayısı + 6), süre rahat.
   · Kelime seçimi: cümlenin kelimeleri sırayla alttaki kutulara çekilir; kutuya karonun gölgesi gider,
     karonun kendisi tahtada kalır (seçmek ve geri almak hamle harcamaz).
   · BOMBA: kutular dolunca basılır. Cümle doğruysa seçilen karolar ve onlara yan yana / alt alta değen
     aynı renkli karolar birlikte patlar; kalanlar düşer, 4+ aynı renk birleşirse zincirleme patlar.
     Cümle yanlışsa patlama olmaz, tur puanı 0.
   · Tur: ikisi de doğruysa çok puan alan, biri doğruysa doğru kuran kazanır; ikisi de yanlışsa berabere.
     Maç 3 tur; en çok tur kazanan, eşitse toplam puanı yüksek olan kazanır.
   · Tahta stratejiye göre hazırlanır: iki oyuncuya aynı tohumla aynı tahta; tuzak kelimeler doğrusuyla aynı renkte
     (renge bakarak değil, bilerek seçilir); başlangıçta hedef kelimelerin yanında kendi renginden karo yoktur ve
     hazır üçlü yoktur: patlamayı oyuncu kendisi kurar.
   Ağ mesajları (online.js odası): basla (mod: 'strateji', tohum, cümleler) · stur (tur sonucu: doğru, puan) · cikti
   ===================================================================== */
const STR_TUR = 3, STR_SURE = 180, STR_SUTUN = 6, STR_BOS = 3, STR_KASKAD = 4, STR_RENK_N = 4;
const STR_ARALIK = { A1: [4, 6], A2: [4, 7], B1: [5, 8], B2: [5, 9], C1: [5, 10], C2: [6, 10] };
const STR_BOT_DOGRU = { A1: 0.86, A2: 0.84, B1: 0.8, B2: 0.78, C1: 0.75, C2: 0.72 };
let STR = null;   // açık maç

/* ---------------- saf kurallar (tahta, taşıma, patlama) ---------------- */
const strKucuk = t => String(t).toLowerCase().replace(/[^a-zçğıöşü0-9']/gi, '');
function strCumleler(lvl, r) {
  r = r || Math.random;
  const [en, ek] = STR_ARALIK[lvl] || [4, 8], rl = seviyeRakipleri(lvl).filter(cumleliMi), out = [], gor = {};
  for (let n = 0; n < 600 && out.length < STR_TUR && rl.length; n++) {
    const h = cumleler(rl[Math.floor(r() * rl.length)].id); if (!h.length) continue;
    const s = h[Math.floor(r() * h.length)], k = s.kaynak + ':' + s.i;
    if (gor[k] || s.w.length < en || s.w.length > ek || s.w.some(w => [...w[0]].length > 13)) continue;
    gor[k] = 1; out.push([s.kaynak, s.i]);
  }
  return out;
}
// tahta: { cols, rows, h: [karo | null], hedef: [metin], n } · karo: { id, txt, ci, k (hedefteki sıra, yoksa -1), cel (tuzak) }
function strTahta(s, lvl, tohum) {
  const r = tohumluRastgele(tohum), al = a => a[Math.floor(r() * a.length)];
  const karistir_ = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const hedef = s.w.map(w => w[0]), n = hedef.length, li = Math.max(0, SEVIYELER.indexOf(lvl));
  const cols = STR_SUTUN, rows = n >= 8 ? 7 : 6, hucre = cols * rows, karoN = hucre - STR_BOS;
  const kul = new Set(hedef.map(strKucuk)), karolar_ = [];
  let id = 0;
  // hedef kelimeler: renkler dengeli (bir renkte en çok yarısı)
  const hr = karistir_([...Array(Math.ceil(n / STR_RENK_N) + 1)].flatMap(() => [0, 1, 2, 3])).slice(0, n);
  hedef.forEach((t, k) => karolar_.push({ id: ++id, txt: t, ci: hr[k], k, cel: false }));
  // tuzaklar: doğrusuyla aynı renk (bilgi testi); seviye yükseldikçe çoğalır
  const tuzakN = Math.min(n, 2 + li), adaylar = [];
  s.w.forEach((w, k) => [w[1], w[2]].forEach(c => { if (c && !kul.has(strKucuk(c))) adaylar.push({ c, k }); }));
  karistir_(adaylar).forEach(a => { if (karolar_.length - n >= tuzakN || kul.has(strKucuk(a.c))) return; kul.add(strKucuk(a.c)); karolar_.push({ id: ++id, txt: a.c, ci: hr[a.k], k: -1, cel: true, of: a.k }); });
  // dolgu kelimeler: aynı seviyenin başka cümlelerinden; renkler toplamı dengeler
  const havuz = [], rl = seviyeRakipleri(lvl).filter(cumleliMi);
  for (let d = 0; d < 80 && havuz.length < 160; d++) { const h = cumleler(al(rl).id); const c = h.length && al(h); if (c) c.w.forEach(w => { const t = w[0], kk = strKucuk(t); if (kk && !kul.has(kk) && [...t].length <= 11 && !/[.,!?]/.test(t)) { kul.add(kk); havuz.push(t === 'I' ? t : t.toLowerCase()); } }); }
  const say = [0, 0, 0, 0]; karolar_.forEach(k => say[k.ci]++);
  while (karolar_.length < karoN) {
    let ci = 0; for (let c = 1; c < STR_RENK_N; c++) if (say[c] < say[ci] || (say[c] === say[ci] && r() < 0.5)) ci = c;
    say[ci]++; karolar_.push({ id: ++id, txt: havuz.length ? havuz.pop() : '…', ci, k: -1, cel: false });
  }
  // yerleştir, sonra stratejiye uygun hale getir: hazır üçlü yok, hedef karonun yanında kendi rengi yok
  const T = { cols, rows, n, hedef, h: karistir_(karolar_.concat(Array(STR_BOS).fill(null))) };
  for (let d = 0; d < 4000; d++) {
    const kotu = strKotuHucreler(T); if (!kotu.length) break;
    const a = al(kotu), b = Math.floor(r() * hucre); [T.h[a], T.h[b]] = [T.h[b], T.h[a]];
  }
  return T;
}
function strKomsu(T, i) { const c = i % T.cols, o = []; if (c > 0) o.push(i - 1); if (c < T.cols - 1) o.push(i + 1); if (i - T.cols >= 0) o.push(i - T.cols); if (i + T.cols < T.h.length) o.push(i + T.cols); return o; }
function strGrup(T, i) {   // i'den başlayıp aynı renkte bağlı hücreler
  const k = T.h[i]; if (!k) return [];
  const g = [i], gor = new Set(g);
  for (let q = 0; q < g.length; q++) strKomsu(T, g[q]).forEach(j => { if (!gor.has(j) && T.h[j] && T.h[j].ci === k.ci) { gor.add(j); g.push(j); } });
  return g;
}
function strKotuHucreler(T) {
  const o = new Set();
  T.h.forEach((k, i) => {
    if (!k) return;
    if (k.k >= 0 && strKomsu(T, i).some(j => T.h[j] && T.h[j].ci === k.ci)) o.add(i);
    const g = strGrup(T, i); if (g.length >= 3) g.forEach(x => o.add(x));
  });
  return [...o];
}
// taşı: karo 'a' hücresinden 'b' hücresine; b doluysa b ve arkasındakiler sağa (satır sonunda alta) kayar, ilk boşluğu doldurur
function strTasi(T, a, b) {
  if (a === b || !T.h[a]) return false;
  const N = T.h.length, karo = T.h[a]; T.h[a] = null;
  if (T.h[b]) {
    let e = (b + 1) % N; while (T.h[e]) e = (e + 1) % N;          // ilk boşluk (karonun boşalttığı yer kesin var)
    for (let p = e; p !== b; p = (p - 1 + N) % N) T.h[p] = T.h[(p - 1 + N) % N];
  }
  T.h[b] = karo;
  return true;
}
function strHucreBul(T, id) { return T.h.findIndex(k => k && k.id === id); }
// bombanın patlattığı hücreler: seçilen karolar + onlara bağlı aynı renk
function strBombaHucreleri(T, idler) {
  const o = new Set();
  idler.forEach(id => { const i = strHucreBul(T, id); if (i >= 0) strGrup(T, i).forEach(x => o.add(x)); });
  return [...o];
}
function strDus(T) {   // her sütunda karolar aşağı iner
  for (let c = 0; c < T.cols; c++) {
    const col = []; for (let r = T.rows - 1; r >= 0; r--) { const k = T.h[r * T.cols + c]; if (k) col.push(k); }
    for (let r = T.rows - 1, j = 0; r >= 0; r--, j++) T.h[r * T.cols + c] = col[j] || null;
  }
}
function strKaskadBul(T) { const o = new Set(); T.h.forEach((k, i) => { if (k && !o.has(i)) { const g = strGrup(T, i); if (g.length >= STR_KASKAD) g.forEach(x => o.add(x)); } }); return [...o]; }
// bütün patlamayı hesaplar (animasyon için adımlarıyla): [{ hucreler, puan, zincir }]
function strPatlamaPlani(T, idler) {
  const t = { cols: T.cols, rows: T.rows, h: T.h.slice() }, adimlar = [];
  let hs = strBombaHucreleri(t, idler), z = 0;
  while (hs.length) {
    adimlar.push({ hucreler: hs.slice(), puan: Math.round(hs.length * 10 * (1 + z * 0.5)), zincir: z, idler: hs.map(i => t.h[i].id) });
    hs.forEach(i => { t.h[i] = null; }); strDus(t); z++;
    adimlar[adimlar.length - 1].sonra = t.h.slice();
    hs = strKaskadBul(t);
  }
  const kalan = t.h.filter(Boolean).length;
  return { adimlar, puan: adimlar.reduce((a, x) => a + x.puan, 0) + (kalan === 0 ? 300 : 0), temiz: kalan === 0, kalan };
}
function strDogruMu(T, secim) { return secim.length === T.hedef.length && secim.every((k, i) => k && strKucuk(k.txt) === strKucuk(T.hedef[i])); }

/* ---------------- bilgisayar rakip ---------------- */
// Bilgisi seviyeye göre (çoğunlukla doğru seçer), stratejisi açgözlü: her hamlede bombanın en çok büyüdüğü taşımayı yapar.
function strBotOyna(T0, lvl, r) {
  const T = { cols: T0.cols, rows: T0.rows, n: T0.n, hedef: T0.hedef, h: T0.h.slice() };
  const secim = T0.hedef.map((t, k) => T.h.find(x => x && x.k === k));
  let dogru = r() < (STR_BOT_DOGRU[lvl] || 0.8);
  if (!dogru) {
    const tz = T.h.filter(x => x && x.cel);
    if (tz.length) { const z = tz[Math.floor(r() * tz.length)]; secim[z.of >= 0 ? z.of : 0] = z; }
    else if (secim.length > 1) [secim[0], secim[1]] = [secim[1], secim[0]];
    dogru = strDogruMu(T, secim);
  }
  const idler = secim.map(k => k.id), deger = t => strBombaHucreleri(t, idler).length;
  let hak = Math.round((T0.n + 6) * (0.4 + r() * 0.3));   // hamle hakkının bir kısmını kullanır: güçlü ama yenilebilir
  for (; hak > 0; hak--) {
    const once = deger(T), adaylar = [];
    for (let a = 0; a < T.h.length; a++) {
      if (!T.h[a]) continue;
      for (let b = 0; b < T.h.length; b++) {
        if (a === b) continue;
        const t = { cols: T.cols, rows: T.rows, h: T.h.slice() }; strTasi(t, a, b);
        const v = deger(t); if (v > once) adaylar.push({ a, b, v });
      }
    }
    if (!adaylar.length) break;
    adaylar.sort((x, y) => y.v - x.v);
    const sec = adaylar[Math.min(adaylar.length - 1, Math.floor(r() * r() * 5))];
    strTasi(T, sec.a, sec.b);
  }
  return { dogru, puan: dogru ? strPatlamaPlani(T, idler).puan : 0 };
}

/* ---------------- maç ---------------- */
// o: { mac, lvl, tohum, cum: [[kaynak, i]×3], rakip: { ad, bot }, online }
function strMacBaslat(o) {
  const liste = (o.cum || []).filter(a => Array.isArray(a) && sAl(a));
  if (!liste.length) { not(tt('Maç başlatılamadı.')); return; }
  strKapat();
  if (G.state !== 'menu') demo();
  D = null; Konus.sus(); Ses.muzik('duello'); Ses.yogunluk(0, true);
  STR = { mac: o.mac, lvl: o.lvl, tohum: o.tohum, cum: liste, tur: -1, ben: [], rakipS: [], rakip: o.rakip, online: !!o.online, karar: null, xp0: kayit.xp, R: null, zaman: null };
  ekranlariKapat(); strEkranKur();
  strKuralGoster();
}
function strAktif() { return !!STR; }
function strTurBaslat() {
  const M = STR; if (!M) return;
  M.tur++;
  const s = sAl(M.cum[M.tur]), T = strTahta(s, M.lvl, M.tohum + ':' + M.tur);
  M.R = { s, T, hamle: T.n + 6, secim: Array(T.n).fill(null), secili: -1, sure: STR_SURE, t0: Date.now(), bitti: false, sonuc: null };
  if (M.rakip.bot) {   // bilgisayar turu kendi tohumuyla oynar, 40–150 sn sonra bitirir
    const r = tohumluRastgele(M.tohum + ':bot:' + M.tur), sn = strBotOyna(T, M.lvl, r), tur = M.tur;
    M.botSonuc = () => { clearTimeout(M.botT); strRakipSonuc({ tur, dogru: sn.dogru, puan: sn.puan }); };
    M.botT = setTimeout(M.botSonuc, (35 + r() * 90) * 1000);
  }
  strCiz(true);
  clearInterval(M.zaman); M.zaman = setInterval(strSaat, 250);
  Ses.cal('dus', { ses: 0.6 });
}
function strSaat() {
  const M = STR, R = M && M.R; if (!R || R.bitti) return;
  const kalan = Math.max(0, R.sure - (Date.now() - R.t0) / 1000);
  const el = $('#st-sure'); if (el) { el.textContent = '⏱ ' + Math.floor(kalan / 60) + ':' + String(Math.floor(kalan % 60)).padStart(2, '0'); el.classList.toggle('az', kalan <= 20); }
  if (kalan <= 10 && Math.ceil(kalan) !== R.sonTik) { R.sonTik = Math.ceil(kalan); if (kalan > 0) Ses.cal('saat', { ses: 0.4 }); }
  if (kalan <= 0) { if (R.secim.every(Boolean)) strBomba(); else strTurBitir(false, 0, tt('Süre doldu, kutular dolmadı.')); }
}
function strKutuDolu() { return STR && STR.R && STR.R.secim.every(Boolean); }

/* ---------------- oyuncu eylemleri ---------------- */
function strTasiOyuncu(a, b) {
  const R = STR && STR.R; if (!R || R.bitti || a === b || !R.T.h[a]) return false;
  if (R.hamle <= 0) { not(tt('Hamle hakkın bitti. Kelimeleri kutulara çek ve bombaya bas.')); Ses.cal('geri', { ses: 0.5 }); return false; }
  strTasi(R.T, a, b); R.hamle--; R.secili = -1;
  Ses.cal('kay', { ses: 0.6 }); Yerel.titret('hafif');
  strCiz();
  return true;
}
function strSec(i, kutu) {   // hücre i'deki karonun gölgesi kutuya
  const R = STR && STR.R; if (!R || R.bitti || !R.T.h[i]) return;
  const k = R.T.h[i];
  if (kutu == null || kutu < 0) kutu = R.secim.findIndex(x => !x);
  if (kutu < 0) { not(tt('Kutular dolu. Değiştirmek için bir kutuya dokun.')); return; }
  const eski = R.secim.findIndex(x => x && x.id === k.id); if (eski >= 0) R.secim[eski] = null;
  R.secim[kutu] = k; R.secili = -1;
  Ses.cal('al', { ses: 0.5 }); Yerel.titret('hafif');
  strCiz();
}
function strKutuBosalt(kutu) { const R = STR && STR.R; if (!R || R.bitti || !R.secim[kutu]) return; R.secim[kutu] = null; Ses.cal('geri', { ses: 0.35 }); strCiz(); }
function strBomba() {
  const M = STR, R = M && M.R; if (!R || R.bitti || !R.secim.every(Boolean)) return;
  R.bitti = true; R.secili = -1;
  const dogru = strDogruMu(R.T, R.secim);
  if (!dogru) {
    Ses.cal('yanlis', { ses: 0.8 }); Yerel.titret('hata');
    strTahtaEl().classList.add('sars'); setTimeout(() => { const t = strTahtaEl(); if (t) t.classList.remove('sars'); }, 500);
    strCiz();
    setTimeout(() => strTurBitir(false, 0, tt('Cümle yanlış: bomba patlamadı.')), 900);
    return;
  }
  const plan = strPatlamaPlani(R.T, R.secim.map(k => k.id));
  Ses.cal('bomba', { ses: 1 }); Yerel.titret('basari');
  strFlas();
  let toplam = 0;
  plan.adimlar.forEach((a, n) => setTimeout(() => {
    if (STR !== M) return;
    a.hucreler.forEach(i => { const el = strKaroEl(R.T.h[i] && R.T.h[i].id); if (el) { el.classList.add('pat'); strKivilcim(el, R.T.h[i].ci); } });
    toplam += a.puan; strPuanUc('+' + a.puan, a.zincir);
    Ses.cal(a.zincir ? 'zincir' : 'super', { ses: 0.9, hiz: 1 + a.zincir * 0.12 });
    if (a.zincir) Yerel.titret('orta');
    setTimeout(() => { if (STR !== M) return; R.T.h = a.sonra; strCiz(); Ses.cal('dus', { ses: 0.4 }); }, 520);
  }, 600 + n * 1100));
  setTimeout(() => strTurBitir(true, plan.puan, plan.temiz ? tt('TAHTA TEMİZLENDİ! +300') : ''), 600 + plan.adimlar.length * 1100 + 500);
}
function strTurBitir(dogru, puan, not_) {
  const M = STR, R = M && M.R; if (!R || R.sonuc) return;
  R.bitti = true; R.sonuc = { dogru, puan, not: not_ || '' };
  const tur = M.tur;
  M.ben[tur] = { dogru, puan, secim: R.secim.map(k => k ? k.txt : '…').join(' ') };
  if (M.online) [0, 900, 2200].forEach(ms => setTimeout(() => { if (OD.kod && STR === M) Ag.gonder({ t: 'stur', mac: M.mac, tur, dogru, puan }); }, ms));
  if (M.rakip.bot && !M.rakipS[tur]) { clearTimeout(M.botT); M.botT = setTimeout(M.botSonuc, (3 + Math.random() * 7) * 1000); }   // oyuncu bitirdi: bilgisayar az sonra bitirir
  strTurPaneli();
}
// rakibin tur sonucu (ağdan ya da bilgisayardan)
function strRakipSonuc(o) {
  const M = STR; if (!M || !(o.tur >= 0 && o.tur < STR_TUR) || M.rakipS[o.tur]) return;
  M.rakipS[o.tur] = { dogru: !!o.dogru, puan: Math.max(0, Math.round(+o.puan || 0)) };
  strCiz();
  if (M.R && M.R.sonuc) strTurPaneli();
}
function strTurKazanan(b, r) {   // 1: ben, -1: rakip, 0: berabere
  if (b.dogru && r.dogru) return Math.sign(b.puan - r.puan);
  return b.dogru ? 1 : r.dogru ? -1 : 0;
}
function strSkor() {
  const M = STR; let b = 0, r = 0, pb = 0, pr = 0;
  for (let i = 0; i < STR_TUR; i++) { const x = M.ben[i], y = M.rakipS[i]; if (!x || !y) continue; const k = strTurKazanan(x, y); if (k > 0) b++; else if (k < 0) r++; pb += x.puan; pr += y.puan; }
  return { b, r, pb, pr };
}
function strRakipGitti(neden) {
  const M = STR; if (!M || M.karar) return;
  strKararVer('kazandin', tt(neden === 'ayrildi' ? '{ad} maçtan ayrıldı.' : '{ad} ile bağlantı koptu.', { ad: esc(M.rakip.ad) }));
}
function strMacSonu() {
  const M = STR; if (!M || M.karar) return;
  const s = strSkor();
  if (s.b !== s.r) return strKararVer(s.b > s.r ? 'kazandin' : 'kaybettin', tt('Turlar: {a} – {b}', { a: s.b, b: s.r }));
  if (s.pb !== s.pr) return strKararVer(s.pb > s.pr ? 'kazandin' : 'kaybettin', tt('Turlar berabere; toplam puan: {a} – {b}', { a: s.pb, b: s.pr }));
  strKararVer('berabere', tt('Turlar ve puanlar eşit.'));
}
function strKararVer(k, neden) {
  const M = STR; if (!M || M.karar) return;
  M.karar = { k, neden };
  clearInterval(M.zaman); clearTimeout(M.botT);
  if (M.online) { kayit.istat.online = (kayit.istat.online || 0) + 1; if (k === 'kazandin') kayit.istat.onlineGalibiyet = (kayit.istat.onlineGalibiyet || 0) + 1; }
  Olay.yay('onlineBitti', { kazandi: k === 'kazandin', neden, mod: 'strateji', bot: !!M.rakip.bot });
  kaydet();
  Ses.cal(k === 'kazandin' ? 'zafer' : k === 'berabere' ? 'yukselis' : 'yenilgi', { ses: 0.9 });
  setTimeout(strSonucGoster, 700);
}

/* ---------------- ekran ---------------- */
let strEl = null, strDok = null;
const strTahtaEl = () => strEl && strEl.querySelector('.st-tahta');
const strKaroEl = id => strEl && strEl.querySelector(`.st-k[data-id="${id}"]`);
function strEkranKur() {
  if (!strEl) { strEl = document.createElement('div'); strEl.id = 'str'; document.body.appendChild(strEl); }

  Olay.dinle('dogruHamle', () => { if (oyunda()) titret('hafif'); });
  Olay.dinle('hata', () => titret('hata'));

  Olay.dinle('bolumBitti', v => { if (v.kazandi) titret('basari'); });

  /* ---- geri tuşu (Android) ---- */
  function geri() {
    if (typeof STR !== 'undefined' && STR && !ov.classList.contains('show')) { strCikSor(); return; }   // strateji maçı
    if (typeof dzAcik !== 'undefined' && dzAcik && G.state === 'playing') { dzAcik.kapat(); return; }   // İngilizce dizilişi kartı
    if (G.state === 'playing') { togglePause(); return; }
    if (G.state === 'paused') {
      if (ekran === 'pause') { togglePause(); return; }
      const g = card.querySelector('#a-geri, .geri'); if (g) { g.click(); return; }
      showPause(); return;
    }
    // menüler: ekrandaki geri düğmesi, yoksa açılışa; açılıştaysa uygulamayı arka plana al
    const g = card && card.querySelector('.ust-satir .geri, #d-geri, #r-geri, #p-geri, #a-geri, #s-harita, #ss-cik, #os-cik, #es-iptal, #oda-cik');
    if (ekran === 'acilis' || ekran === 'ilkKarsila') { const A = ek('App'); if (A && A.minimizeApp) A.minimizeApp(); else if (A) A.exitApp(); return; }
    if (g) { g.click(); return; }
    if (aktifProfil()) acilisAc();
  }

  /* ---- günlük hatırlatma ---- */
  const HATIRLAT_SAAT = 19, BILDIRIM_ILK = 4100;
  const MESAJLAR = [
    ['🔥 Serin seni bekliyor', 'Bugünkü hedefe birkaç cümle kaldı. 3 dakikan var mı?'],
    ['📅 Günün görevi hazır', 'Bugünün 5 cümlesi seni bekliyor.'],
    ['☕ Kısa bir mola?', 'Bir bölüm oyna, günlük hedefini tamamla.'],
    ['✏️ Bugün bir cümle kur', 'Her gün biraz İngilizce, serini koru.'],
  ];
  async function hatirlatAyarla() {
    const N = ek('LocalNotifications'); if (!N) return;
    try {
      const bekleyen = await N.getPending();
      const bizim = (bekleyen.notifications || []).filter(n => n.id >= BILDIRIM_ILK && n.id < BILDIRIM_ILK + 20).map(n => ({ id: n.id }));
      if (bizim.length) await N.cancel({ notifications: bizim });
      if (!kayit.ayar.hatirlat || !aktifProfil()) return;
      const liste = [], simdi = new Date();
      for (let i = 0; i < 7; i++) {
        const t = new Date(simdi.getFullYear(), simdi.getMonth(), simdi.getDate() + i, HATIRLAT_SAAT, 0, 0);
        if (t <= simdi) continue;
        if (i === 0 && ilerlemeOzet().tamam) continue;           // bugünün hedefi tamam: bugün hatırlatma yok
        const m = MESAJLAR[i % MESAJLAR.length];
        liste.push({ id: BILDIRIM_ILK + i, title: tt(m[0]), body: tt(m[1]), schedule: { at: t, allowWhileIdle: true } });
      }
      if (liste.length) await N.schedule({ notifications: liste });
    } catch (e) { console.warn('Hatırlatma kurulamadı', e); }
  }
  async function hatirlatIzin() {
    const N = ek('LocalNotifications'); if (!N) return false;
    try {
      let p = await N.checkPermissions();
      if (p.display !== 'granted') p = await N.requestPermissions();
      return p.display === 'granted';
    } catch (e) { return false; }
  }
  // Ayarlar'da anahtar açılınca
  async function hatirlatDegisti() {
    if (kayit.ayar.hatirlat && !(await hatirlatIzin())) {
      kayit.ayar.hatirlat = false; kaydet();
      not(tt('Bildirim izni verilmedi. Telefonun ayarlarından açabilirsin.'));
      if (ekran === 'ayar') { const b = card.querySelector('[data-a="hatirlat"]'); if (b) b.classList.remove('acik'); }
    }
    hatirlatAyarla();
  }
  Olay.dinle('hedefTamam', () => hatirlatAyarla());
  Olay.dinle('kayitYuklendi', () => hatirlatAyarla());

  /* ---- açılış ---- */
  function kur() {
    if (!yerliMi()) return;
    document.documentElement.classList.add('uygulama', 'platform-' + platform());
    const S = ek('StatusBar'); if (S) { try { S.hide(); } catch (e) { } }
    const A = ek('App');
    if (A) {
      A.addListener('backButton', geri);
      A.addListener('appStateChange', s => {
        if (!s.isActive) { if (G.state === 'playing') togglePause(); Konus.sus(); Ses.uyu(); }
        else { Ses.uyan(); hatirlatAyarla(); }
      });
    }
    const bekle = () => { if (window.__acildi) { const SP = ek('SplashScreen'); if (SP) { try { SP.hide({ fadeOutDuration: 250 }); } catch (e) { } } hatirlatAyarla(); } else setTimeout(bekle, 100); };
    bekle();
  }
  return { kur, yerliMi, platform, titret, geri, hatirlatAyarla, hatirlatDegisti, bildirimVar: () => !!ek('LocalNotifications') };
})();

function siradakiBolum(yol, l) {
  const ara = yol === 'kelime'
    ? lv => seviyePaketleri(lv).find(p => { if (!paketAcikMi(p)) return false; const q = paketIlerleme(p); return q.tanisilan < q.toplam || !kayit.yildiz[p.id]; })
    : lv => seviyeRakipleri(lv).find(r => rakipAcikMi(r) && !kayit.yildiz[r.id]);
  let s = ara(l); if (s) return s;
  for (const lv of SEVIYELER) { s = ara(lv); if (s) return s; }
  return (yol === 'kelime' ? seviyePaketleri(l).filter(paketAcikMi) : seviyeRakipleri(l).filter(rakipAcikMi)).pop() || null;
}
function haritaAc(lvl) {
  if (G.state !== 'menu') demo();
  D = null;
  Ses.muzik('menu'); Konus.sus();
  const p = aktifProfil(); if (!p) { profilsizAc(); return; }
  if (!kayit.baslangic) { ilkGiris(); return; }
  if (lvl && SEVIYE[lvl]) aktifLvlK = lvl;
  if (!aktifLvlK || !SEVIYE[aktifLvlK]) aktifLvlK = SEVIYE[kayit.sonLvl] ? kayit.sonLvl : 'A1';
  if (SEVIYELER.indexOf(aktifLvlK) >= 0 && !seviyeAcikMi(aktifLvlK)) aktifLvlK = sonAcikSeviye();
  if (kayit.sonSekme) aktifYol = kayit.sonSekme;
  const hz = srsHazir().length + kelHazir().length;
  const sec = l => { const ac = SEVIYELER.indexOf(l) < 0 || seviyeAcikMi(l); return `<option value="${l}"${l === aktifLvlK ? ' selected' : ''}${ac ? '' : ' disabled'}>${ac ? '' : '🔒 '}${SEVIYELER.indexOf(l) >= 0 ? l + ' · ' : ''}${esc(seviyeAd(l))}</option>`; };
  goster(`<div class="kariyer">
    <div class="ust-satir"><button class="geri" id="k-geri">${tt('← Geri')}</button><span class="k-ad">👤 ${esc(p.ad)} · ${esc(kayit.sonLvl || 'A1')}</span></div>
    <button class="big devam-btn" id="k-devam"></button>
    <div class="k-satir"><select id="k-sev" class="secici" aria-label="${tt('Seviye')}">
      <optgroup label="${tt('Genel İngilizce')}">${SEVIYELER.map(sec).join('')}</optgroup>
      <optgroup label="${tt('Sınav Yolu')}">${SINAVLAR.map(sec).join('')}</optgroup>
      <optgroup label="${tt('Hayat İngilizcesi')}">${HAYATLAR.map(sec).join('')}</optgroup></select>
      <button class="sec kucuk-btn" id="k-st">${tt('Seviyeni ölç')}</button></div>
    <div class="seviye-bilgi" id="seviye-bilgi"></div>
    <div class="yol-sec" id="yol-sec"></div>
    <div class="ing-sec" id="ing-sec"></div>
    <div id="liste"></div>
    <div class="k-alt"><button id="k-tekrar" class="${hz ? 'hazir' : ''}">${tt('🔁 Tekrar')}${hz ? `<em>${hz}</em>` : ''}</button><button id="k-defter">${tt('📕 Defterim')}</button></div>
  </div>`, 'genis', 'harita');
  $('#k-geri').onclick = () => acilisAc();
  $('#k-sev').onchange = e => { aktifLvlK = e.target.value; kayit.sonLvl = aktifLvlK; kaydet(); Ses.cal('tik', { ses: 0.4 }); listeCiz(); devamGuncelle(); };
  $('#k-st').onclick = () => { sesAc(); stBaslat(); };
  $('#k-tekrar').onclick = antrenmanBaslat;
  $('#k-defter').onclick = () => defterAc();
  $('#k-devam').onclick = () => {
    sesAc(); Ses.cal('tik', { ses: 0.5 });
    const yy = yarimOku(), yol = yy ? (yy.mod === 'kelime' ? 'kelime' : 'cumle') : aktifYol;
    if (!ingSecildi(yol)) { ingSor(yol, () => $('#k-devam') && $('#k-devam').onclick()); return; }   // göster / gizle henüz seçilmediyse önce sor
    if (yarimOku()) { if (!yarimSurdur()) { not(tt('Yarım bölüm açılamadı; bölümü baştan başlatabilirsin.')); haritaAc(); } return; }
    const s = siradakiBolum(aktifYol, aktifLvlK); if (!s) return;
    if (aktifYol === 'kelime') paketBaslat(s); else cumleDojo(s);
  };
  listeCiz(); devamGuncelle();
}
function devamGuncelle() {
  const b = $('#k-devam'); if (!b) return;
  const y = yarimOku();
  if (y) { b.innerHTML = tt('▶ KALDIĞIN YERDEN') + '<small>' + yarimYazi(y) + '</small>'; return; }
  const s = siradakiBolum(aktifYol, aktifLvlK);
  b.innerHTML = s ? tt('▶ DEVAM ET') + '<small>' + esc(aktifYol === 'kelime' ? s.ad : s.world) + ' · ' + esc(s.lvl) + ' · ' + tt(aktifYol === 'kelime' ? 'kelime paketi' : 'cümle bölümü') + '</small>' : tt('▶ DEVAM ET');
}
function listeCiz() {
  const l = aktifLvlK, s = SEVIYE[l], dl = seviyeRakipleri(l), pl = seviyePaketleri(l);
  $('#seviye-bilgi').textContent = s && s.bilgi ? s.bilgi : '';
  $('#yol-sec').innerHTML = `<button data-y="cumle" class="${aktifYol === 'cumle' ? 'secili' : ''}"><b>${tt('CÜMLELER')}</b><span>${tt('{n} bölüm', { n: dl.length })}</span></button>` +
    `<button data-y="kelime" class="${aktifYol === 'kelime' ? 'secili' : ''}"><b>${tt('KELİMELER')}</b><span>${tt('{n} paket', { n: pl.length })}</span></button>`;
  $('#yol-sec').querySelectorAll('button').forEach(b => b.onclick = () => {
    aktifYol = b.dataset.y; kayit.sonSekme = aktifYol; kaydet(); Ses.cal('tik', { ses: 0.4 }); listeCiz(); devamGuncelle();
    if (!ingSecildi(aktifYol)) ingSor(aktifYol);         // sekmeye dokununca bir kez sorulur; sonra alttaki düğmeyle değişir
  });
  ingCipCiz();
  if (aktifYol === 'kelime') paketYolCiz(l); else cumleYolCiz(l);            // ünite haritası (harita.js)
  const sr = $('#liste .dugum.sira'); if (sr) setTimeout(() => sr.scrollIntoView({ block: 'center' }), 30);
}
/* ---------------- İngilizceyi göster / gizle (Cümleler ve Kelimeler sekmesi için ayrı; profil başına) ----------------
   Sekmeye ilk dokunuşta (ya da o sekmeden ilk bölüm başlarken) iki seçenek sorulur; seçim değiştirilene kadar bütün
   bölümlerde geçerli. Göster: cümle turunda İngilizce cümle Türkçenin altında, kelime turlarında harfler soluk görünür;
   puan ve XP yarı (game.js puanKat, ilerleme.js xpEkle). Seviye testi, tekrar ve online maç her zaman gizli oynanır. */
function ingAnahtar(yol) { return yol === 'kelime' ? 'ingKelime' : 'ingCumle'; }
function ingSecildi(yol) { return !!kayit.ayar[ingAnahtar(yol) + 'Secildi']; }
function ingCipCiz() {
  const e = $('#ing-sec'); if (!e) return;
  const k = aktifYol === 'kelime', g = !!kayit.ayar[ingAnahtar(aktifYol)], sec = ingSecildi(aktifYol);
  const yazi = !sec ? (k ? 'İngilizce kelime: göster mi, gizle mi?' : 'İngilizce cümle: göster mi, gizle mi?')
    : k ? (g ? 'İngilizce kelime gösteriliyor' : 'İngilizce kelime gizli') : (g ? 'İngilizce cümle gösteriliyor' : 'İngilizce cümle gizli');
  e.innerHTML = `<button id="ing-deg" class="${sec && g ? 'acik' : ''}"><i>${!sec ? '❔' : g ? '👁' : '🙈'}</i><span>${tt(yazi)}</span><em>${tt(sec ? 'değiştir' : 'seç')}</em></button>`;
  $('#ing-deg').onclick = () => { sesAc(); Ses.cal('tik', { ses: 0.4 }); ingSor(aktifYol); };
}
function ingSor(yol, sonra) {
  const eski = document.getElementById('ing-pen'); if (eski) eski.remove();
  const k = yol === 'kelime', a = ingAnahtar(yol), sec = ingSecildi(yol), g = !!kayit.ayar[a];
  const pen = document.createElement('div'); pen.id = 'ing-pen';
  const dg = (v, ic, b, s) => `<button data-g="${v}" class="${sec && g === !!v ? 'secili' : ''}"><i>${ic}</i><b>${tt(b)}${v ? ` <span class="oner">${tt('önerilen')}</span>` : ''}</b><small>${tt(s)}</small></button>`;   // göster önerilen
  pen.innerHTML = `<div class="ing-kutu" role="dialog" aria-modal="true"><h3>${tt(k ? 'KELİMELER' : 'CÜMLELER')}</h3><p>${tt('Nasıl oynamak istersin?')}</p>` +
    dg(1, '👁', k ? 'İngilizce kelimeyi göster' : 'İngilizce cümleyi göster', k ? 'Kelimeyi görerek harfleri ara · puan ve XP yarı' : 'Cümleyi görerek kelimeleri ara · puan ve XP yarı') +
    dg(0, '🙈', k ? 'İngilizce kelimeyi gizle' : 'İngilizce cümleyi gizle', k ? 'Hatırlayarak diz · tam puan' : 'Yalnız Türkçeyi görerek diz · tam puan') +
    `<small class="ing-not">${tt('Seçimin bütün bölümlerde geçerli; haritadaki düğmeden değiştirebilirsin.')}</small></div>`;
  document.body.appendChild(pen);
  yonergeSoyle(k ? 'Nasıl oynamak istersin? İngilizce kelimeyi görerek oynamak için göster düğmesine dokun. Görmeden oynamak için gizle düğmesine dokun.' : 'Nasıl oynamak istersin? İngilizce cümleyi görerek oynamak için göster düğmesine dokun. Görmeden oynamak için gizle düğmesine dokun.');
  pen.querySelectorAll('[data-g]').forEach(b => b.onclick = () => {
    sesAc(); Ses.cal('tik', { ses: 0.5 });
    Konus.sus(); kayit.ayar[a] = b.dataset.g === '1'; kayit.ayar[a + 'Secildi'] = true; kaydet();
    pen.remove(); ingCipCiz(); if (sonra) sonra();
  });
}
function cumleDojo(r) {
  if (!ingSecildi('cumle')) { ingSor('cumle', () => cumleDojo(r)); return; }
  kayit.sonLvl = r.lvl; kayit.sonSekme = 'cumle'; kaydet();
  const basla = () => { if (!kayit.tutGor) { showTutorial(() => dojoBaslat(r)); return; } dojoBaslat(r); };
  if (kayit.rehber && dersVarMi(r) && !kayit.ders[r.id]) { dersAc(r, basla, () => haritaAc(r.lvl)); return; }
  basla();
}
function paketBaslat(p) {
  if (!ingSecildi('kelime')) { ingSor('kelime', () => paketBaslat(p)); return; }
  kayit.sonLvl = p.lvl; kayit.sonSekme = 'kelime'; kaydet();
  const basla = () => dojoBaslat(p, { kelime: p });
  if (!kayit.tutGor) showTutorial(basla); else basla();
}
/* ---------------- ders ---------------- */
let dersSonra = null;
function dersAc(r, devam, geri) {
  let ic = `<div class="pen-ust"><h2>${tt('Ders')}</h2><span class="lvl">${esc(r.lvl)}</span></div><p class="ders-dunya">${esc(r.world)}</p><div class="ders-kural">${dersMetni(r.rule || '')}</div>`;
  (r.ders || []).forEach(k => { const t = (C.dersler || {})[k]; if (!t) return; ic += `<div class="ders-kart"><b>${dersMetni(t.title)}</b><span>${dersMetni(t.short)}</span><p>${dersMetni(t.rule)}</p></div>`; });
  (r.kurallar || []).forEach(k => { ic += `<div class="ders-not">${dersMetni(k)}</div>`; });
  const ornek = cumleler(r.id).slice(0, 30).filter(s => s.w.length >= 3).sort((a, b) => (siraVeri(b.en) ? 1 : 0) - (siraVeri(a.en) ? 1 : 0) || a.w.length - b.w.length).slice(0, 2);
  if (ornek.length) {
    ic += '<div class="bolum">' + tt('Örnekler') + '</div><div class="liste">';
    ornek.forEach((s, i) => { ic += `<div>${dinleBtn(s.en)}${esc(s.en)}<small>${esc(s.tr)}</small>${i === 0 ? siraHtml(s.en) : ''}</div>`; });
    ic += '</div>';
  }
  ic += `<div class="pen-dip"><button class="big" id="d-git">${tt(G.state === 'paused' ? 'DEVAM' : 'BÖLÜME BAŞLA')}</button>${G.state === 'paused' ? '' : '<div class="row"><button class="sec" id="d-geri">' + tt('Geri') + '</button></div>'}</div>`;
  dersSonra = geri || null;
  goster(ic, 'genis yazi', 'ders');
  kayit.ders[r.id] = 1; kaydet();
  $('#d-git').onclick = () => { dersSonra = null; devam(); };
  const g = $('#d-geri'); if (g) g.onclick = () => { const f = dersSonra; dersSonra = null; if (f) f(); else haritaAc(r.lvl); };
}

/* ---------------- sonuç ---------------- */
function sonucGoster() {
  if (!D) return;
  const d = D; let ic = '';
  const bas = tt(d.antrenman ? 'TAMAM' : d.kazandi ? (d.gunluk ? 'GÖREV TAMAM' : 'BÖLÜM TAMAM') : 'OYUN BİTTİ');
  const alt = d.gunluk ? tt('Günün Görevi · ') + d.r.lvl : d.antrenman ? tt('Antrenman · {a} / {b} hatırladın', { a: d.antrenman.hatirlanan, b: d.antrenman.kuyruk.length })
    : d.kelime ? tt('Kelime Paketi · ') + esc(d.r.ad) + ' · ' + d.r.lvl : esc(d.r.world) + ' · ' + d.r.lvl + (d.r.rule ? ' · ' + esc(d.r.rule) : '');
  ic += `<div class="go ${d.kazandi ? 'zafer' : ''}" style="font-size:clamp(32px,9vw,52px)">${bas}</div><div class="sonuc-alt">${alt}</div>`;
  if (d.goster) ic += '<div class="sonuc-alt kucuk">' + tt(d.kelime ? '👁 İngilizce kelime gösterilerek oynandı · puan ve XP yarı' : '👁 İngilizce cümle gösterilerek oynandı · puan ve XP yarı') + '</div>';
  if (!d.kazandi) ic += '<div class="sonuc-alt kirmizi">' + tt('Hata göstergesi doldu, oyun bitti. Bir dahakine yanlış karo koyma; süre bitmeden doğru karoyu bul.') + '</div>';
  if (d.kazandi && !d.antrenman) ic += `<div class="buyuk-yildiz">${yildizHtml(d.yildiz)}</div><div class="sonuc-alt kucuk">${tt('★ kazandın · ★★ en çok 3 hata · ★★★ en çok 1 hata')}</div>`;
  ic += uniteTamamHtml(d.uniteTamam);                 // ünite ilk kez tamamlandı (harita.js)
  ic += gorevSonucHtml(d.gorevSonuc);                 // Günün Görevi (gorev.js)
  ic += rozetSonucHtml(d.yeniRozet);                  // yeni açılan rozetler (rozet.js)
  if (d.kelime) {
    const pi = paketIlerleme(paketBul(d.r.id));
    ic += `<div class="sonuc-bar"><div><span>${tt('Paket: {a} tanıştın · {b} öğrendin', { a: pi.tanisilan, b: pi.ogrenilen })}</span><span>${pi.ogrenilen} / ${pi.toplam}</span></div><div class="pbar"><i style="width:${Math.round(pi.ogrenilen / Math.max(1, pi.toplam) * 100)}%"></i></div></div>`;
    if (d.yeniPaket) ic += `<div class="sonuc-alt yesil">${tt('Yeni paket açıldı: ')}${esc(d.yeniPaket.ad)}</div>`;
  }
  if (d.yeniDojo && d.kazandi) ic += `<div class="sonuc-alt sari">${d.yeniDojo.lvl !== d.r.lvl ? tt('{l} seviyesi açıldı!', { l: d.yeniDojo.lvl }) : tt('Yeni bölüm açıldı: ') + esc(d.yeniDojo.world)}</div>`;
  const top = d.istat.dogru + d.istat.yanlis;
  ic += sonucXpHtml(d.ilerleme);
  ic += `<div class="stats">
    <div><span>${tt('SKOR')}${d.rekor ? tt(' · YENİ REKOR!') : ''}</span><b>${G.score}</b></div>
    <div><span>${tt('DOĞRU HAMLE')}</span><b>${top ? Math.round(d.istat.dogru / top * 100) : 0}%</b></div>
    ${d.kelime ? `<div><span>${tt('YENİ KELİME')}</span><b>${d.kelime.ogrenilen.length}</b></div>` : d.antrenman ? `<div><span>${tt('HATIRLADIN')}</span><b>${d.antrenman.hatirlanan} / ${d.antrenman.kuyruk.length}</b></div>` : `<div><span>${tt('KUSURSUZ CÜMLE')}</span><b>${d.istat.kusursuz} / ${d.istat.cumle}</b></div>`}
    <div><span>${tt(d.kelime ? 'KELİME SORUSU' : 'BULUNAN HATA')}</span><b>${d.kelime ? d.istat.testOk + ' / ' + d.istat.test : d.istat.savOk + ' / ' + d.istat.sav}</b></div>
    <div><span>${tt('EN UZUN KOMBO')}</span><b>x${d.enKombo || 0}</b></div>
    <div><span>${tt('REKOR')}</span><b>${kayit.best || 0}</b></div></div>`;
  if (d.hatalar.length) {
    ic += `<div class="bolum">${tt(d.kelime ? 'Hataların · bu kelimeler yakında tekrar gelecek' : 'Hataların · Hata Defteri’ne eklendi')}</div><div class="liste">`;
    d.hatalar.slice(0, 10).forEach(h => {
      if (h.tip === 'kelime') ic += `<div>${dinleBtn(h.w.en)}<s>${esc(copeOnekCevir(h.yanlis))}</s> → <ins>${esc(h.w.en)}</ins><small>${esc(h.w.en + ' = ' + h.w.tr)}${h.w.pos ? ' · ' + esc(h.w.pos) : ''}</small></div>`;
      else ic += `<div>${dinleBtn(h.en)}<s>${esc(copeOnekCevir(h.yanlis))}</s> → <ins>${esc(h.dogru || tt('(sil)'))}</ins><small>${esc(h.en)}</small><small class="tr">${esc(h.tr || '')}</small>${h.kural ? `<small class="kr">${esc(h.kural)}</small>` : ''}${h.tip === 'cumle' ? tmDugme(h.en) : ''}</div>`;
    });
    ic += '</div>';
  }
  if (d.kelime && d.kelime.ogrenilen.length) {
    ic += '<div class="bolum">' + tt('Tanıştığın kelimeler') + '</div><div class="liste">';
    d.kelime.ogrenilen.forEach(w => { const o = kelimeOrnek(w); ic += `<div>${dinleBtn(w.en)}<b class="kd-en">${esc(w.en)}</b> = ${esc(w.tr)}${w.pos ? ` <span class="kd-pos">${esc(w.pos)}</span>` : ''}${o ? `<small>${esc(o.en)}</small>` : ''}</div>`; });
    ic += '</div>';
  }
  let sonraki = null;
  if (d.kazandi && !d.antrenman) sonraki = d.kelime ? (d.yeniPaket || null) : (d.r.id && rakipBul(d.r.id) ? sonrakiRakip(d.r) : null);
  if (sonraki && (d.kelime ? !paketAcikMi(sonraki) : !rakipAcikMi(sonraki))) sonraki = null;
  ic += `<div class="pen-dip">${sonraki ? `<button class="big" id="s-sonra">${tt('SONRAKİ: ')}${esc(d.kelime ? sonraki.ad : sonraki.world)}</button>` : ''}
    <div class="row">${d.antrenman ? '' : `<button class="sec" id="s-tekrar">${tt(d.kazandi ? 'TEKRAR OYNA' : 'TEKRAR DENE')}</button>`}<button class="sec" id="s-harita">${tt(d.gunluk ? 'ANA MENÜ' : 'KARİYER')}</button></div></div>`;
  goster(ic, 'genis', 'sonuc');
  halkalariDoldur(card);
  if (d.ilerleme && d.ilerleme.hedefOldu) sonra(0.9, () => Ses.cal('yukselis', { ses: 0.6 }));
  if (d.uniteTamam) sonra(d.ilerleme && d.ilerleme.hedefOldu ? 1.7 : 0.9, () => Ses.cal('yukselis', { ses: 0.7 }));
  if (d.yeniRozet && d.yeniRozet.length) sonra(1.3, () => Ses.cal('yukselis', { ses: 0.6 }));
  const r = d.r, kel = d.kelime;
  if (sonraki) $('#s-sonra').onclick = () => kel ? dojoBaslat(sonraki, { kelime: sonraki }) : cumleDojo(sonraki);
  const t = $('#s-tekrar'); if (t) t.onclick = () => d.gunluk ? gorevBaslat() : kel ? dojoBaslat(r, { kelime: r }) : dojoBaslat(r);
  $('#s-harita').onclick = () => d.gunluk ? acilisAc() : haritaAc(r.lvl && SEVIYE[r.lvl] ? r.lvl : null);
}

/* ---------------- defterim (hatalar + kelimeler) ve tekrar ---------------- */
let defterSekme = 'hata', kdFiltre = 'hepsi';
function defterAc(sekme) {
  if (sekme) defterSekme = sekme;
  const hTum = kayit.tekrar.slice().sort((a, b) => (a.kutu === 6) - (b.kutu === 6) || a.vade - b.vade);
  const sz = sozluk(), kTum = []; for (const k in kayit.kel) if (sz[k]) kTum.push(sz[k]);
  const hz = srsHazir().length + kelHazir().length;
  let ic = `<div class="ust-satir"><button class="geri" id="df-geri">${tt('← Geri')}</button></div><div class="pen-ust"><h2>${tt('Defterim')}</h2></div>
    <div class="sekmeler" id="df-sek"><button data-s="hata" class="${defterSekme === 'hata' ? 'secili' : ''}">${tt('📕 Hatalar ({n})', { n: hTum.length })}</button><button data-s="kelime" class="${defterSekme === 'kelime' ? 'secili' : ''}">${tt('📗 Kelimeler ({n})', { n: kTum.length })}</button></div>`;
  ic += defterSekme === 'kelime' ? kelimeDefteriHtml(kTum) : hataDefteriHtml(hTum);
  ic += `<div class="pen-dip">${hz || hTum.length || kTum.length ? `<button class="big" id="df-antr">${tt('🔁 TEKRAR ET')}${hz ? tt(' · {n} hazır', { n: hz }) : ''}</button>` : ''}</div>`;
  goster(ic, 'genis', 'defter');
  $('#df-geri').onclick = () => haritaAc();
  card.querySelectorAll('#df-sek button').forEach(b => b.onclick = () => { Ses.cal('tik', { ses: 0.4 }); defterAc(b.dataset.s); });
  card.querySelectorAll('#kd-f button').forEach(b => b.onclick = () => { kdFiltre = b.dataset.f; defterAc('kelime'); });
