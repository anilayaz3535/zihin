// Tahta karolarının renkleri (videodaki şeker karolar): aynı renkten 3+ karo yan yana / alt alta gelince toplu patlar (game.js renkGruplari)
const KARO_RENK = ['#f2453d', '#ffbc1f', '#3cbb4a', '#2b91ea', '#b04fd8'];

/* ---------------- yerleşim (kafe teması: Gemini videosundaki düzen) ----------------
   Dikey: üstte ⭐ skor + düzey (sol), sistem düğmeleri (orta), "Hedef Cümleler" halkası (sağ);
   ortada krem Türkçe şerit, süre çubuğu ve gri karo tahtası; solda ince hata göstergesi;
   altta mürdüm panel (#pow): CÜMLE BOMBASI rozeti, 4 güç kutusu (Joker / Yavaş), sarı bölüm ilerleme çubuğu.
   Yatay: solda skor ve düzey, ortada tahta, sağda sistem düğmeleri, halka ve alt panelin öğeleri.
   Arka plandaki kafe resmi CSS'te (extra.css, --kafe); tuval o kısımları boş bırakır.
   Tahtanın sütun/satır sayısı her turda hedefe göre engine.js tahtaYerlesim'de hesaplanır. */
// telefonun güvenli alanı (çentik, kamera adası, ana ekran çubuğu): CSS env(safe-area-inset-*) okunur.
// Tarayıcıda ve çentiksiz ekranda hepsi 0'dır; uygulamada (viewport-fit=cover) HUD ve alt panel bu boşlukları bırakır.
let guvenliProbe = null;
function guvenliAlan() {
  try {
    if (!guvenliProbe) {
      guvenliProbe = document.createElement('div');
      guvenliProbe.style.cssText = 'position:fixed;left:0;top:0;width:0;height:0;visibility:hidden;pointer-events:none;' +
        'padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)';
      document.body.appendChild(guvenliProbe);
    }
    const c = getComputedStyle(guvenliProbe), n = v => Math.max(0, Math.round(parseFloat(v) || 0));
    return { t: n(c.paddingTop), r: n(c.paddingRight), b: n(c.paddingBottom), l: n(c.paddingLeft) };
  } catch (e) { return { t: 0, r: 0, b: 0, l: 0 }; }
}
function layout() {
  W = window.innerWidth; H = window.innerHeight;
  const E = guvenliAlan();
  DPR = Math.min(2, window.devicePixelRatio || 1);
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  cv.style.width = W + 'px'; cv.style.height = H + 'px';
  bgC.width = cv.width; bgC.height = cv.height;
  const land = W / H >= 1.1;
  document.body.classList.toggle('land', land);
  document.body.classList.toggle('port', !land);
  const o = { land, fm: 6 };
  const rs = document.documentElement.style;
  const pw2 = document.getElementById('pow');
  o.guvenli = E;
  rs.setProperty('--gb', E.b + 'px');
  if (land) {
    const pad = 10, pL = pad + E.l, pR = pad + E.r, pT = pad + E.t, pB = pad + E.b;
    const pw = Math.round(clamp(Math.min((W - E.l - E.r) * .19, (H - E.t - E.b) * .46), 116, 200));
    const ix = pL + pw + 24, ixR = pR + pw + 24, top = pT + 2;
    o.in = { x: ix, y: top, w: W - ix - ixR, h: H - top - pB };
    const I = o.in;
    o.gauge = { x: ix - 17, y: I.y + I.h * .2, w: 10, h: I.h * .8 - 4 };
    o.skor = { x: pL, y: top, w: pw, h: Math.round(clamp(pw * .36, 44, 62)) };
    o.sev = { x: pL, y: o.skor.y + o.skor.h + 8, w: pw, h: 22 };
    const sysH = 36 + 10, rd = Math.round(clamp(Math.min(pw * .5, H * .2), 58, 84));
    o.hedefP = { x: W - pR - pw + (pw - rd) / 2, y: pT + sysH + 4, w: rd, h: rd };
    const py = o.hedefP.y + rd + 10, ph = H - pB - py;
    Object.assign(pw2.style, { left: (W - pR - pw) + 'px', top: py + 'px', width: pw + 'px', height: ph + 'px', bottom: '', right: '' });
    rs.setProperty('--sh', Math.round(clamp((ph - 20 - 56 - 30 - 24) / 2, 24, 46)) + 'px');
  } else {
    const pad = 8, pT = pad + E.t, pL = pad + E.l, pR = pad + E.r;
    const hudH = Math.round(clamp(H * .072, 50, 64)), botH = Math.round(clamp(H * .13, 96, 116));
    const inY = pT + hudH + 16, inX = pL + 18, inB = H - botH - E.b - 6;   // +16: Türkçe şeridin üstündeki konu sekmesi düzey etiketine değmesin
    o.in = { x: inX, y: inY, w: W - inX - pR, h: inB - inY };
    o.gauge = { x: pL + 1, y: inY + o.in.h * .2, w: 9, h: o.in.h * .8 - 4 };
    const rd = hudH + 6;
    o.skor = { x: pL, y: pT, w: Math.round(clamp(W * .34, 118, 170)), h: Math.round(hudH * .62) };
    o.sev = { x: pL + 6, y: o.skor.y + o.skor.h + 4, w: o.skor.w - 6, h: Math.round(hudH * .3) };
    o.hedefP = { x: W - pR - rd, y: pT - 3, w: rd, h: rd };
    Object.assign(pw2.style, { left: '', top: '', width: '', height: '', bottom: '', right: '' });
    rs.setProperty('--bh', (botH + E.b) + 'px');
    rs.setProperty('--sh', Math.round(clamp(botH - 62, 32, 46)) + 'px');
    rs.setProperty('--rz', Math.round(clamp(botH - 48, 44, 60)) + 'px');   // bomba rozeti: üstündeki iki satırlık yazıyla panele sığsın
    rs.setProperty('--sx', Math.round((o.skor.x + o.skor.w + o.hedefP.x) / 2) + 'px');
    rs.setProperty('--sy', Math.round(pT + (hudH - 36) / 2) + 'px');
  }
  const I = o.in;
  // yazı ölçüleri (açılır yazılar, Türkçe şeridi, uyarılar bunlara göre büyür / küçülür)
  o.stripH = Math.round(clamp(I.h * .07, 26, 44));
  o.bh = Math.round(o.stripH * .86);
  L = o;
  SPR.clear();
  yerlesimYenile();           // açık tahtanın hücre ölçüleri yeni ekrana göre (engine.js)
  renderBG();
}

/* ---------------- drawing helpers ---------------- */
function rr(x, X, Y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  x.beginPath(); x.moveTo(X + r, Y); x.lineTo(X + w - r, Y); x.quadraticCurveTo(X + w, Y, X + w, Y + r);
  x.lineTo(X + w, Y + h - r); x.quadraticCurveTo(X + w, Y + h, X + w - r, Y + h); x.lineTo(X + r, Y + h);
  x.quadraticCurveTo(X, Y + h, X, Y + h - r); x.lineTo(X, Y + r); x.quadraticCurveTo(X, Y, X + r, Y); x.closePath();
}
// yazıyı koyu kenarlı (videodaki gibi) yazar: önce kalın kenar, sonra dolgu
function kenarliYaz(x, s, X, Y, dolgu, kenar, kal) {
  x.save(); x.lineJoin = 'round'; x.miterLimit = 2; x.lineWidth = kal; x.strokeStyle = kenar; x.strokeText(s, X, Y);
  x.fillStyle = dolgu; x.fillText(s, X, Y); x.restore();
}
// krem şerit / balon: videodaki Türkçe şerit gibi açık krem, kahverengi kenar, hafif gölge
function kremKutu(x, X, Y, w, h, r, kenar) {
  x.save(); x.shadowColor = 'rgba(40,16,8,.35)'; x.shadowBlur = 10; x.shadowOffsetY = 3;
  rr(x, X, Y, w, h, r); const g = x.createLinearGradient(0, Y, 0, Y + h); g.addColorStop(0, '#fffaf0'); g.addColorStop(1, '#f3dfc2');
  x.fillStyle = g; x.fill(); x.restore();
  rr(x, X, Y, w, h, r); x.lineWidth = 2; x.strokeStyle = kenar || '#c99a6b'; x.stroke();
  rr(x, X + 3, Y + 3, w - 6, h - 6, Math.max(2, r - 3)); x.lineWidth = 1; x.strokeStyle = 'rgba(160,110,70,.35)'; x.stroke();
}
// koyu, yarı saydam hap (skor, sayaç): videodaki üst köşe kutuları
function hapKutu(x, X, Y, w, h) {
  rr(x, X, Y, w, h, h / 2); x.fillStyle = 'rgba(52,44,64,.78)'; x.fill();
  x.lineWidth = 1.5; x.strokeStyle = 'rgba(255,240,220,.35)'; x.stroke();
}

/* ---------------- karo resmi ----------------
   Şekerleme görünümlü yuvarlak köşeli karo: renk, parlak üst, gölgeli alt, beyaz yazı.
   Yazı karoya yatay sığmıyorsa (çok sütunlu tahtada uzun kelime) dikey yazılır; tek harf her zaman büyük ve yatay.
   Sınırlı önbellek: en uzun süredir kullanılmayan resimler silinir (telefon tarayıcısının tuval belleği dolmasın). */
const SPR = new Map(), SPR_MAX = 260;
function karoYaziOlc(text, w, h) {
  const m = bgx; m.save(); m.font = `700 100px ${FONT}`; const w100 = Math.max(1, m.measureText(text).width) / 100; m.restore();
  const tek = [...text].length === 1;
  const iw = w - Math.max(5, w * .14), ih = h - Math.max(5, h * .14);
  const fsH = Math.min(h * (tek ? .62 : .44), iw / w100), fsV = Math.min(w * .56, ih / w100);
  const dikey = !tek && fsH < 11 && fsV > fsH * 1.15;
  return { dikey, fs: Math.max(6, Math.floor(dikey ? fsV : fsH)) };
}
// stil: 'n' renkli karo · 'kilit' hatalı cümlenin sabit karosu · 'dogru' düzeltilmiş sabit karo
function karoSprite(text, ci, w, h, stil) {
  w = Math.max(8, Math.round(w)); h = Math.max(8, Math.round(h)); stil = stil || 'n';
  const key = text + '|' + ci + '|' + w + '|' + h + '|' + stil;
  let s = SPR.get(key); if (s) { SPR.delete(key); SPR.set(key, s); return s; }
  if (SPR.size >= SPR_MAX) { let n = 60; for (const [k, v] of SPR) { SPR.delete(k); v.c.width = v.c.height = 0; if (--n <= 0) break; } }
  const g = Math.ceil(Math.min(w, h) * .22) + 2, depth = Math.max(2, Math.round(h * .08));
  const c = document.createElement('canvas');
  c.width = Math.ceil((w + 2 * g) * DPR); c.height = Math.ceil((h + depth + 2 * g) * DPR);
  const x = c.getContext('2d'); x.scale(DPR, DPR);
  const r = Math.min(w, h) * .26;
  const kilit = stil === 'kilit', dogru = stil === 'dogru';
  const col = kilit ? '#8a7488' : dogru ? '#2fae57' : KARO_RENK[ci % KARO_RENK.length];
  // gölge ve alt kalınlık (şeker karo)
  x.save(); x.shadowColor = 'rgba(30,12,20,.35)'; x.shadowBlur = Math.max(2, h * .08); x.shadowOffsetY = depth * .6;
  rr(x, g, g + depth, w, h, r); x.fillStyle = renkKat(col, .55); x.fill(); x.restore();
  // yüz: üstte açık, altta koyu
  rr(x, g, g, w, h, r);
  const gr = x.createLinearGradient(0, g, 0, g + h);
  gr.addColorStop(0, renkKat(col, 1.32)); gr.addColorStop(.48, renkKat(col, 1.06)); gr.addColorStop(1, renkKat(col, .86));
  x.fillStyle = gr; x.fill();
  x.save(); x.lineWidth = Math.max(1, Math.min(w, h) * .035); x.strokeStyle = kilit ? '#ff8a96' : renkKat(col, .7); x.stroke(); x.restore();
  // parlak üst (jöle parıltısı) ve sol üstte küçük ışık noktası
  x.save(); rr(x, g + w * .08, g + h * .06, w * .84, h * .42, r * .8);
  const pg = x.createLinearGradient(0, g + h * .06, 0, g + h * .48); pg.addColorStop(0, 'rgba(255,255,255,' + (kilit ? .18 : .55) + ')'); pg.addColorStop(1, 'rgba(255,255,255,0)');
  x.fillStyle = pg; x.fill(); x.restore();
  x.save(); x.globalAlpha = kilit ? .35 : .85; x.fillStyle = '#ffffff';
  x.beginPath(); x.ellipse(g + Math.max(r * .7, w * .14), g + Math.max(r * .55, h * .17), Math.max(1.5, Math.min(w, h) * .055), Math.max(1.2, Math.min(w, h) * .04), -.5, 0, 7); x.fill(); x.restore();
  // yazı: beyaz, karonun koyu tonunda kalın kenar
  const o = karoYaziOlc(text, w, h);
  x.save(); x.translate(g + w / 2, g + h / 2 + 1);
  if (o.dikey) x.rotate(-Math.PI / 2);
  x.font = `700 ${o.fs}px ${FONT}`; x.textAlign = 'center'; x.textBaseline = 'middle';
  x.lineJoin = 'round'; x.lineWidth = Math.max(2, o.fs * .22); x.strokeStyle = kilit ? 'rgba(60,20,40,.75)' : renkKat(col, .48); x.strokeText(text, 0, o.fs * .04);
  x.fillStyle = '#ffffff'; x.fillText(text, 0, o.fs * .04);
  x.restore();
  s = { c, w, h, g, cw: c.width / DPR, chh: c.height / DPR };
  SPR.set(key, s); return s;
}
// karo resmini merkezi (cx, cy) olacak şekilde çizer
function karoCiz(s, cx, cy, alpha = 1, sx = 1, sy = 1) {
  if (alpha <= 0) return;
  ctx.save(); ctx.globalAlpha = alpha; ctx.translate(cx, cy); ctx.scale(sx, sy);
  ctx.drawImage(s.c, -s.w / 2 - s.g, -s.h / 2 - s.g, s.cw, s.chh);
  ctx.restore();
}

/* ---------------- sabit arka plan ----------------
   Kafe resmi sayfanın arka planında (CSS --kafe). Tuvalin bu katmanında yalnız üstte hafif bir gölge (skor ve halka
   açık pencerelerin önünde okunsun) ve soldaki hata göstergesinin kabı çizilir. */
function renderBG() {
  const g = bgx; g.setTransform(DPR, 0, 0, DPR, 0, 0); g.clearRect(0, 0, W, H);
  if (!L.in) return;
  const land = L.land;
  let gr = g.createLinearGradient(0, 0, 0, Math.min(H * .22, 150));
  gr.addColorStop(0, 'rgba(40,20,28,.28)'); gr.addColorStop(1, 'rgba(40,20,28,0)');
  g.fillStyle = gr; g.fillRect(0, 0, W, Math.min(H * .22, 150));
  // hata göstergesi: krem kenarlı kapsül, içinde 10 dilim
  const Gg = L.gauge;
  g.save(); g.shadowColor = 'rgba(30,10,16,.4)'; g.shadowBlur = 6;
  rr(g, Gg.x - 3, Gg.y - 3, Gg.w + 6, Gg.h + 6, (Gg.w + 6) / 2); g.fillStyle = 'rgba(52,36,58,.85)'; g.fill(); g.restore();
  rr(g, Gg.x - 3, Gg.y - 3, Gg.w + 6, Gg.h + 6, (Gg.w + 6) / 2); g.lineWidth = 1.5; g.strokeStyle = 'rgba(255,236,212,.7)'; g.stroke();
  for (let i = 1; i < HATA_MAX; i++) { g.fillStyle = 'rgba(255,255,255,.22)'; g.fillRect(Gg.x + 1, Gg.y + Gg.h * i / HATA_MAX, Gg.w - 2, 1); }
  g.save(); g.textAlign = 'center'; g.textBaseline = 'middle';
  if (land) { g.font = `700 11px ${FONT}`; g.translate(Gg.x - 9, Gg.y + Gg.h * .8); g.rotate(-Math.PI / 2); kenarliYaz(g, tt('HATA'), 0, 0, '#ffd9d9', 'rgba(70,20,30,.85)', 3); }
  else { g.font = `13px sans-serif`; g.fillText('⚠️', Gg.x + Gg.w / 2, Gg.y - 13); }
  g.restore();
}

/* ---------------- particles ---------------- */
function addP(o) { if (P.length < 1600) P.push(o); return o; }
function sparkBurst(x, y, col, n, sp = 260, life = .7, type = 'streak', gr = 260) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, v = sp * (.35 + Math.random() * .75);
    addP({ type, x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: life * (.6 + Math.random() * .6), max: life, col, s: rnd(1.2, 2.6), gr, drag: .93 });
  }
}
function ring(x, y, col, r0, r1, life = .45, w = 3) { addP({ type: 'ring', x, y, vx: 0, vy: 0, r0, r1, life, max: life, col, s: w, gr: 0, drag: 1 }); }
function shards(x, y, w, h, col, n) {
  for (let i = 0; i < n; i++) addP({ type: 'shard', x: x + rnd(-w / 2, w / 2), y: y + rnd(-h / 2, h / 2), vx: rnd(-220, 220), vy: rnd(-320, -60), life: rnd(.5, .9), max: .9, col, s: rnd(3, 7), rot: rnd(0, 6), vr: rnd(-12, 12), gr: 900, drag: .99 });
}
function rocket(x, y, tx, ty, col) {
  const g = 520, h = Math.max(40, y - ty);
  addP({ type: 'rocket', x, y, vx: (tx - x) / Math.sqrt(2 * h / g), vy: -Math.sqrt(2 * g * h), life: 3, max: 3, col, s: 2.5, gr: g, drag: 1 });
}
function firework(x, y, col) {
  Ses.cal('patlama', { ses: .28, hiz: 1.5 });
  const cols = [col, col, col, '#ffffff'];
  const n = 54;
  for (let i = 0; i < n; i++) {
    const a = i / n * Math.PI * 2 + rnd(-.05, .05), v = rnd(140, 330);
    addP({ type: 'streak', x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: rnd(.9, 1.5), max: 1.5, col: pick(cols), s: rnd(1.4, 2.4), gr: 150, drag: .975, tw: Math.random() < .4 });
  }
  addP({ type: 'dot', x, y, vx: 0, vy: 0, life: .18, max: .18, col: '#ffffff', s: 26, gr: 0, drag: 1 });
}
function starFan(x, y) {
  for (let i = 0; i < 9; i++) {
    const a = -Math.PI / 2 + (i - 4) * .2 + rnd(-.05, .05), v = rnd(520, 760);
    addP({ type: 'star', x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: rnd(1.1, 1.5), max: 1.5, col: '#ffe066', s: rnd(6, 9), rot: 0, vr: rnd(-6, 6), gr: 380, drag: .985 });
  }
}
function smoke(x, y, n) {
  for (let i = 0; i < n; i++) addP({ type: 'smoke', x: x + rnd(-20, 20), y: y + rnd(-10, 10), vx: rnd(-40, 40), vy: rnd(-30, 5), life: rnd(1.4, 2.2), max: 2.2, col: '#9aa3b8', s: rnd(18, 30), gr: -6, drag: .985 });
}
function popup(text, x, y, col, size, life = 1.1, vy = -46) { POP.push({ text, x, y, col, size, life, max: life, vy }); }
function banner(text, sub, col, dur) { BAN.push({ text, sub, col, t: 0, dur }); }

function updateParticles(dt) {
  const f = dt * 60;
  for (let i = P.length - 1; i >= 0; i--) {
    const p = P[i];
    p.life -= dt;
    if (p.life <= 0) { P[i] = P[P.length - 1]; P.pop(); continue; }
    const dr = Math.pow(p.drag, f);
    p.vx *= dr; p.vy = p.vy * dr + p.gr * dt;
    p.x += p.vx * dt; p.y += p.vy * dt;
    if (p.rot !== undefined) p.rot += (p.vr || 0) * dt;
    if (p.type === 'rocket') {
      if (Math.random() < .9) addP({ type: 'dot', x: p.x + rnd(-1.5, 1.5), y: p.y + 4, vx: rnd(-20, 20), vy: rnd(10, 50), life: rnd(.25, .5), max: .5, col: '#ffd27a', s: rnd(1, 2.2), gr: 60, drag: .96 });
      if (p.vy >= -15) { firework(p.x, p.y, p.col); p.life = 0; }
    } else if (p.type === 'star') {
      addP({ type: 'dot', x: p.x, y: p.y, vx: rnd(-25, 25), vy: rnd(-10, 30), life: rnd(.3, .6), max: .6, col: Math.random() < .5 ? '#ffe066' : '#fff6c8', s: rnd(1, 2.4), gr: 80, drag: .95 });
    }
  }
  for (let i = POP.length - 1; i >= 0; i--) { const p = POP[i]; p.life -= dt; p.y += p.vy * dt; p.vy *= Math.pow(.96, f); if (p.life <= 0) POP.splice(i, 1); }
  for (let i = BAN.length - 1; i >= 0; i--) { BAN[i].t += dt; if (BAN[i].t > BAN[i].dur) BAN.splice(i, 1); }
}
function star(x, cx, cy, r, rot) {
  x.beginPath();
  for (let i = 0; i < 10; i++) { const a = rot + i * Math.PI / 5 - Math.PI / 2, rr2 = i % 2 ? r * .45 : r; x.lineTo(cx + Math.cos(a) * rr2, cy + Math.sin(a) * rr2); }
  x.closePath();
}
function drawParticles() {
  ctx.save();
  for (const p of P) if (p.type === 'smoke') {
    const k = p.life / p.max, r = p.s * (1 + (1 - k) * 2.2);
    ctx.globalAlpha = .28 * k; const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, r);
    g.addColorStop(0, 'rgba(170,178,196,1)'); g.addColorStop(1, 'rgba(120,128,150,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, 7); ctx.fill();
  }
  ctx.globalCompositeOperation = 'lighter';
  for (const p of P) {
    const k = p.life / p.max;
    switch (p.type) {

  am: '-ım (be)', is: '-dır (be)', are: '-dır (be, çoğul)', was: '-dı (be, geçmiş)', were: '-dı (be, geçmiş, çoğul)', be: 'olmak', been: 'olmuş (V3)', being: 'olma',
  the: 'belirli tanımlık', a: 'bir', an: 'bir (sesliden önce)', to: '-e / -mek', of: '-in / -nın', in: 'içinde / -de', on: 'üstünde / -de', at: '-de (nokta)',
  for: 'için / -dır', with: 'ile', from: '-den', by: 'tarafından / ile', and: 've', but: 'ama', or: 'veya', not: 'değil', no: 'hayır / hiç',
  do: 'yardımcı fiil (geniş)', does: 'yardımcı fiil (o)', did: 'yardımcı fiil (geçmiş)', have: 'sahip olmak / -miş', has: 'sahip (o) / -miş', had: '-mişti',
  will: '-ecek', would: '-erdi', can: '-ebilir', could: '-ebilirdi', should: '-meli', must: '-meli (zorunlu)', may: '-ebilir (izin)', might: '-ebilir (olasılık)',
  this: 'bu', that: 'şu / ki', these: 'bunlar', those: 'şunlar', there: 'orada / var', here: 'burada', what: 'ne', where: 'nerede', when: 'ne zaman / -dığında',
  why: 'neden', how: 'nasıl', who: 'kim / -an', which: 'hangi / ki', whose: 'kimin', if: 'eğer', than: '-den (kıyas)', as: 'gibi / kadar', so: 'bu yüzden / o kadar',
  very: 'çok', too: 'de / fazla', also: 'ayrıca', some: 'biraz / bazı', any: 'hiç / herhangi', many: 'çok (sayılan)', much: 'çok (sayılamayan)', more: 'daha',
  most: 'en', every: 'her', all: 'hepsi', about: 'hakkında', into: 'içine', up: 'yukarı', out: 'dışarı', off: 'kapalı / -den uzak', over: 'üstünde / bitti',
  after: 'sonra', before: 'önce', because: 'çünkü', since: '-den beri', until: '-e kadar', while: 'iken', although: '-e rağmen', yet: 'henüz', just: 'az önce / sadece', never: 'asla', always: 'her zaman'
};
function anlamBul(t) {
  const k = String(t || '').toLowerCase();
  const w = sozluk()[k]; if (w) return kisaAnlam(w.tr);
  if (ISLEV[k]) return ISLEV[k];
  const zg = zamirGrubu(k); if (zg) return zg.tr[k];
  return '';
}

/* =====================================================================
   KAYIT KATMANI
   Profiller, ilerleme (kayit) ve yarım bölüm kaydı. Kalıcı hafızaya (Depo)
   yalnız bu dosya yazar; okunan her veri kayit-sema.js ile doğrulanır.
   Oyun motoru ve ekranlar kayda bu işlevlerle ulaşır:
     kaydet, profilleriYukle, profilOlustur, profilSec, profilSil, profilOzet,
     yarimOku, yarimYaz, yarimSil, kayitUyar, kayitUyarilariGoster
   ===================================================================== */
/* ---------------- profiller ve kayıt (yalnız bu telefonda / tarayıcıda) ----------------
   te_profiller_v1   → { aktif: id, liste: [{ id, ad, t }] }
   te_profil_<id>    → o profilin bütün ilerlemesi (kayit)
   te_yarim_<id>     → o profilin yarıda kalan bölümü (game.js · yarimKaydet)
   te_kayit_v1       → profillerden önceki tek kayıt; ilk açılan profile aktarılır, yedek olarak silinmez */
const KAYIT = 'te_kayit_v1', PROFILLER = 'te_profiller_v1', PROFIL_ON = 'te_profil_', YARIM_ON = 'te_yarim_';
function bosKayit() {
  return { v: 1, baslangic: null, acik: { 'A1-1': true }, yildiz: {}, kel: {}, tekrar: [], ders: {}, gorulen: {}, rehber: false, kelRehber: false,
    // ayar.ing*: İngilizceyi göster / gizle seçimi (Cümleler ve Kelimeler sekmesi; *Secildi: oyuncuya soruldu mu)
    ayar: { muzik: true, efekt: true, ses: true, trSes: true, dizilis: true, ingCumle: false, ingKelime: false, ingCumleSecildi: false, ingKelimeSecildi: false, yonergeSes: true, titresim: true, hatirlat: false }, best: 0, tutGor: false, sonLvl: 'A1', sonSekme: 'cumle', seviyeTesti: null,
    istat: { dojo: 0, zafer: 0, online: 0, onlineGalibiyet: 0 }, sonKayit: 0,
    xp: 0, gunluk: { hedef: 50, gunler: {} }, seri: { gun: 0, enUzun: 0, sonGun: null, dondurma: 0, donan: [] },   // ilerleme.js
    gorev: { son: null, seri: 0, enUzun: 0, toplam: 0, gunler: {} },   // Günün Görevi (gorev.js)
    rozet: {} };                                                       // açılan rozetler: { id: zaman } (rozet.js)
}
/* ---------------- kayıt okuma: doğrula (kayit-sema.js), bozuksa yedekle, oyuncuya bir kez söyle ---------------- */
const YEDEK_ON = 'te_yedek:';                     // te_yedek:<anahtar>:<zaman> → bozuk bulunan ham kayıt
const kayitUyarilari = [];                        // açılışta bir kez gösterilir (kayitUyarilariGoster)
function kayitUyar(m) {
  if (window.__acildi && typeof not === 'function') { not(m, 7000); return; }   // oyun açıksa hemen söyle
  if (kayitUyarilari.indexOf(m) < 0) kayitUyarilari.push(m);
}
// bozuk ham veri silinmez, yedeklenir (her anahtar için en çok 3 yedek)
function kayitYedekle(anahtar, ham) {
  try {
    const on = YEDEK_ON + anahtar + ':';
    const eski = Depo.anahtarlar().filter(k => k.indexOf(on) === 0).sort();
    if (eski.length && Depo.al(eski[eski.length - 1]) === String(ham)) return;   // aynısı zaten yedekli
    while (eski.length >= 3) Depo.sil(eski.shift());
    Depo.yaz(on + Date.now(), String(ham));
  } catch (e) { }
}
// kayıt yoksa null; okunamazsa (yedeklenir) null; parça parça bozuksa onarılmış kayıt
function kayitOku(anahtar) {
  const ham = Depo.al(anahtar);
  if (ham === null || ham === undefined || ham === '' || ham === 'null') return null;
  let j; try { j = JSON.parse(ham); } catch (e) { j = undefined; }
  const s = kayitDuzelt(j, bosKayit(), l => !!SEVIYE[l]);
  if (!s.bozuk.length) return s.k;
  kayitYedekle(anahtar, ham);
  if (s.bozuk[0] === 'tumu') { kayitUyar(tt('Kaydın okunamadı. Eski hali yedeklendi; oyun temiz bir kayıtla açıldı.')); return null; }
  kayitUyar(tt('Kaydının bir kısmı bozuktu ve düzeltildi. Eski hali yedeklendi.'));
  return s.k;
}
let profiller = { aktif: null, liste: [] }, kayit = bosKayit();
// açılışta (tarayıcı) ya da kalıcı hafıza hazır olunca (uygulama, boot) çağrılır
function profilleriYukle() {
  kayitUyarilari.length = 0;
  const ham = Depo.al(PROFILLER);
  let p = { aktif: null, liste: [] }, bozuk = [];
  if (ham && ham !== 'null') {
    let j; try { j = JSON.parse(ham); } catch (e) { j = undefined; }
    const s = profillerDuzelt(j); p = s.p; bozuk = s.bozuk;
    if (bozuk.length) kayitYedekle(PROFILLER, ham);
  }
  let degisti = bozuk.length > 0;
  // liste kaybolduysa ya da okunamadıysa: telefonda duran profil kayıtlarını geri bağla
  if (!ham || bozuk[0] === 'tumu') {
    const n = profilKurtar(p);
    if (n) { degisti = true; kayitUyar(tt('Profil listesi okunamadı; {n} profil kurtarıldı. İsimlerini Profil ekranından değiştirebilirsin.', { n })); }
    else if (bozuk[0] === 'tumu') kayitUyar(tt('Profil listesi okunamadı. Eski hali yedeklendi.'));
  } else if (bozuk.length) kayitUyar(tt('Profil listesinde bozuk bir kısım düzeltildi.'));
  profiller = p;
  kayit = (aktifProfil() && kayitOku(PROFIL_ON + profiller.aktif)) || bosKayit();
  if (degisti) profilleriKaydet();
  Olay.yay('kayitYuklendi', { profil: profiller.aktif });
}
function profilKurtar(p) {
  let n = 0;
  for (const k of Depo.anahtarlar().sort()) {
    if (k.indexOf(PROFIL_ON) !== 0) continue;
    const id = k.slice(PROFIL_ON.length);
    if (!PROFIL_ID.test(id) || p.liste.some(e => e.id === id) || !kayitOku(k)) continue;   // okunamayan kayıt geri bağlanmaz
    p.liste.push({ id, ad: tt('Profil {n}', { n: p.liste.length + 1 }), t: 0 }); n++;
  }
  if (n) { p.eskiAktarildi = true; if (!p.aktif) p.aktif = p.liste[0].id; }
  return n;
}
function profilleriKaydet() { try { return Depo.yaz(PROFILLER, JSON.stringify(profiller)); } catch (e) { return false; } }
function aktifProfil() { return profiller.liste.find(p => p.id === profiller.aktif) || null; }
function kayitUyarilariGoster() { if (kayitUyarilari.length) { not(kayitUyarilari.join(' '), 7000); kayitUyarilari.length = 0; } }
// her değişiklikte aktif profile yazılır (otomatik kayıt); yer kalmadıysa false döner ve bir kez uyarılır
let kayitYazilamadi = false;
function kaydet() {
  const p = aktifProfil(); if (!p) return false;
  kayit.sonKayit = Date.now();
  let ok = false; try { ok = Depo.yaz(PROFIL_ON + p.id, JSON.stringify(kayit)); } catch (e) { }
  if (!ok && !kayitYazilamadi) { kayitYazilamadi = true; if (typeof not === 'function') not(tt('Kayıt yazılamadı: telefonda yer kalmamış olabilir. Yer açınca oyun yeniden kaydeder.'), 6000); }
  if (ok) kayitYazilamadi = false;
  return ok;
}
function eskiKayitVarMi() { return !profiller.eskiAktarildi && !!kayitOku(KAYIT); }
function profilAdUygun(ad) {
  ad = String(ad || '').replace(/\s+/g, ' ').trim();
  if (!ad) return { hata: tt('Bir isim yaz.') };
  if (ad.length > 16) return { hata: tt('İsim en çok 16 harf olabilir.') };
  if (profiller.liste.some(p => p.ad.toLocaleLowerCase('tr-TR') === ad.toLocaleLowerCase('tr-TR'))) return { hata: tt('Bu isimde bir profil zaten var.') };
  return { ad };
}
// devral: profil yokken oynanan rehberli ilk cümlenin ilerlemesi (XP, ayarlar) yeni profile geçer (ilk.js)
function profilOlustur(ad, devral) {
  kaydet();
  const id = 'p' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  let k = null;
  if (!profiller.eskiAktarildi) { k = kayitOku(KAYIT); profiller.eskiAktarildi = true; }   // profillerden önceki ilerleme ilk profile geçer
  profiller.liste.push({ id, ad, t: Date.now() });
  profiller.aktif = id; profilleriKaydet();
  kayit = k || (devral ? kayit : bosKayit()); kaydet();
  Olay.yay('kayitYuklendi', { profil: id });
  return id;
}
function profilSec(id) {
  if (!profiller.liste.some(p => p.id === id)) return;
  kaydet();
  profiller.aktif = id; profilleriKaydet();
  kayit = kayitOku(PROFIL_ON + id) || bosKayit();
  Olay.yay('kayitYuklendi', { profil: id });
}
function profilSil(id) {
  Depo.sil(PROFIL_ON + id); Depo.sil(YARIM_ON + id);
  profiller.liste = profiller.liste.filter(p => p.id !== id);
  if (profiller.aktif === id) { profiller.aktif = profiller.liste.length ? profiller.liste[0].id : null; kayit = (profiller.aktif && kayitOku(PROFIL_ON + profiller.aktif)) || bosKayit(); Olay.yay('kayitYuklendi', { profil: profiller.aktif }); }
  profilleriKaydet();
}
// profil listesinde gösterilen kısa özet (başka profillerin kaydı da okunur)
function profilOzet(id) {
  const k = id === profiller.aktif ? kayit : (kayitOku(PROFIL_ON + id) || bosKayit());
  let y = 0; for (const x in k.yildiz) y += k.yildiz[x];
  let kel = 0; for (const w in k.kel) if (k.kel[w][0] >= 2) kel++;
  return { lvl: k.sonLvl || 'A1', yildiz: y, kelime: kel, best: k.best || 0, online: k.istat.online || 0, galibiyet: k.istat.onlineGalibiyet || 0, sonKayit: k.sonKayit || 0 };
}

/* ---------------- yarım bölüm (içeriği game.js · yarimKaydet hazırlar) ---------------- */
function yarimAnahtar() { const p = aktifProfil(); return p ? YARIM_ON + p.id : null; }
function yarimOku() {
  const k = yarimAnahtar(); if (!k) return null;
  const ham = Depo.al(k); if (!ham) return null;
  let y = null; try { y = JSON.parse(ham); } catch (e) { }
  if (yarimGecerli(y)) return y;
  Depo.sil(k); kayitUyar(tt('Yarım bölüm açılamadı; bölümü baştan başlatabilirsin.'));   // okunamayan yarım kayıt oyunu kilitlemesin
  return null;
}
function yarimYaz(y) { const k = yarimAnahtar(); if (!k) return false; try { return Depo.yaz(k, JSON.stringify(y)); } catch (e) { return false; } }
function yarimSil() { const k = yarimAnahtar(); if (k) Depo.sil(k); }

// kayıtlar öğretim katmanı (SEVIYE) hazır olunca okunur; uygulamada boot() kalıcı hafıza açılınca okur
if (!Depo.uygulamaMi()) profilleriYukle();

/* =====================================================================
   İLERLEME: XP, GÜNLÜK HEDEF VE SERİ
   Oyun motoruna dokunmaz; olay yolunu (olay.js) dinler.
   · XP: her öğrenme anı XP getirir (XP_KURAL). Kaybedilen bölümde kazanılan XP kalır.
   · Günlük hedef: Rahat 20 / Normal 50 / Ciddi 100 XP (Ayarlar'dan). Gün telefonun yerel saatine göre.
   · Seri: günlük hedefe ulaşılan her gün seriyi 1 artırır. Bir gün kaçarsa seri biter;
     elde "seri dondurma" varsa kaçan gün için o harcanır ve seri sürer.
     Dondurma satılmaz: serinin her 7. gününde 1 tane kazanılır (en çok 2).
   Kayıttaki alanlar (kayit-sema.js doğrular):
     kayit.xp      → toplam XP
     kayit.gunluk  → { hedef: 20|50|100, gunler: { 'YYYY-AA-GG': o günün XP'si } }
     kayit.seri    → { gun, enUzun, sonGun: hedefin tamamlandığı son gün, dondurma, donan: [korunan günler] }
   ===================================================================== */
const HEDEFLER = [{ xp: 20, ad: 'Rahat' }, { xp: 50, ad: 'Normal' }, { xp: 100, ad: 'Ciddi' }];
const XP_KURAL = {
  cumle: 4, kusursuz: 2,          // kurulan cümle, hatasız kurulduysa ek
  hataBulundu: 3,                 // HATAYI BUL turu
  soruTemiz: 2, soru: 1,          // kelime sorusu (ilk denemede / sonradan)
  tanis: 1,                       // yeni kelime kartı
  bolumKazandi: 5, yildiz: 2,     // bölüm sonu: kazanınca + yıldız başına
  onlineKazandi: 5, onlineBitti: 2,
  gorev: 10,                      // Günün Görevi: günün ilk tamamlanışında bonus (gorev.js)
};
const SERI_DONDURMA_EN = 2, SERI_DONDURMA_ARALIK = 7;

/* ---- tarih yardımcıları (saf). Gün anahtarı yerel saatle 'YYYY-AA-GG'; farklar takvim günüyle (yaz saati sorun olmaz) ---- */
const iki = n => (n < 10 ? '0' : '') + n;
function gunAnahtar(t) { const d = new Date(t); return d.getFullYear() + '-' + iki(d.getMonth() + 1) + '-' + iki(d.getDate()); }
function gunUtc(a) { const p = a.split('-').map(Number); return Date.UTC(p[0], p[1] - 1, p[2]); }
function gunFarki(a, b) { return Math.round((gunUtc(b) - gunUtc(a)) / 864e5); }
function gunEkle(a, n) { const d = new Date(gunUtc(a) + n * 864e5); return d.getUTCFullYear() + '-' + iki(d.getUTCMonth() + 1) + '-' + iki(d.getUTCDate()); }
const bugunAnahtar = () => gunAnahtar(Date.now());

/* ---- seri kuralları (saf: yeni seri nesnesi ve olanlar döner) ---- */
// Seriyi bugüne getirir: kaçan günler varsa dondurma harcanır, yetmezse seri biter
function seriBugune(seri, bugun) {
  const s = Object.assign({}, seri, { donan: (seri.donan || []).slice() }), olan = { donduruldu: 0, bitti: false };
  if (!s.sonGun || !s.gun) return { s, olan };
  const fark = gunFarki(s.sonGun, bugun);
  if (fark <= 1) return { s, olan };                     // dün ya da bugün tamamlanmış (saat geri alındıysa da dokunma)
  const kacan = fark - 1;
  if (s.dondurma >= kacan) {
    s.dondurma -= kacan;
    for (let i = 1; i <= kacan; i++) s.donan.push(gunEkle(s.sonGun, i));
    s.sonGun = gunEkle(bugun, -1); olan.donduruldu = kacan;
  } else { olan.bitti = true; olan.biten = s.gun; s.gun = 0; s.sonGun = null; }
  s.donan = s.donan.slice(-30);
  return { s, olan };
}
// Günlük hedef tamamlandı: bugün seriye eklenir (aynı gün ikinci kez sayılmaz)
function seriHedefTamam(seri, bugun) {
  const s = Object.assign({}, seri, { donan: (seri.donan || []).slice() }), olan = { artti: false, yeniDondurma: false };
  if (s.sonGun === bugun) return { s, olan };
  s.gun = (s.gun || 0) + 1; s.sonGun = bugun; s.enUzun = Math.max(s.enUzun || 0, s.gun); olan.artti = true;
  if (s.gun % SERI_DONDURMA_ARALIK === 0 && s.dondurma < SERI_DONDURMA_EN) { s.dondurma++; olan.yeniDondurma = true; }
  return { s, olan };
}

/* ---- profil üzerindeki işlemler ---- */
let ilerlemeOturum = null;      // açık bölümün XP özeti (bolumBasladi → bolumBitti)
function bugunXp() { return kayit.gunluk.gunler[bugunAnahtar()] || 0; }
// Açılışta, profil değişince ve ekranlar açılırken: seri bugüne getirilir, oyuncuya söylenir
function ilerlemeGuncelle(sessiz) {
  if (!aktifProfil()) return;
  const r = seriBugune(kayit.seri, bugunAnahtar());
  if (!r.olan.donduruldu && !r.olan.bitti) return;
  kayit.seri = r.s; kaydet();
  if (sessiz) return;
  if (r.olan.donduruldu) kayitUyar(tt('❄ Seri dondurma kullanıldı ({n} gün). {s} günlük serin korunuyor.', { n: r.olan.donduruldu, s: r.s.gun }));
  else if (r.olan.biten > 1) kayitUyar(tt('{n} günlük serin bitti. Bugün hedefini tamamla, yeni seri başlasın.', { n: r.olan.biten }));
}
// XP ekle: günlük toplam, hedef ve seri güncellenir
function xpEkle(n) {
  if (ilerlemeOturum && ilerlemeOturum.goster) n = Math.ceil(n / 2);   // İngilizce gösterilerek oynanan bölümde XP yarı
  // profil yokken yalnız rehberli ilk cümle XP kazandırır (isim yazılınca yeni profile geçer: profilOlustur(ad, true))
  if (!n || (!aktifProfil() && !(ilerlemeOturum && ilerlemeOturum.mod === 'ilk'))) return;
  ilerlemeGuncelle();
  const bugun = bugunAnahtar(), g = kayit.gunluk, once = g.gunler[bugun] || 0;
  g.gunler[bugun] = once + n; kayit.xp += n;
  const anahtarlar = Object.keys(g.gunler);
  if (anahtarlar.length > 120) anahtarlar.sort().slice(0, anahtarlar.length - 120).forEach(k => delete g.gunler[k]);
  if (ilerlemeOturum) ilerlemeOturum.xp += n;
  if (once < g.hedef && once + n >= g.hedef) hedefTamamlandi(bugun);
}
function hedefTamamlandi(bugun) {
  const r = seriHedefTamam(kayit.seri, bugun); kayit.seri = r.s;
  if (!r.olan.artti) return;
  const ozet = { seri: r.s.gun, yeniDondurma: r.olan.yeniDondurma };
  Olay.yay('hedefTamam', ozet);
  if (ilerlemeOturum) ilerlemeOturum.hedefOldu = ozet;  // bölüm sonunda kutlanır
  else if (window.__acildi) not(tt('🎯 Günlük hedef tamam! 🔥 {n} gün seri', { n: r.s.gun }), 4000);
}
function hedefSec(xp) {
  if (!HEDEFLER.some(h => h.xp === xp)) return;
  kayit.gunluk.hedef = xp;
  if (bugunXp() >= xp) hedefTamamlandi(bugunAnahtar());  // yeni hedef bugün zaten aşıldıysa bugün sayılır
  kaydet();
}
function ilerlemeOzet() {
  const h = kayit.gunluk.hedef, x = bugunXp(), s = kayit.seri;
  return { hedef: h, bugun: x, oran: Math.min(1, x / h), tamam: x >= h, seri: s.gun, enUzun: s.enUzun, dondurma: s.dondurma, toplamXp: kayit.xp };   // xp adı oturumdaki (bu bölümün) XP'sine ait
}

/* ---- olaylar → XP ---- */
Olay.dinle('kayitYuklendi', () => { ilerlemeOturum = null; ilerlemeGuncelle(); });
Olay.dinle('bolumBasladi', v => { ilerlemeGuncelle(); ilerlemeOturum = { mod: v.mod, xp: 0, gunOnce: bugunXp(), hedefOldu: null, goster: !!v.goster }; });
Olay.dinle('cumleTamam', v => xpEkle(XP_KURAL.cumle + (v.kusursuz ? XP_KURAL.kusursuz : 0)));   // cumleBitti hemen sonra kaydeder
Olay.dinle('hataBulundu', () => { xpEkle(XP_KURAL.hataBulundu); kaydet(); });
Olay.dinle('soruBitti', v => { xpEkle(v.temiz ? XP_KURAL.soruTemiz : XP_KURAL.soru); kaydet(); });
Olay.dinle('kelimeTanisildi', () => { xpEkle(XP_KURAL.tanis); kaydet(); });
Olay.dinle('bolumBitti', v => {
  if (v.kazandi && v.mod !== 'test' && v.mod !== 'ilk') xpEkle(XP_KURAL.bolumKazandi + XP_KURAL.yildiz * (v.yildiz || 0));
  if (v.kazandi && v.mod === 'gunluk' && v.gorevIlk) xpEkle(XP_KURAL.gorev);

});

});

// İlerleme halkası: oran 0..1 · bitis verilirse ekran açılınca o orana dolar (CSS geçişi)
function halkaHtml(oran, ust, alt, sinif, bitis) {
  return `<span class="halka ${sinif || ''}" style="--p:${oran.toFixed(3)}"${bitis !== undefined ? ` data-p="${bitis.toFixed(3)}"` : ''}><b>${ust}</b><small>${alt}</small></span>`;
}
function halkalariDoldur(kok) { setTimeout(() => (kok || document).querySelectorAll('.halka[data-p]').forEach(e => { e.style.setProperty('--p', e.dataset.p); }), 60); }
function gunlukHtml() {
  const o = ilerlemeOzet();
  return `<button class="gunluk ${o.tamam ? 'tamam' : ''}" id="a-gunluk">${halkaHtml(o.oran, o.bugun, '/' + o.hedef)}
    <span class="g-yazi"><b class="${o.seri ? 'alev' : 'sonuk'}">🔥 ${tt('{n} gün seri', { n: o.seri })}</b><small>${o.tamam ? tt('Bugünün hedefi tamam ✓') : tt('Bugünkü hedefe {n} XP', { n: o.hedef - o.bugun })}</small></span>
    ${o.dondurma ? `<span class="g-don" title="${tt('Seri dondurma')}">❄ ${o.dondurma}</span>` : ''}</button>`;
}
function hedefSecimHtml() {
  const h = kayit.gunluk.hedef;
  return `<div class="bolum">${tt('Günlük hedef')}</div><div class="sekmeler kucuk" id="hedef-sec">${HEDEFLER.map(x => `<button data-hedef="${x.xp}" class="${x.xp === h ? 'secili' : ''}">${tt(x.ad)} · ${x.xp} XP</button>`).join('')}</div>
    <p class="aciklama kucuk">${tt('Hedefe ulaştığın her gün serin 1 artar. Her 7 günde 1 seri dondurma kazanırsın; kaçırdığın bir günü korur.')}</p>`;
}
// Bölüm sonu: kazanılan XP, günlük halkanın dolması, hedef tamamlandıysa kutlama
function sonucXpHtml(p) {
  if (!p) return '';
  const once = Math.min(1, p.gunOnce / p.hedef), h = p.hedefOldu, hedefXp = p.hedef;   // h: bu bölümde hedef tamamlandıysa
  return `<div class="xp-panel ${h ? 'kutla' : ''}">${halkaHtml(once, p.bugun, '/' + hedefXp, 'buyuk', p.oran)}
    <div class="xp-yazi"><b class="xp-art">+${p.xp} XP</b>
    <span>${h ? tt('🎯 GÜNLÜK HEDEF TAMAM!') : p.tamam ? tt('Bugünün hedefi tamam ✓') : tt('Hedefe {n} XP kaldı', { n: hedefXp - p.bugun })}</span>
    <span class="${p.seri ? 'alev' : 'sonuk'}">🔥 ${tt('{n} gün seri', { n: p.seri })}${h && h.seri > 1 ? ' ' + tt('(+1)') : ''}</span>
    ${h && h.yeniDondurma ? `<span class="don">${tt('❄ +1 seri dondurma kazandın')}</span>` : ''}</div></div>`;
}


/* =====================================================================
   SES
   · muzik  : sakin, sıcak lo-fi döngü (23 Kasım 2026, oyuncunun tarifiyle üretildi): yumuşak Rhodes piyano akorları
              (Fmaj9 · Em7 · Dm9 · Cmaj9), ahşap marimba ezgisi, yumuşak bas, sert olmayan hafif ritim, plak hışırtısı ve
              cızırtısı, hafif kaset salınımı; 75 BPM, 8 ölçü (25.6 sn), 22.05 kHz mono, dikişsiz döngü
              (oyun boyunca döner; menüde kısık ve boğuk).
   · spiker : erkek spiker sesi kaldırıldı (23 Kasım 2026, oyuncu isteği); Ses.spiker() hep false döner.
   · efektler: dosyasız, tarayıcıda üretilen sesler. Tahta oynanışı için:
       al (karoyu tut) · kay (yer değiştir) · geri (yanlış karo geri seker) · dus (karolar yağar)
       pop (baloncuk patlaması: dizi ve renk eşleşmesi) · zincir (zincirleme kombo) · super (süper patlama)
       bomba (CÜMLE BOMBASI) · saat (süre bitiyor) · altin (para kasaya düştü) · kasa (puan sayacı doldu: ka-çing)
   ===================================================================== */
const Ses = (function () {
  const ACx = window.AudioContext || window.webkitAudioContext;
  let ctx = null, ana, muzikG, efektG, kisG, filtre;
  const tampon = {};
  let istenen = null, muzikK = null, muzikKG = null, kaset = false, gurultu = null;
  let yogunlukSev = 0;

  function rampa(p, h, s) {
    if (!ctx) return;
    const t = ctx.currentTime;
    try { p.cancelScheduledValues(t); p.setValueAtTime(p.value, t); p.linearRampToValueAtTime(h, t + s); }
    catch (e) { p.value = h; }
  }

  function baslat() {
    if (ctx || !ACx) return;
    try { ctx = new ACx(); } catch (e) { ctx = null; return; }
    ana = ctx.createGain();
    try {
      const sk = ctx.createDynamicsCompressor();
      sk.threshold.value = -13; sk.knee.value = 10; sk.ratio.value = 6;
      sk.attack.value = 0.004; sk.release.value = 0.22;
      ana.connect(sk); sk.connect(ctx.destination);
    } catch (e) { ana.connect(ctx.destination); }

    kisG = ctx.createGain(); kisG.connect(ana);
    filtre = ctx.createBiquadFilter(); filtre.type = 'lowpass'; filtre.frequency.value = 18500; filtre.Q.value = 0.7;
    filtre.connect(kisG);

    muzikG = ctx.createGain(); muzikG.gain.value = kayit.ayar.muzik ? 0.76 : 0; muzikG.connect(filtre);
    efektG = ctx.createGain(); efektG.gain.value = kayit.ayar.efekt ? 0.8 : 0; efektG.connect(ana);

    try {
      const b = ctx.createBuffer(1, 1, 22050);
      const s = ctx.createBufferSource(); s.buffer = b; s.connect(ctx.destination); s.start(0);
    } catch (e) { }

    ['muzik'].forEach(ad => yukle(ad, () => {
      if (ad === 'muzik' && istenen) muzik(istenen);
    }));
  }

  function yukle(ad, bitti) {
    const gom = window.SES_VERI && window.SES_VERI[ad];
    const coz = ab => {
      try {
        const p = ctx.decodeAudioData(ab, buf => { tampon[ad] = buf; bitti(); }, () => bitti());
        if (p && p.catch) p.catch(() => { });
      } catch (e) { bitti(); }
    };
    if (gom) {
      try {
        const ik = atob(gom), u = new Uint8Array(ik.length);
        for (let k = 0; k < ik.length; k++) u[k] = ik.charCodeAt(k);
        coz(u.buffer);
      } catch (e) { bitti(); }
      return;
    }
    const x = new XMLHttpRequest();
    x.open('GET', 'ses/' + ad + (ad === 'muzik' ? '.wav' : '.mp3'), true);
    x.responseType = 'arraybuffer';
    x.onload = () => { if (!x.response || (x.status && x.status >= 400)) { bitti(); return; } coz(x.response); };
    x.onerror = () => bitti();
    try { x.send(); } catch (e) { bitti(); }
  }

  // tur: 'menu' (kısık, boğuk) · 'duello' (oyun, tam) · null (sus)
  function muzik(tur) {
    istenen = tur;
    if (!ctx) return;
    if (!tur) {
      if (muzikK) {
        const k = muzikK, g = muzikKG; muzikK = null;
        rampa(g.gain, 0, 0.6);
        setTimeout(() => { try { k.stop(); } catch (e) { } }, 700);
      }
      return;
    }
    if (kaset) { kaset = false; if (muzikK) { try { muzikK.stop(); } catch (e) { } muzikK = null; } }
    if (!muzikK && tampon.muzik) {
      muzikKG = ctx.createGain(); muzikKG.gain.value = 0; muzikKG.connect(muzikG);
      muzikK = ctx.createBufferSource(); muzikK.buffer = tampon.muzik; muzikK.loop = true; muzikK.connect(muzikKG);
      muzikK.start(ctx.currentTime + 0.05);
    }
    if (!muzikK) return;
    const hedefGain = tur === 'menu' ? 0.42 : (0.86 + yogunlukSev * 0.035);
    rampa(muzikKG.gain, hedefGain, 0.8);
    const p = filtre.frequency, t = ctx.currentTime;
    try {
      p.cancelScheduledValues(t); p.setValueAtTime(Math.max(60, p.value), t);
      p.exponentialRampToValueAtTime(tur === 'menu' ? 1450 : 18500, t + 0.8);
    } catch (e) { }
  }

  function yogunluk(sev, ani) {
    yogunlukSev = Math.max(0, Math.min(3, sev || 0));
    if (!ctx || !muzikKG || istenen !== 'duello' || kaset) return;
    const hedef = 0.86 + yogunlukSev * 0.035;
    if (ani) { try { muzikKG.gain.value = hedef; } catch (e) { } }
    else rampa(muzikKG.gain, hedef, 0.35);
  }

  function bogul(f, sure, geri) {
    if (!ctx || kaset || istenen !== 'duello') return;
    const p = filtre.frequency, t = ctx.currentTime;
    try {
      p.cancelScheduledValues(t); p.setValueAtTime(Math.max(60, p.value), t);
      p.exponentialRampToValueAtTime(Math.max(60, f), t + (sure || 0.08));
      if (geri) p.exponentialRampToValueAtTime(18500, t + (sure || 0.08) + geri);
    } catch (e) { }
  }

  // oyun sonu: müzik yavaşlayıp susar
  function kasetDur(sure) {
    if (!ctx || !muzikK || kaset) return;
    kaset = true; sure = sure || 0.7;
    const t = ctx.currentTime;
    try { const pr = muzikK.playbackRate; pr.cancelScheduledValues(t); pr.setValueAtTime(1, t); pr.exponentialRampToValueAtTime(0.08, t + sure); } catch (e) { }
    try { const gg = muzikKG.gain; gg.cancelScheduledValues(t); gg.setValueAtTime(gg.value, t); gg.linearRampToValueAtTime(0, t + sure + 0.05); } catch (e) { }
    const k = muzikK;
    setTimeout(() => { if (muzikK === k) { try { k.stop(); } catch (e) { } muzikK = null; } }, sure * 1000 + 150);
  }

  // erkek spiker sesi kaldırıldı (oyuncu isteği): oyundaki çağrılar zararsız kalsın diye hep false döner
  function spiker() { return false; }

  // ---- efektler (dosyasız, videodaki sıcak & parlak katmanlar) ----
  function gurultuTampon() {
    if (gurultu) return gurultu;
    const n = ctx.sampleRate, b = ctx.createBuffer(1, n, ctx.sampleRate), d = b.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
    return (gurultu = b);
  }

  function ton(f, d, tip, v, f2, gec) {
    const t0 = ctx.currentTime + (gec || 0), o = ctx.createOscillator(), g = ctx.createGain();
    o.type = tip || 'triangle';
    o.frequency.setValueAtTime(f, t0);
    if (f2) o.frequency.exponentialRampToValueAtTime(Math.max(20, f2), t0 + d);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(Math.max(0.0002, v), t0 + 0.007);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + d);
    o.connect(g); g.connect(efektG);
    o.start(t0); o.stop(t0 + d + 0.03);
  }

  function hisir(d, v, fc, gec, tip) {
    const t0 = ctx.currentTime + (gec || 0), s = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g = ctx.createGain();
    s.buffer = gurultuTampon();
    f.type = tip || 'lowpass'; f.frequency.value = fc;
    g.gain.setValueAtTime(Math.max(0.0002, v), t0);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + d);
    s.connect(f); f.connect(g); g.connect(efektG);
    s.start(t0, Math.random() * 0.5); s.stop(t0 + d + 0.03);
  }

  const EF = {
    kes: (v, g, h) => {
      [587.33, 783.99, 1174.66].forEach((f, i) => {
        ton(f * h, 0.14, 'triangle', 0.115 * v, null, g + i * 0.042);
        ton(f * 2 * h, 0.075, 'sine', 0.045 * v, null, g + i * 0.042 + 0.01);
      });
    },
    savur: (v, g) => { hisir(0.16, 0.07 * v, 2100, g, 'bandpass'); ton(820, 0.12, 'sine', 0.095 * v, 340, g); },
    yanlis: (v, g) => { ton(170, 0.28, 'triangle', 0.14 * v, 80, g); hisir(0.14, 0.07 * v, 520, g); },
    darbe: (v, g) => { ton(110, 0.2, 'sine', 0.22 * v, 42, g); hisir(0.1, 0.1 * v, 350, g); },
    patlama: (v, g) => { hisir(0.55, 0.16 * v, 850, g); ton(82, 0.28, 'sine', 0.19 * v, 36, g); },
    damga: (v, g) => {
      [523.25, 659.25, 783.99, 1046.5, 1318.5, 1567.98].forEach((f, i) => ton(f, 0.22, 'triangle', 0.095 * v, null, g + i * 0.055));
      [523.25, 783.99, 1046.5].forEach(f => ton(f, 0.65, 'sine', 0.08 * v, null, g + 0.36));
    },
    yukselis: (v, g) => [392, 523.25, 659.25, 783.99, 1046.5].forEach((f, i) => ton(f, 0.16, 'triangle', 0.105 * v, null, g + i * 0.065)),
    bitirici: (v, g) => [783.99, 987.77, 1174.66, 1567.98].forEach((f, i) => ton(f, 0.18, 'triangle', 0.095 * v, null, g + i * 0.05)),
    savustur: (v, g) => { [880, 1174.66, 1760].forEach((f, i) => ton(f, 0.15, 'triangle', 0.095 * v, null, g + i * 0.042)); hisir(0.12, 0.055 * v, 3400, g, 'bandpass'); },
    gong: (v, g) => [392, 523.25, 659.25, 783.99, 1046.5].forEach((f, i) => ton(f, 0.18, 'sine', 0.095 * v, null, g + i * 0.075)),
    kelime: (v, g, h) => ton(440 * h, 0.13, 'triangle', 0.11 * v, 880 * h, g),
    tik: (v, g, h) => ton(660 * h, 0.04, 'sine', 0.06 * v, null, g),
    ko: (v, g) => { hisir(0.28, 0.11 * v, 1400, g); ton(260, 0.22, 'triangle', 0.1 * v, 115, g); },
    zafer: (v, g) => {
      [523.25, 659.25, 783.99, 1046.5, 1318.5, 1567.98, 2093].forEach((f, i) => ton(f, 0.24, 'triangle', 0.095 * v, null, g + i * 0.065));
      [523.25, 783.99, 1046.5, 1567.98].forEach(f => ton(f, 0.9, 'sine', 0.08 * v, null, g + 0.48));
    },
    yenilgi: (v, g) => { [440, 349.23, 261.63, 196].forEach((f, i) => ton(f, 0.3, 'triangle', 0.11 * v, f * 0.97, g + i * 0.18)); hisir(0.9, 0.09 * v, 450, g + 0.1); },
    yukle: (v, g) => ton(240, 0.28, 'triangle', 0.08 * v, 740, g),
    atilma: (v, g) => ton(280, 0.11, 'sine', 0.07 * v, 540, g),
    nota: (v, g, h) => { ton(523.25 * h, 0.15, 'triangle', 0.115 * v, null, g); ton(1046.5 * h, 0.08, 'sine', 0.045 * v, null, g); },

    // ---- karo tahtası (videodaki yumuşak hareket ve coşkulu patlamalar) ----
    al: (v, g, h) => {

    kay: (v, g, h) => {

    geri: (v, g, h) => {

    dus: (v, g, h) => {

    },
    pop: (v, g, h) => {
      ton(380 * h, 0.085, 'sine', 0.17 * v, 1340 * h, g);
      ton(760 * h, 0.095, 'triangle', 0.1 * v, 1760 * h, g + 0.012);
      ton(1520 * h, 0.06, 'sine', 0.045 * v, 2280 * h, g + 0.02);

    },
    zincir: (v, g, h) => {

    },
    super: (v, g) => {

      hisir(0.68, 0.15 * v, 1250, g);

        ton(freq * 2, 0.13, 'sine', 0.04 * v, null, g + 0.065 + i * 0.048);
      });
    },
    bomba: (v, g) => {
      ton(80, 0.48, 'sine', 0.24 * v, 32, g);
      hisir(0.82, 0.17 * v, 980, g);
      [523.25, 783.99, 1046.5, 1567.98].forEach((f, i) => ton(f, 0.18, 'triangle', 0.07 * v, null, g + 0.16 + i * 0.05));
    },
    saat: (v, g, h) => { ton(1200 * h, 0.035, 'sine', 0.06 * v, null, g); ton(600 * h, 0.05, 'triangle', 0.06 * v, null, g + 0.01); },
    altin: (v, g, h) => {
      ton(2349.32 * h, 0.11, 'sine', 0.065 * v, null, g);
      ton(3520 * h, 0.07, 'sine', 0.032 * v, null, g + 0.005);
    },
    kasa: (v, g) => {
      ton(260, 0.05, 'triangle', 0.055 * v, 150, g);
      [1318.5, 1975.5, 2637, 3520].forEach((f, i) => ton(f, 0.65 - i * 0.1, 'sine', (0.065 - i * 0.01) * v, null, g + 0.07));

  };

  const GAM = [0, 2, 4, 7, 9];
  function nota(adim, ses, gecikme) {
    const a = ((adim % 10) + 10) % 10, yari = 12 * Math.floor(a / 5) + GAM[a % 5];

  }

  function cal(ad, o) {
    if (!ctx || !EF[ad]) return;
    o = o || {};
    try { EF[ad]((o.ses == null ? 1 : o.ses) * 1.2, o.gecikme || 0, o.hiz || 1); } catch (e) { }
  }

  function zarf(gn, t, a, h, s, d) {
    gn.gain.setValueAtTime(0.0001, t);
    gn.gain.exponentialRampToValueAtTime(Math.max(0.0002, h), t + a);
    gn.gain.setValueAtTime(Math.max(0.0002, h), t + a + s);
    gn.gain.exponentialRampToValueAtTime(0.0001, t + a + s + d);
  }

  function sentez(tur, o) {
    if (!ctx) return;
    o = o || {};
    try {
      const t = ctx.currentTime + (o.gecikme || 0), v = o.ses == null ? 0.55 : o.ses, cik = ctx.createGain();
      cik.connect(efektG);
      let gn, src, f, osc;
      if (tur === 'gok') {
        src = ctx.createBufferSource(); src.buffer = gurultuTampon(); src.start(t, Math.random() * 0.3); src.stop(t + 1.3);
        f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.setValueAtTime(2400, t); f.frequency.exponentialRampToValueAtTime(140, t + 1.0);
        gn = ctx.createGain(); zarf(gn, t, 0.005, v * 0.9, 0.04, 1.1); src.connect(f); f.connect(gn); gn.connect(cik);
      } else if (tur === 'gum') {
        osc = ctx.createOscillator(); osc.type = 'sine'; osc.frequency.setValueAtTime(140, t); osc.frequency.exponentialRampToValueAtTime(38, t + 0.32);

      } else if (tur === 'odul') {
        [0, 4, 7, 12, 16].forEach((yari, i) => {
          const oo = ctx.createOscillator(); oo.type = 'triangle'; oo.frequency.value = 523.25 * Math.pow(2, yari / 12);
          const gg = ctx.createGain(); zarf(gg, t + i * 0.055, 0.005, v * 0.32, 0.03, 0.32);
          oo.connect(gg); gg.connect(cik); oo.start(t + i * 0.055); oo.stop(t + i * 0.055 + 0.45);

/* ---------------- dizi (zincir): hedefin satırda soldan sağa dizilmiş başı ----------------

    let k = 0;

    if (!k) continue;

    let son = false; for (let i = 0; i < k; i++) if (T.h[r][c0 + i].id === R.sonKaro) son = true;
    const puan = k * 1000 + (son ? 100 : 0) + (bas.id === R.capa ? 50 : 0) + r;
    if (!best || puan > best.puan) best = { r, c0, k, puan };

/* ---------------- oyuncunun hamlesi ----------------

/* ---------------- parça / cümle tamam: dizi patlar ---------------- */

}

/* ---------------- renk eşleşmesi, yerçekimi, yeni karolar ---------------- */
function renkliMi(k) { return !!k && !k.kilit && !k.zincir && k.ci >= 0; }

    for (let a = 0; a < uz[0]; a++) {
      let bas = 0;
      for (let b = 1; b <= uz[1]; b++) {
        const k0 = al(a, bas), k1 = b < uz[1] ? al(a, b) : null;
        if (b < uz[1] && renkliMi(k0) && renkliMi(k1) && k0.ci === k1.ci) continue;
        if (b - bas >= 3 && renkliMi(k0)) { const l = []; for (let i = bas; i < b; i++) l.push(al(a, i)); kosu.push(l); }
        bas = b;
      }
    }
  };
  tara([T.rows, T.cols], (r, c) => T.h[r][c]);
  tara([T.cols, T.rows], (c, r) => T.h[r][c]);
  return kosu;
}
function renkPatlat(T, kosular) {
  const set = new Set(), say = new Map();
  let superRenk = -1;
  kosular.forEach(l => { l.forEach(k => { set.add(k); say.set(k, (say.get(k) || 0) + 1); }); if (l.length >= 5) superRenk = l[0].ci; });
  say.forEach((n, k) => { if (n > 1) superRenk = k.ci; });   // L / T biçimi
  // SÜPER PATLAMA: o renkteki bütün serbest karolar
  if (superRenk >= 0) karolar(T, k => renkliMi(k) && k.ci === superRenk).forEach(k => set.add(k));
  T.dalga++;
  let mx = 0, my = 0;
  [...set].forEach((K, i) => { const p = karoMerkez(K); mx += p.x; my += p.y; karoPatlat(K, i * 0.012, 'renk'); sparkBurst(p.x, p.y, KARO_RENK[K.ci], 10, 240, 0.5); });
  mx /= set.size; my /= set.size;
  const carpan = D ? D.li + 1 : 1, pts = set.size * 20 * T.dalga * carpan;
  if (D) addScore(pts, mx, my);
  G.bombaDolum += set.size * 0.025 + (superRenk >= 0 ? 0.08 : 0);
  const f = Math.round(L.bh * 0.8);
  if (superRenk >= 0) { popup(tt('SÜPER PATLAMA!'), mx, my - f, '#ffd23d', Math.round(f * 1.2), 1.5); Ses.cal('super', { ses: 0.8 }); G.shake = Math.max(G.shake, 7); firework(mx, my, KARO_RENK[superRenk]); }
  if (T.dalga >= 2) { popup(tt('ZİNCİRLEME KOMBO!'), mx, my - f * 0.2, '#3dff7a', f, 1.4); popup(tt('KOMBO x{n}', { n: T.dalga + 1 }), mx, my + f * 0.9, '#ffffff', Math.round(f * 0.9), 1.4); Ses.cal('zincir', { ses: 0.7, hiz: 1 + T.dalga * 0.06 }); }
  else if (superRenk < 0) popup(tt('POP!'), mx, my - f * 0.3, KARO_RENK[[...set][0].ci], f, 1.1);
  popup('+' + pts, mx, my + f * 1.8, '#ffe066', Math.round(f * 0.7), 1.2);
  Ses.cal('pop', { ses: 0.8, hiz: 1 + Math.min(4, T.dalga) * 0.05 });

// sütunlarda karolar aşağı düşer; sabit hücreler (hatalı cümle, etkin dizi) zemin gibidir
function yercekimi(T) {
  for (let c = 0; c < T.cols; c++) {
    let r = T.rows - 1;
    while (r >= 0) {
      if (sabitHucre(T, r, c)) { r--; continue; }
      const alt = r; let ust = r; while (ust - 1 >= 0 && !sabitHucre(T, ust - 1, c)) ust--;
      const liste = []; for (let q = alt; q >= ust; q--) if (T.h[q][c]) liste.push(T.h[q][c]);
      for (let q = alt; q >= ust; q--) T.h[q][c] = null;
      liste.forEach((k, i) => { if (k.r !== alt - i) k.dus = true; hucreKoy(T, k, alt - i, c); });
      r = ust - 1;
    }
  }
}
function doldur(T) {
  const bos = serbestHucreler(T); if (!bos.length) return;
  const metin = yeniMetinler(G.R, bos.length), sutun = {};
  bos.sort((a, b) => b.r - a.r).forEach((h, i) => {
    const k = karoYap(metin[i], -1); hucreKoy(T, k, h.r, h.c);
    k.ci = guvenliRenk(T, h.r, h.c);
    const p = hucreMerkez(h.r, h.c); k.x = p.x;
    // üst bölüm: tahtanın üstünden düşer · sabit hücrenin altında kalan bölüm: yerinde belirir
    let acik = true; for (let q = 0; q < h.r; q++) if (sabitHucre(T, q, h.c)) acik = false;
    if (acik) { sutun[h.c] = (sutun[h.c] || 0) + 1; k.y = T.y - sutun[h.c] * T.ch; k.dus = true; }
    else { k.y = p.y; k.olcek = 0; k.buyu = true; }

}
function kaskadBaslat() { const T = G.T; if (!T) return; T.kaskad = true; }
// engine, tahtadaki hareket bitince çağırır: boşluk varsa düşür ve doldur, renk eşleşmesi varsa patlat, yoksa dur
function kaskadAdim() {
  const T = G.T, R = G.R; if (!T) return;
  if (R) zincirYenile(R);
  if (serbestHucreler(T).length) { yercekimi(T); doldur(T); return; }
  const g = renkKapali(R) ? [] : renkGruplari(T);

  T.kaskad = false; T.dalga = 0;
  // hedefin tamamlanması için tahtada eksik kalan karo varsa (öbeğin sıradaki kelimesi, patlayan karo) yukarıdan getirilir
  if (R && !R.bitti && R.tahtaHazir && G.state === 'playing') { const e = eksikGerekenler(R); if (e.length && eksikleriGetir(R, e)) { T.kaskad = true; return; } }
  // düşen ya da yukarıdan gelen karo diziyi uzatmış olabilir: sayılır, dizi tamamsa patlar
  if (R && R.hedef && !R.bitti && R.tahtaHazir && G.state === 'playing') {

// eksik hedef karoları: en üst satırdaki gereksiz karolar küçük bir patlamayla yer açar, yerine eksik karo yukarıdan düşer
function eksikleriGetir(R, eksik) {
  const T = G.T, koru = R.hedef ? hedefDizi(R) : [R.duzelt];

  eksik.forEach(txt => {
    const aday = karolar(T, k => !k.kilit && !k.zincir && !k.dus && koru.indexOf(k.txt) < 0);
    if (!aday.length) return;
    const ust = Math.min(...aday.map(k => k.r)), eski = pick(aday.filter(k => k.r === ust));
    karoPatlat(eski, 0, 'kucuk');
    const k = karoYap(txt, -1); hucreKoy(T, k, eski.r, eski.c); k.ci = guvenliRenk(T, eski.r, eski.c);
    const p = karoMerkez(k); k.x = p.x; k.y = T.y - T.ch * (1.2 + n * 0.4); k.dus = true; n++;
  });

}
function renkKapali(R) { return !R || !D || !!D.ilkCumle; }
// bazı turlarda tahtada eksik başlayan karo birkaç saniye sonra yukarıdan iner
function bekleyenTik(dt) {

  const p = karoMerkez(k); k.x = p.x; k.y = T.y - T.ch * 1.2; k.dus = true; k.parla = 1.5;
  popup(tt('YENİ KARO!'), p.x, T.y + T.ch * 0.3, '#9ff6ff', Math.round(L.bh * 0.5), 1.1);

/* ---------------- süre ---------------- */
// tur süresi: oyuncu isteğiyle 3 katı (ör. 5 kelimelik A1 cümlesi 47 → 141 sn, 6 harfli kelime 26 → 78 sn)
const SURE_KAT = 3;
function sureHesapla(R) {
  if (D.ilkCumle || R.tip === 'tanis') return 0;
  const li = D.li; let s;
  if (R.tip === 'kur') s = 12 + hedefDizi(R).length * clamp(7 - li * 0.5, 4.2, 7);
  else if (R.tip === 'sav') s = 14 + R.m.tokens.length * 1.6;
  else s = 9 + hedefTumu(R).length * clamp(2.8 - li * 0.15, 1.9, 2.8);
  return Math.round(s * (D.hizKat || 1) * SURE_KAT);
}
function sureTik(dt) {
  const R = G.R; if (!R || R.bitti || !R.tahtaHazir || !R.sure || (typeof dzAcik !== 'undefined' && dzAcik)) return;
  R.sureKalan -= dt * (G.slowT > 0 ? 0.45 : 1);
  const s = Math.ceil(R.sureKalan);
  if (s <= 5 && s > 0 && s !== R.sureUyari) { R.sureUyari = s; Ses.cal('saat', { ses: 0.5, hiz: s <= 2 ? 1.25 : 1 }); }
  if (R.sureKalan <= 0) sureDoldu(R);
}
function sureDoldu(R) {
  const T = G.T, yer = { x: T.x + T.cols * T.cw / 2, y: T.y + T.rows * T.ch * 0.35, txt: '' };
  if (R.tip === 'sav') { savKacirdi(R, null, null, true); return; }
  const need = hedefDizi(R), dogru = need[R.zincir ? R.zincir.k : 0];
  if (R.tip === 'kur') { const kr = tt('Sıradaki kelime: "{d}"', { d: dogru }); hataYap(yer, tt('SÜRE DOLDU!'), kr, '#ff9a3c'); cumleHataKaydi(R, '(süre doldu)', dogru, kr); }
  else {
    hataYap(yer, tt('SÜRE DOLDU!'), tt('Sıradaki harf: "{d}"', { d: dogru }), '#ff9a3c'); testHatasi('(süre doldu)');
    if (D.st) { testBitir(false); return; }
  }
  if (G.state !== 'playing') return;   // gösterge doldu
  R.sureKalan = R.sure * 0.5; R.sureUyari = 0;
  ipucuGoster(R, 3.5);
}

/* ---------------- ipucu: sıradaki doğru hamle (koç, süre dolunca, test botu) ---------------- */
function enYakin(liste, h) { let best = null, bd = 1e9; liste.forEach(k => { const d = Math.abs(k.r - h.r) * 1.2 + Math.abs(k.c - h.c); if (d < bd) { bd = d; best = k; } }); return best; }
function konum(k) { return { r: k.r, c: k.c }; }
function ipucuHamle(R) {
  const T = G.T; if (!R || !T || !R.tahtaHazir || R.bitti) return null;
  if (R.tip === 'sav') {
    const m = R.m, hedef = R.kilitKarolar.find(k => k.idx === m.idx); if (!hedef) return null;
    if (m.tip === 'sira') { const k2 = R.kilitKarolar.find(k => k.idx === m.idx2); return k2 ? { a: konum(hedef), b: konum(k2) } : null; }
    if (!R.duzelt) return { dokun: konum(hedef) };
    const A = karolar(T, k => !k.kilit && k.txt === R.duzelt)[0];
    return A ? { a: konum(A), b: konum(hedef) } : null;
  }
  const need = hedefDizi(R), n = need.length, z = R.zincir;
  if (z) {
    const uc = { r: z.r, c: z.c0 + z.k };
    const A = enYakin(karolar(T, k => !k.kilit && !k.zincir && k.txt === need[z.k] && !(k.r === uc.r && k.c === uc.c)), uc);
    return A ? { a: konum(A), b: uc } : null;
  }
  const ilkler = karolar(T, k => !k.kilit && k.txt === need[0]);
  if (!ilkler.length) return null;
  const gecerli = ilkler.filter(k => k.c + n <= T.cols);
  if (gecerli.length && n >= 2) {
    for (const w0 of gecerli) {
      const hedef = { r: w0.r, c: w0.c + 1 }, A = enYakin(karolar(T, k => !k.kilit && k !== w0 && k.txt === need[1]), hedef);
      if (A) return { a: konum(A), b: hedef };
    }
    return null;
  }
  const w0 = gecerli[0] || ilkler[0];
  if (n === 1) return { a: konum(w0), b: { r: w0.r, c: w0.c > 0 ? w0.c - 1 : w0.c + 1 } };
  return { a: konum(w0), b: { r: w0.r, c: Math.min(w0.c, T.cols - n) } };
}
// test botu ve kaybetme denemesi için: dizinin sonuna yanlış karo
function yanlisHamle(R) {
  const T = G.T; if (!R || !T || !R.tahtaHazir || R.bitti) return null;
  if (R.tip === 'sav') {
    const m = R.m, diger = R.kilitKarolar.find(k => k.idx !== m.idx && k.idx !== m.idx2);
    const A = karolar(T, k => !k.kilit)[0];
    return diger && A ? { a: konum(A), b: konum(diger) } : null;
  }
  const z = R.zincir, need = hedefDizi(R); if (!z) return null;
  const uc = { r: z.r, c: z.c0 + z.k }, A = enYakin(karolar(T, k => !k.kilit && !k.zincir && k.txt !== need[z.k] && !(k.r === uc.r && k.c === uc.c)), uc);
  return A ? { a: konum(A), b: uc } : null;
}
function ipucuGoster(R, sure) { const h = ipucuHamle(R); if (h) G.ipucu = { h, t: sure || 3, R }; }

/* =====================================================================
   HATALAR VE DÜZELTME
   ===================================================================== */
function duzeltme(metin, ok, sure) { if (!metin) return; G.duz = { metin, ok: !!ok, t: sure || 4.5, max: sure || 4.5 }; }
function hataKaydet(o) {

/* =====================================================================
   TAHTA YERLEŞİMİ
   Kuyunun üstünde Türkçe hedef kutusu, altında süre çubuğu, onun altında karo tahtası.
   Sütun sayısı hedefe göre (game.js tahtaBoyut: cümlenin kelime / kelimenin harf sayısı, en az 6): hedefin
   tamamı bir satıra yatay sığar. Çok sütunlu tahtada karolar daralır, uzun kelime karonun içinde dikey yazılır.
   ===================================================================== */
// Tahtanın kullanabileceği alan: Türkçe kutusu ve süre çubuğunun altı (rehberli ilk cümlede koç baloncuğuna da yer kalır)
const SURE_H = 10;
function tahtaAlani(R) {
  const I = L.in, ph = promptYuksekligi(R), koc = D && D.ilkCumle ? Math.round(clamp(L.stripH * 1.5, 44, 60)) : 0;
  const top = I.y + 5 + ph + 6 + SURE_H + 8;

}
function hucreBoyu(cols, rows, A) { const cw = A.bw / cols; let ch = A.bh / rows; if (cols <= 6) ch = Math.min(ch, cw * 1.3); return { cw, ch }; }
// Satır sayısı: hedefin (ve tuzakların) en uzun kelimesi karoda en büyük yazıyla okunacak şekilde seçilir;
// yazı yeterince büyükse (12 px) çok satır tercih edilir. Çok sütunlu tahtada karolar uzar, kelime dikey yazılır.
function tahtaSatir(cols, R) {

  const yazilar = !R ? [] : R.tip === 'sav' ? (R.satir ? [] : R.m.tokens).concat(R.duzelt ? [R.duzelt] : []) : hedefTumu(R).concat(R.cel || []);
  let best = enCok, bestP = -1;

    const { cw, ch } = hucreBoyu(cols, r, A), p = Math.max(2, Math.min(cw, ch) * 0.07);
    let min = 99; yazilar.forEach(x => { min = Math.min(min, karoYaziOlc(x, cw - p, ch - p).fs); });
    const puan = Math.min(min, 12) * 100 + r;   // önce okunurluk, eşitse çok satır

}
function tahtaYerlesim() {

  L.promptAlan = { x: I.x + 4, y: I.y + 5, w: I.w - 8, h: A.ph };

// tahtada süren hareket: düşen / beliren karo ya da patlama varken yeni hamle ve sıradaki kaskad adımı bekler

/* =====================================================================
   GÜNCELLEME
   ===================================================================== */
function update(dt) {
  G.t += dt;
  const I = L.in;
  if (G.state !== 'paused' && G.state !== 'menu') {
    const liste = ZAM.splice(0), calis = [];
    for (const z of liste) { z.t -= dt; if (z.t <= 0) calis.push(z.f); else ZAM.push(z); }
    calis.forEach(f => { try { f(); } catch (e) { console.error(e); } });
  }
  if (D && D.online) onlineTik();
  ilkTik(dt);                                         // rehberli ilk cümlenin koçu (ilk.js)
  if (G.state === 'playing') {
    G.slowT = Math.max(0, G.slowT - dt);
    const R = G.R;
    if (R && !R.bitti) {
      R.t += dt;
      if (!R.tahtaHazir && !R.bekle) { G.spawnT -= dt; if (G.spawnT <= 0) tahtaDoldur(R); }
      sureTik(dt); bekleyenTik(dt);
    }
  } else if (G.state === 'dying') {
    G.dieT += dt;
    if (Math.random() < dt * 8) sparkBurst(rnd(I.x, I.x + I.w), rnd(I.y + I.h * 0.3, I.y + I.h), '#ff5030', 12, 240, 0.7);
    if (G.dieT > 1.7) { G.state = 'over'; dojoBitti(false); }
  }
  if (G.state !== 'paused') {
    tahtaTik(dt);
    if (G.ipucu) { G.ipucu.t -= dt; if (G.ipucu.t <= 0 || G.ipucu.R !== G.R) G.ipucu = null; }
    if (G.duz) { G.duz.t -= dt; if (G.duz.t <= 0) G.duz = null; }
    if (G.sweep >= 0) { G.sweep += dt * 1.3; if (G.sweep > 1.6) G.sweep = -1; }
    paraTik(dt);                                      // puan kasası: uçan paralar ve seri hâlinde yükselen sayaç (game.js)
    G.scorePulse = Math.max(0, G.scorePulse - dt * 2.5); G.comboPulse = Math.max(0, G.comboPulse - dt * 3);
    G.shake *= Math.pow(0.0009, dt); if (G.shake < 0.2) G.shake = 0;
    G.flash = Math.max(0, G.flash - dt * 1.2);
    G.gauge = clamp(G.hata / HATA_MAX, 0, 1);
    G.gaugeShown += (G.gauge - G.gaugeShown) * Math.min(1, dt * 5);
    if (G.ofke && Math.random() < dt * 30) addP({ type: 'flame', x: rnd(I.x, I.x + I.w), y: I.y + I.h + rnd(-4, 4), vx: rnd(-10, 10), vy: rnd(-90, -40), life: rnd(0.4, 0.8), max: 0.8, col: '#ff8a2a', s: rnd(6, 12), gr: -30, drag: 0.97 });
    if (Math.random() < dt * 3) addP({ type: 'dot', x: rnd(0, W), y: H + 4, vx: rnd(-8, 8), vy: rnd(-40, -18), life: rnd(4, 7), max: 7, col: Math.random() < 0.6 ? '#ffe3a3' : '#fff6e0', s: rnd(0.8, 1.8), gr: 0, drag: 1 });
    updateParticles(dt);
  }

// karoların hareketi: yer değiştirme kayarak, düşüş yerçekimiyle, yeni karo büyüyerek; hareket bitince kaskad adımı
function tahtaTik(dt) {
  for (let i = PATLAYAN.length - 1; i >= 0; i--) { PATLAYAN[i].t += dt; if (PATLAYAN[i].t > 0.5) PATLAYAN.splice(i, 1); }
  for (let i = DUSEN.length - 1; i >= 0; i--) { const k = DUSEN[i]; k.vy += 1800 * dt; k.y += k.vy * dt; k.x += k.vx * dt; k.dt += dt; if (k.y > H + 80 || k.dt > 2) DUSEN.splice(i, 1); }
  const T = G.T; if (!T || !T.cw) return;
  let hareket = false;
  for (let r = 0; r < T.rows; r++) for (let c = 0; c < T.cols; c++) {
    const k = T.h[r][c]; if (!k) continue;
    const p = hucreMerkez(r, c, k.span);
    if (k.geri) {
      // yanlış yere bırakılan karo hedefe uzanır, sonra yerine geri seker
      const g = k.geri; g.t += dt;
      const q = hucreMerkez(g.r, g.c), hedef = g.t < 0.12 ? { x: lerp(p.x, q.x, 0.55), y: lerp(p.y, q.y, 0.55) } : p;
      k.x += (hedef.x - k.x) * Math.min(1, dt * 22); k.y += (hedef.y - k.y) * Math.min(1, dt * 22);
      if (g.t > 0.42) { k.geri = null; k.x = p.x; k.y = p.y; }
    } else if (k.dus) {
      k.vy += 2600 * dt; k.y += k.vy * dt; k.x += (p.x - k.x) * Math.min(1, dt * 18);
      if (k.y >= p.y) { k.y = p.y; k.vy = 0; k.dus = false; k.ez = 1; }
      else hareket = true;
    } else {
      const dx = p.x - k.x, dy = p.y - k.y;
      if (Math.abs(dx) + Math.abs(dy) > 0.6) { k.x += dx * Math.min(1, dt * 16); k.y += dy * Math.min(1, dt * 16); } else { k.x = p.x; k.y = p.y; }
    }
    if (k.buyu) { k.olcek = Math.min(1, k.olcek + dt * 5); if (k.olcek >= 1) k.buyu = false; else hareket = true; }

}

// HIZ bilgisayarı: her cümleyi seviyesine göre bir sürede bitirir (biraz rastgele); bazen hata yapar
function botHizTik(o) {
  const r = o.rakip;

  }

    ${OD.bot ? '<button class="big" id="os-tekrar">' + tt('TEKRAR OYNA') + '</button>' : OD.rol === 'ev' && OD.rakip ? '<button class="big" id="os-tekrar">' + tt('TEKRAR KAPIŞ') + '</button>' : OD.rakip ? `<p class="aciklama" style="text-align:center">${tt('{ad} yeni maç başlatırsa oyun kendiliğinden açılır.', { ad: esc(OD.rakip.ad) })}</p>` : ''}

}

/* =====================================================================
   İLK 60 SANİYE: rehberli ilk cümle
   Telefonda hiç profil (ve profillerden önceki eski kayıt) yoksa oyun, isim ve
   seviye sormadan önce kısa bir A1 cümlesiyle açılır:
     karşılama → Türkçesi okunur → karolar tahtaya yağar, koç ve el işareti ne yapılacağını gösterir
     → cümle tamam: ilk XP ve günlük halka → isim (profil) → günlük hedef → seviye seçimi
   Rehberli cümlede ilk kelime sol başta hazır durur; tuzak kelime, süre, hata göstergesi ve renk patlaması yoktur.
   Yanlış kelimeyi dizinin sonuna koymak engellenir (ceza, hata defteri yok), karo yerine geri seker.
   Karolarda Türkçe yazmaz; Türkçe cümle karolar yağmadan önce okunur (oyunun kuralları aynı).
   İçerik ve öğretim kuralları değişmez: cümle ilk bölümün kendi cümlelerinden seçilir.
   Motorla bağlantı (kancalar):
     game.js   dojoBaslat(r, { ilkCumle }), baslangicDuzelt (ilk kelime sol başta, çapa), hamle (yanlış → ilkUyar),
               sureHesapla / gostergeEkle / renkKapali (rehberde kapalı), dojoBitti → ilkSonuc
     engine.js update → ilkTik, tahtaYerlesim (koç baloncuğuna yer)
     kayit.js  profilOlustur(ad, true): rehberli cümlenin XP'si yeni profile geçer
   ===================================================================== */
let ilkDurum = null;   // { adim: yerleşen kelime sayısı, blok, bekleT, ipucu, uyari, uyariT, m }

// Karşılama yalnız telefonda hiç profil ve eski kayıt yokken gösterilir
function ilkGosterilsinMi() { return !profiller.liste.length && !eskiKayitVarMi(); }
// Profil yoksa nereye: ilk kez açılıyorsa karşılama, değilse isim formu
function profilsizAc() { if (ilkGosterilsinMi()) ilkKarsila(); else profilYeniAc(); }

// Rehber cümlesi: ilk bölümün 3 (yoksa 4) kelimelik ilk cümlesi
function ilkCumleSec() {
  const r = seviyeRakipleri('A1')[0], l = r ? cumleler(r.id) : [];
  return l.find(s => s.w.length === 3) || l.find(s => s.w.length === 4) || l.slice().sort((a, b) => a.w.length - b.w.length)[0] || null;
}

/* ---------------- karşılama ---------------- */

    <button class="big" id="ilk-bas">${tt('İLK CÜMLENİ KUR ▶')}</button>

}
function ilkBaslat() {

/* ---------------- oyun içi koç ---------------- */
function ilkUyar(m) {
  const d = ilkDurum; if (!d) return;
  d.uyari = m; d.uyariT = 2.4; d.ipucu = true;
  Ses.cal('tik', { ses: 0.3 });
}
// Her karede (engine.js update): koçun yazısı; ilk kelimede hemen, sonrakilerde 2,5 sn sonra ya da hatalı denemede el işareti
function ilkTik(dt) {
  if (!D || !D.ilkCumle) { if (ilkDurum) { ilkDurum = null; ilkKocYaz(''); } return; }
  const d = ilkDurum || (ilkDurum = { adim: 0, sonAdim: -1, bekleT: 0, ipucu: false, uyari: '', uyariT: 0 });
  if (G.state !== 'playing') { ilkKocYaz(''); return; }
  d.uyariT = Math.max(0, d.uyariT - dt);
  const R = G.R;
  let m = '';
  if (R && R.tip === 'kur' && !R.bitti) {
    if (R.tahtaHazir) {
      if (d.sonAdim !== d.adim) { d.sonAdim = d.adim; d.bekleT = 0; d.ipucu = false; d.uyariT = 0; }   // yeni kelime: eski uyarı silinir
      d.bekleT += dt;
      const need = hedefDizi(R), k = R.zincir ? R.zincir.k : 1, kelime = need[Math.min(k, need.length - 1)];
      const ipucu = d.adim === 0 || d.ipucu || d.bekleT > 2.5;
      if (ipucu && !G.surukle) { const h = ipucuHamle(R); if (h) G.ipucu = { h, t: 0.3, R }; }
      if (d.adim === 0) m = tt('“{k}” kelimesini tut ve parlayan yere sürükle.', { k: kelime });
      else m = ipucu ? tt('İpucu: “{k}” kelimesini dizinin sağına sürükle.', { k: kelime }) : tt('Sıradaki kelime hangisi? Onu dizinin sağına sürükle.');
    } else if (d.adim === 0) m = tt('Önce Türkçesini dinle. Sonra İngilizcesini kelime kelime kuracaksın.');
  }
  if (d.uyariT > 0 && m) m = d.uyari;
  ilkKocYaz(m);
}
// Koç baloncuğu: tahtanın hemen altında (tahta yerleşimi ona yer ayırır); Türkçe cümleyi ve karoları kapatmaz.
// Ekran okuyucu da duyurur (role="status").
function ilkKocYaz(m) {
  const el = document.getElementById('koc'); if (!el) return;
  if (el.dataset.m !== m) { el.dataset.m = m; el.textContent = m; el.classList.toggle('show', !!m); }
  if (!m) return;
  const T = G.T, alt = T ? T.y + T.rows * T.ch + 8 : L.in.y + L.in.h * 0.8;
  el.style.top = Math.round(alt) + 'px';
  el.style.maxWidth = Math.round(Math.min(L.in.w - 8, W - 16)) + 'px';
}
Olay.dinle('dogruHamle', () => { if (D && D.ilkCumle && ilkDurum) ilkDurum.adim++; });
