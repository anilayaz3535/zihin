<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Stacking Sentences</title>
<style>
  :root{--bh:60px;--pbh:44px}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;background:#1d0f19;color:#fef2e0;
    font-family:Fredoka,Poppins,'Trebuchet MS',sans-serif;user-select:none;-webkit-user-select:none;touch-action:none}
  canvas#c{position:fixed;inset:0;display:block;touch-action:none}

  #sys{position:fixed;z-index:6;display:flex;gap:8px}
  body.land #sys{top:10px;right:10px}
  body.port #sys{right:8px;bottom:calc((var(--bh) - 36px) / 2 + 2px);flex-direction:row;gap:6px}
  #sys button.off{opacity:.45;filter:grayscale(1)}
  #sys button{width:36px;height:36px;border-radius:50%;border:2px solid #f2ac3a;background:rgba(49,26,42,.85);color:#fcdeb1;
    font:700 16px/1 Fredoka,Poppins,sans-serif;box-shadow:0 0 10px rgba(242,172,58,.45);cursor:pointer;padding:0;touch-action:none}

  /* ---------- overlay ---------- */
  #ov{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;padding:14px;
    background:radial-gradient(ellipse at center,rgba(46,25,39,.45),rgba(26,14,23,.82))}
  #ov.show{display:flex}
  .card{width:100%;max-width:500px;max-height:100%;overflow:auto;padding:20px 18px 18px;text-align:center;
    background:linear-gradient(rgba(57,31,49,.94),rgba(39,21,34,.94));border:2px solid #f2ac3a;
    box-shadow:0 0 26px rgba(242,172,58,.45),inset 0 0 30px rgba(242,172,58,.1);border-radius:6px}
  .logo{font-weight:700;line-height:.9;letter-spacing:2px;font-size:clamp(40px,12vw,68px)}
  .logo .a{color:#fcdae6;text-shadow:0 0 6px #f04c88,0 0 18px #f04c88,0 0 34px #f04c88}
  .logo .b{color:#fdefdb;text-shadow:0 0 6px #f1a427,0 0 18px #f1a427,0 0 34px #f1a427}
  .sub{margin:8px 0 12px;color:#ffd23d;letter-spacing:2px;font-size:clamp(12px,3.6vw,15px);white-space:nowrap;text-shadow:0 0 10px rgba(255,190,40,.7)}
  .how{list-style:none;padding:0;margin:0 0 14px;text-align:left;font-size:15px;line-height:1.3;color:#fde7c7}
  .how li{padding:6px 8px 6px 30px;position:relative;border-bottom:1px solid rgba(242,172,58,.13)}
  .how li:before{content:attr(data-i);position:absolute;left:4px;top:6px;width:19px;height:19px;border-radius:4px;
    background:#4f2b44;border:1px solid #f2ac3a;color:#fcdeb1;font-size:12px;text-align:center;line-height:17px}
  .how b{color:#fff}
  .gold{color:#ffc53d!important}.red{color:#ff4d5e!important}
  .big{font:700 26px/1 Fredoka,Poppins,sans-serif;letter-spacing:2px;color:#4a2a00;padding:12px 40px;border-radius:10px;border:3px solid #fff2b0;
    background:linear-gradient(#fff07a,#ffc21a 55%,#d88a00);box-shadow:0 7px 0 #6d4300,0 0 24px rgba(255,190,40,.7);cursor:pointer;margin:4px 0 10px}
  .big:active{transform:translateY(4px);box-shadow:0 3px 0 #6d4300}
  .keys{font-size:12.5px;color:#c3a594;letter-spacing:.3px}
  .best{margin-top:6px;font-size:14px;color:#ffd23d;letter-spacing:1px}
  .go{font-size:clamp(40px,11vw,60px);font-weight:700;color:#ffd0d4;text-shadow:0 0 8px #ff2f5b,0 0 24px #ff2f5b;letter-spacing:2px}
  .stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0}
  .stats div{border:1px solid rgba(242,172,58,.45);padding:8px 6px;background:rgba(54,29,46,.7)}
  .stats span{display:block;font-size:12px;color:#fcdeb1;letter-spacing:1px}
  .stats b{font-size:24px;color:#fff;text-shadow:0 0 8px #f1a427}
  .last{font-size:14px;color:#fde7c7;margin:0 0 14px;line-height:1.35}
  .last i{color:#ffd23d}

  /* ---------- tutorial ---------- */
  .tut .logo{font-size:clamp(30px,9vw,46px)}
  .tut .sub{margin:4px 0 6px}
  .slide{display:none}
  .slide.on{display:block;animation:fin .35s ease}
  @keyframes fin{from{opacity:0;transform:translateX(14px)}to{opacity:1;transform:none}}
  .st{font-size:21px;letter-spacing:1.5px;color:#fce5c2;text-shadow:0 0 10px #f1a427;margin:4px 0 8px}
  .st i{font-style:normal;display:inline-block;background:#4f2b44;border:1px solid #f2ac3a;border-radius:4px;padding:0 7px;margin-right:8px;color:#fcdeb1;font-size:15px;vertical-align:2px}
  .stxt{text-align:left;font-size:15.5px;line-height:1.35;color:#fdebd1;min-height:96px}
  .stxt b{color:#fff}
  .stxt ul{margin:4px 0 0;padding-left:18px}
  .demo{position:relative;height:150px;margin:0 auto 10px;max-width:400px;border-radius:6px;overflow:hidden;
    background-color:#1d0f19;border:2px solid #f25c93;border-bottom-color:#ffbf2a;
    background-image:linear-gradient(rgba(241,164,39,.16) 1px,transparent 1px),linear-gradient(90deg,rgba(241,164,39,.16) 1px,transparent 1px);background-size:26px 26px}
  .dtr{position:absolute;left:6px;right:6px;top:44px;text-align:center;color:#ffe48a;font-weight:700;font-size:14px;text-shadow:0 0 8px rgba(255,190,40,.7)}
  .dlab{position:absolute;left:0;right:0;top:66px;text-align:center;color:#fce5c2;font-weight:700;font-size:12px;text-shadow:0 0 8px #f1a427}
  .mt{position:absolute;left:50%;bottom:calc(100% + 3px);transform:translateX(-50%);font-size:11.5px;font-weight:700;color:#fff;background:rgba(0,0,0,.75);
    border:1px solid var(--c);border-radius:9px;padding:0 7px;white-space:nowrap;text-shadow:none}
  .p3{position:absolute;left:50%;top:44px;transform:translateX(-50%);color:#fcdeb1;font-weight:700;font-size:15px;text-shadow:0 0 8px #f1a427;animation:p3 2.6s infinite;white-space:nowrap}
  @keyframes p3{0%,48%{opacity:0;margin-top:0}56%{opacity:1}90%{opacity:1;margin-top:-22px}100%{opacity:0;margin-top:-26px}}
  .ctxt{position:absolute;left:0;right:0;text-align:center;font-weight:700}
  .chips{position:absolute;left:0;right:0;bottom:12px;display:flex;justify-content:center;gap:4px;align-items:center}
  .chips span{border:1px solid #f2ac3a;color:#fce5c2;border-radius:4px;padding:1px 6px;font-weight:700;font-size:13px;background:rgba(54,29,46,.8)}
  .chips em{color:#fcdeb1;font-style:normal}
  .dots{display:flex;justify-content:center;gap:7px;margin:8px 0}
  .dots b{width:9px;height:9px;border-radius:50%;background:#6b395c;border:1px solid #f2ac3a}
  .dots b.on{background:#fcdeb1;box-shadow:0 0 8px #f1a427}
  .nav{display:flex;gap:10px;justify-content:center;margin-bottom:6px}
  .nb{font:700 18px/1 Fredoka,Poppins,sans-serif;letter-spacing:1px;color:#fce5c2;background:rgba(54,29,46,.9);border:2px solid #f2ac3a;border-radius:8px;
    padding:10px 18px;box-shadow:0 0 10px rgba(242,172,58,.4);cursor:pointer;min-width:120px}
  .nb:disabled{opacity:.3}
  .skip{margin:6px 0 4px;color:#fcdeb1;font-size:14px;text-decoration:underline;cursor:pointer}
  .sec{font:700 17px/1 Fredoka,Poppins,sans-serif;color:#fce5c2;background:transparent;border:2px solid #f2ac3a;border-radius:8px;padding:9px 18px;cursor:pointer;margin-top:4px}

  /* ---------- level select ---------- */
  .lvgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0 6px}
  .lv{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 4px;border-radius:8px;border:2px solid var(--c);cursor:pointer;
    background:linear-gradient(rgba(65,35,56,.95),rgba(41,22,35,.95));box-shadow:0 0 10px var(--c);color:#fef2e0;font-family:Fredoka,Poppins,sans-serif}
  .lv b{font-size:30px;line-height:1;color:#fff;text-shadow:0 0 10px var(--c)}
  .lv span{font-size:15px;font-weight:700;letter-spacing:1px}
  .lv em{font-style:normal;color:#ffd23d;font-size:18px;letter-spacing:2px;text-shadow:0 0 8px rgba(255,190,40,.7)}
  .lv small{font-size:12px;color:#fcdeb1}
  .lv:active{transform:translateY(2px)}
  .row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:4px}
  /* ---------- mistakes list ---------- */
  .mtitle{color:#ff9a3c;font-weight:700;letter-spacing:1px;margin:2px 0 4px;font-size:16px}
  .mlist{text-align:left;max-height:32vh;overflow:auto;border:1px solid rgba(242,172,58,.3);padding:2px 8px;margin:0 0 12px;background:rgba(35,19,30,.6)}
  .mr{display:flex;gap:8px;align-items:flex-start;padding:7px 0;border-bottom:1px solid rgba(242,172,58,.12);font-size:15px}
  .mr:last-child{border-bottom:0}
  .mr b{color:#fff}
  .mr em{color:#ff9a3c;font-style:normal;font-size:13px}
  .mr small{display:block;color:#ceb6a9;font-size:12.5px;margin-top:2px;line-height:1.3}
  .mr small i{color:#ffd23d}
  .mr u{color:#51d663;text-decoration:none;border-bottom:2px solid #51d663}
  .spk{flex:none;width:32px;height:32px;border-radius:50%;border:1px solid #f2ac3a;background:#4f2b44;color:#fff;font-size:14px;cursor:pointer;padding:0}
  .prog{color:#fce5c2;font-size:15px;margin:0 0 10px}
  .prog em{font-style:normal;color:#ffd23d;letter-spacing:2px}
  /* ---------- tutorial extras ---------- */
  .flip3{position:absolute;left:50%;top:34px;width:120px;height:36px;margin-left:-60px;perspective:500px}
  .fin{position:relative;width:100%;height:100%;transform-style:preserve-3d;animation:fl 3.4s infinite}
  .fc{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;align-items:center;justify-content:center;border:2px solid #ff2f5b;
    border-radius:6px;color:#fff;font-weight:700;font-size:19px;background:rgba(255,47,91,.15);box-shadow:0 0 12px #ff2f5b,inset 0 0 8px #ff2f5b;text-shadow:0 0 8px #ff2f5b}
  .fc.bk{transform:rotateY(180deg);background:rgba(255,47,91,.4);font-size:17px}
  @keyframes fl{0%,28%{transform:rotateY(0)}40%,78%{transform:rotateY(180deg)}90%,100%{transform:rotateY(360deg)}}
  .pill{position:absolute;display:flex;align-items:center;gap:5px;border:2px solid var(--c);border-radius:9px;padding:4px 9px;color:#fff;font-weight:700;font-size:14px;
    background:rgba(47,26,41,.95);box-shadow:0 0 9px var(--c)}
  .pill b{background:var(--c);color:#111;border-radius:9px;padding:0 6px;font-size:12px}
  .pj{animation:pj 3.4s infinite}
  @keyframes pj{0%,22%{transform:scale(1)}27%{transform:scale(.88);filter:brightness(1.6)}33%,100%{transform:scale(1)}}
